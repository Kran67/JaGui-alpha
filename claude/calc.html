  for (const para of String(text).split('\n')) {
    const words=para.split(' '); let cur='';
    for (const w of words) { const test=cur?cur+' '+w:w; if(_measureCtx.measureText(test).width<=maxW) cur=test; else { if(cur)out.push(cur); cur=w; } }
    out.push(cur);
  }

}
function _drawDlgIcon(ctx, type, cx, cy, r) {

    ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.95,cy+r*0.8); ctx.lineTo(cx-r*0.95,cy+r*0.8); ctx.closePath(); ctx.fill(); ctx.stroke();

    ctx.restore(); return;
  }

  else if (type==='information') { bg='#3A8DDE'; glyph='i'; }
  else if (type==='confirmation') { bg='#5B7CE0'; glyph='?'; }
  else { ctx.restore(); return; }
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(r*1.25)}px Georgia, system-ui`; ctx.fillText(glyph, cx, cy+r*0.06);

// MessageDlg dérive de GUIWindow : vraie barre de titre (croix WinButton),

class MessageDlg extends GUIWindow {
  // opts: { caption, message, dlgType, buttons:[{text,result,isDefault,isCancel}], input, inputValue, inputMask }
  constructor(opts={}) {
    super(opts.caption ?? 'Message', { x:0, y:0, width:360, height:160 });
    this.message = opts.message ?? '';
    this.dlgType = opts.dlgType ?? MessageType.CUSTOM;
    this.buttons = opts.buttons ?? [{ text:'OK', result:'ok', isDefault:true, isCancel:true }];
    this.showInput = !!opts.input;

    this._resolveFn=null; this._closed=false; this._wm=null;

    this._buildContent(opts.inputValue ?? '');
  }
  _buildContent(inputValue) {
    const ca = this.contentArea;
    // dialogue auto-dimensionné : jamais de scrollbar (taille = contenu)
    ca._contentSize = () => ({ w:0, h:0 });
    // corps dessiné (icône + message) — ne capte aucun évènement
    this._bodyW = new BaseWidget('msgdlgbody_'+(++_idCounter), { x:0, y:0, width:10, height:10 });
    this._bodyW.hitTest = () => false;
    const dlg = this;
    this._bodyW.render = function(ctx) {
      const t=getTheme().messageDlg, bx=this.bounds.x, by=this.bounds.y;
      if (dlg.dlgType!==MessageType.CUSTOM) _drawDlgIcon(ctx, dlg.dlgType, bx+dlg._iconCX, by+dlg._iconCY, dlg._iconR);
      ctx.save(); ctx.font=fontToCSS(t.font); ctx.fillStyle=colorToCSS(t.text); ctx.textBaseline='top'; ctx.textAlign='left';
      const lines=dlg._lines||[]; for(let i=0;i<lines.length;i++) ctx.fillText(lines[i], bx+dlg._msgX, by+dlg._msgY+i*dlg._lh);
      ctx.restore();
    };
    ca.addChild(this._bodyW);
    if (this.showInput) {
      this._input = this._inputMask ? new MaskedTextBox({x:0,y:0,width:10,height:30},{mask:this._inputMask}) : new TextBox({x:0,y:0,width:10,height:30});
      if (inputValue) this._input.value = inputValue;
      this._input.on('submit', () => { const d=this.buttons.find(b=>b.isDefault)||this.buttons[0]; this._finish(d.result); });
      ca.addChild(this._input);
    }
    for (const def of this.buttons) {
      const btn=new Button(def.text, {x:0,y:0,width:80,height:30}); btn.tabIndex=0;
      btn.on('click', () => this._finish(def.result));
      btn.on('keydown', e => { if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ this._finish(def.result); e.preventDefault?.(); } });

    this._lines=lines; this._lh=lh; this._iconR=iconR; this._iconCX=pad+iconR; this._iconCY=padTop+iconR;
    const msgX=pad+(iconW?iconW+gap:0); this._msgX=msgX; this._msgY=padTop;
    this._bodyW.setBounds({ x:0, y:0, width:cw, height:innerH });
    if (this._input) { this._input.bounds.x=msgX; this._input.bounds.y=padTop+msgH+8; this._input.bounds.width=cw-msgX-pad; this._input.bounds.height=30; }
    _measureCtx.font=fontToCSS(getTheme().button.normal.font);

    for (let i=this.buttons.length-1;i>=0;i--) {
      const def=this.buttons[i], w=Math.max(80, Math.ceil(_measureCtx.measureText(def.text).width)+28);
      def._w.bounds.width=w; def._w.bounds.height=btnH;
      def._w.bounds.x=bx-w; def._w.bounds.y=innerH-btnH-12; bx-=w+8;

  }
  center(wm) { this.bounds.x=Math.round((wm.bounds.width-this.bounds.width)/2); this.bounds.y=Math.round((wm.bounds.height-this.bounds.height)/2.4); }
  showModal(wm) {

    return new Promise(res => { this._resolveFn=res; });
  }
  _finish(result) {

  // croix de la barre de titre
  _onClose() { this._finish(this._cancelResult); }
  // Échap
  _onCancel() { this._finish(this._cancelResult); }
}

// ── Helpers façon $j.dialogs (renvoient une Promise {result,value}) ──────────
const _BTN = {

  YES:    { text:'Oui',     result:'yes',    isDefault:true },
  NO:     { text:'Non',     result:'no',     isCancel:true  },
};
const Dialogs = {
  _wm() { return (typeof engine!=='undefined' && engine) ? engine.windowManager : null; },
  messageDlg(message, opts={}) {
    const wm=opts.wm || this._wm(); if(!wm) return Promise.resolve({result:'cancel'});

      caption: opts.caption ?? 'Message', message, dlgType: opts.dlgType ?? MessageType.CUSTOM,

  },
  showMessage(message, opts={}) { return this.messageDlg(message, { ...opts, caption:opts.caption??'Information', dlgType:MessageType.CUSTOM, buttons:[{ ..._BTN.OK }] }); },
  alert:   function(message, opts={}) { return this.messageDlg(message, { ...opts, caption:opts.caption??'Alerte',       dlgType:MessageType.WARNING,      buttons:[{..._BTN.OK}] }); },
  warning: function(message, opts={}) { return this.alert(message, opts); },
  error:   function(message, opts={}) { return this.messageDlg(message, { ...opts, caption:opts.caption??'Erreur',       dlgType:MessageType.ERROR,        buttons:[{..._BTN.OK}] }); },
  information(message, opts={}) { return this.messageDlg(message, { ...opts, caption:opts.caption??'Information', dlgType:MessageType.INFORMATION,  buttons:[{..._BTN.YES},{..._BTN.NO}] }); },
  confirm(message, opts={}) { return this.messageDlg(message, { ...opts, caption:opts.caption??'Confirmation', dlgType:MessageType.CONFIRMATION, buttons:[{..._BTN.OK},{..._BTN.CANCEL}] }); },
  confirmation(message, opts={}) { return this.confirm(message, opts); },
  prompt(caption, message, value='', opts={}) {
    return this.messageDlg(message, { ...opts, caption:caption??'Saisie', dlgType:MessageType.CUSTOM, input:true, inputValue:value, buttons:[{..._BTN.OK},{..._BTN.CANCEL}] });
  },
};

// ── Toast : notifications non bloquantes (couche dédiée, voir installToasts) ─
function _toastDims(ctx, n) {
  const t=getTheme().toast; ctx.font=fontToCSS(t.font);
  const maxW=300, padL=44, padR=14;
  const lines=_dlgWrapLines(n.message, maxW-padL-padR, fontToCSS(t.font));
  const lh=17; n._lines=lines; n._lh=lh;

}
function _toastRect(wm, i) {
  const margin=16, gap=10; let y=margin;

  const n=wm._toasts[i], w=n.w||300;

function _renderToasts(ctx, wm) {

  const th=getTheme().toast;
  for (let i=0;i<wm._toasts.length;i++) {
    const n=wm._toasts[i]; _toastDims(ctx, n);
    const r=_toastRect(wm, i), ease=1-(1-n.anim)*(1-n.anim);

    ctx.fillStyle=colorToCSS(accent); drawRoundRect(ctx,x,y,5,r.h,{tl:th.radius,bl:th.radius,tr:0,br:0}); ctx.fill();
    // pastille icône
    ctx.fillStyle=colorToCSS(accent); ctx.beginPath(); ctx.arc(x+26,y+r.h/2,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 13px Georgia, system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText({info:'i',success:'✓',warning:'!',error:'✕'}[n.type]||'i', x+26, y+r.h/2+0.5);

    ctx.font=fontToCSS(th.font); ctx.fillStyle=colorToCSS(th.text); ctx.textAlign='left'; ctx.textBaseline='top';

// Monte la couche toasts sur un WindowManager (patch non intrusif).
function installToasts(wm) {
  if (wm._toastHost) return wm._toastHost;
  wm._toasts=[];
  const _upd=wm.update.bind(wm);
  wm.update=function(dt){
    _upd(dt); const arr=wm._toasts; if(!arr.length) return; let changed=false;

      n.age+=dt;
      if (!n.dying) { if(n.anim<1){ n.anim=Math.min(1,n.anim+dt/180); changed=true; } if(n.age>=n.dur) n.dying=true; }
      else { n.anim-=dt/220; changed=true; if(n.anim<=0) n._dead=true; }
    }

    if (changed) wm.markDirty();
  };

    show(message, opts={}) { const n={ message, type:opts.type??'info', dur:opts.duration??3400, age:0, anim:0, dying:false, w:300, h:52 }; wm._toasts.push(n); wm.markDirty(); return n; },
    info(m,o={}){ return this.show(m,{...o,type:'info'}); },
    success(m,o={}){ return this.show(m,{...o,type:'success'}); },
    warning(m,o={}){ return this.show(m,{...o,type:'warning'}); },
    error(m,o={}){ return this.show(m,{...o,type:'error'}); },

}

const canvas = document.getElementById('canvas');
const container = document.getElementById('canvasContainer');
const mobileInput = document.getElementById('mobileInput');

// ── Detect touch device ──────────────────────────────────────────────────
const isTouchDevice = () => navigator.maxTouchPoints > 0 || 'ontouchstart' in window;

// ── Adaptive window sizing ───────────────────────────────────────────────
// Returns { w, h, x, y } that fits the current viewport
function winBounds(desiredW, desiredH, offsetX=0, offsetY=0) {
  const vw = canvas.width, vh = canvas.height;
  const margin = isTouchDevice() ? 8 : 20;
  const w = Math.min(desiredW, vw - margin*2);
  const h = Math.min(desiredH, vh - margin*2);
  const x = Math.max(margin, Math.min(offsetX || Math.floor((vw-w)/2), vw-w-margin));
  const y = Math.max(margin, Math.min(offsetY || Math.floor((vh-h)/2), vh-h-margin));
  return {x, y, width:w, height:h};
}

// ── Canvas resize ─────────────────────────────────────────────────────────
let engine = null;

function resizeCanvas() {
  canvas.width  = container.clientWidth;
  canvas.height = container.clientHeight;
  if (engine) {
    engine.windowManager.bounds.width  = canvas.width;
    engine.windowManager.bounds.height = canvas.height;
    engine._offscreen.width  = canvas.width;
    engine._offscreen.height = canvas.height;
    engine._fullRedraw = true;
    // Nudge any windows that are now out of bounds back into view
    for (const win of engine.windowManager.windows) {
      const b = win.bounds, m = 10;
      if (b.x + b.width  > canvas.width  - m) win.bounds.x = Math.max(m, canvas.width  - b.width  - m);
      if (b.y + b.height > canvas.height - m) win.bounds.y = Math.max(m, canvas.height - b.height - m);
      if (b.x < m) win.bounds.x = m;
      if (b.y < m) win.bounds.y = m;
    }
  }
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); });

engine = new GUIEngine(canvas);

// Couche toasts (notifications non bloquantes) montée sur le WindowManager
const toasts = installToasts(engine.windowManager);

// ── Mobile keyboard via hidden input ─────────────────────────────────────
// When a TextBox/TextArea is focused, proxy the hidden input's events
mobileInput.addEventListener('input', e => {
  // On mobile, 'input' fires with e.data = the new character(s)
  if (!e.data) return;
  for (const ch of e.data) {
    engine.windowManager.handleKey('keydown', ch, ch.charCodeAt(0), false, false, false);

      ctx.moveTo(b.x, b.y + b.height - .5);  ctx.lineTo(b.x + b.width, b.y + b.height - .5);
    }
    ctx.stroke();
    ctx.fillStyle = colorToCSS(on ? c.gripHover : c.grip);
    const cx = b.x + b.width / 2, cy = b.y + b.height / 2;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      if (vert) ctx.arc(cx, cy + k * 5, 1.1, 0, 7); else ctx.arc(cx + k * 5, cy, 1.1, 0, 7);
      ctx.fill();
    }
    ctx.restore();
  }
}

// ── TileView : window switcher. Shows the active window large in the centre and
//    the other windows as live "miniatures" in a strip along one edge. Click a
//    miniature → it becomes the active (centre) window. Strip side is dockable
//    (left/right/top/bottom) and scrolls when the miniatures overflow.
//    windows: [{ label, title?, color? , draw?(ctx,rect,active) }]
class TileView extends BaseWidget {
  constructor(windows, bounds, opts = {}) {
    super('tileview_' + (++_idCounter), bounds);
    this.windows = windows || [];
    this._active = opts.activeIndex ?? 0;
    this.dock = opts.dock || 'left';        // miniatures strip side
    this.thumbW = opts.thumbW || 104;
    this.thumbH = opts.thumbH || 74;
    this.gap = opts.gap ?? 10;
    this.pad = opts.pad ?? 10;
    this._scroll = 0; this._hover = -1;
    this.background = null; this.tabIndex = 0; this.capturesDrag = true; this.cursor = 'default';
    this.on('mouseleave', () => { if (this._hover !== -1) { this._hover = -1; this.markDirty(); } });
    this.on('mousemove', e => this._move(e));
    this.on('click', e => this._click(e));
    const scroll = e => {
      const m = this._maxScroll(); const d = (e.deltaY ?? e.delta ?? 0) > 0 ? 48 : -48;
      const n = Math.max(0, Math.min(m, this._scroll + d));
      if (n !== this._scroll) { this._scroll = n; this.markDirty(); }
      e.stopPropagation?.();
    };
    this.on('wheel', scroll); this.on('scroll', scroll);
    this.on('keydown', e => {
      if (!this.windows.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') this.activeIndex = Math.min(this.windows.length - 1, this._active + 1);
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') this.activeIndex = Math.max(0, this._active - 1);
    });
  }
  get activeIndex() { return this._active; }
  set activeIndex(v) { v = Math.max(0, Math.min(this.windows.length - 1, v)); if (v !== this._active) { this._active = v; this._scroll = 0; this._emit(); this.markDirty(); } }
  get activeWindow() { return this.windows[this._active] ?? null; }
  // ── geometry ──
  _horiz() { return this.dock === 'top' || this.dock === 'bottom'; }
  _stripThick() { return (this._horiz() ? this.thumbH : this.thumbW) + this.pad * 2; }
  _regions() {
    const b = this.bounds, t = this._stripThick();
    if (this.dock === 'left')   return { strip:{ x:b.x, y:b.y, w:t, h:b.height }, active:{ x:b.x+t, y:b.y, w:b.width-t, h:b.height } };
    if (this.dock === 'right')  return { strip:{ x:b.x+b.width-t, y:b.y, w:t, h:b.height }, active:{ x:b.x, y:b.y, w:b.width-t, h:b.height } };
    if (this.dock === 'top')    return { strip:{ x:b.x, y:b.y, w:b.width, h:t }, active:{ x:b.x, y:b.y+t, w:b.width, h:b.height-t } };
    return { strip:{ x:b.x, y:b.y+b.height-t, w:b.width, h:t }, active:{ x:b.x, y:b.y, w:b.width, h:b.height-t } };
  }
  _thumbList() { const o = []; for (let i = 0; i < this.windows.length; i++) if (i !== this._active) o.push(i); return o; }
  _thumbExtent() { return (this._horiz() ? this.thumbW : this.thumbH) + this.gap; }
  _stripLen(s) { return this._horiz() ? s.w : s.h; }
  _contentLen() { const n = this._thumbList().length; return n ? n * this._thumbExtent() - this.gap + this.pad * 2 : 0; }
  _maxScroll() { const { strip } = this._regions(); return Math.max(0, this._contentLen() - this._stripLen(strip)); }
  _thumbRects() {
    const { strip } = this._regions(), horiz = this._horiz(), out = [];
    let pos = (horiz ? strip.x : strip.y) + this.pad - this._scroll;
    const cross = (horiz ? strip.y : strip.x) + this.pad;
    for (const i of this._thumbList()) {
      out.push({ index: i, rect: horiz ? { x:pos, y:cross, w:this.thumbW, h:this.thumbH } : { x:cross, y:pos, w:this.thumbW, h:this.thumbH } });
      pos += this._thumbExtent();
    }
    return out;
  }
  _thumbAt(x, y) { for (const t of this._thumbRects()) { const r = t.rect; if (x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h) return t.index; } return -1; }
  // ── interaction ──
  _move(e) { const i = this._thumbAt(e.x, e.y); if (i !== this._hover) { this._hover = i; this.cursor = i >= 0 ? 'pointer' : 'default'; this.markDirty(); } }
  _click(e) { const i = this._thumbAt(e.x, e.y); if (i >= 0) this.activeIndex = i; }
  _emit() {
    this.emit({ type: 'change', target: this, activeIndex: this._active, activeWindow: this.activeWindow, x: 0, y: 0,
      stopPropagation() { this.stopped = true; }, preventDefault() { this.defaultPrevented = true; }, stopped: false, defaultPrevented: false });
  }
  // ── colour helpers ──
  _col(win) { return win.color || '#7b61ff'; }
  _tint(hex, a) { const c = hexToColor(hex), m = v => Math.round(v + (255 - v) * a); return `rgb(${m(c.r)},${m(c.g)},${m(c.b)})`; }
  _shade(hex, a) { const c = hexToColor(hex), m = v => Math.round(v * (1 - a)); return `rgb(${m(c.r)},${m(c.g)},${m(c.b)})`; }
  // ── draw one window (active = large, else miniature) ──
  _drawWindow(ctx, win, r, active, hover) {
    const col = this._col(win), R = active ? 8 : 5;
    const tbH = Math.max(active ? 22 : 11, Math.round(r.h * (active ? 0.10 : 0.18)));
    // body
    if (active) drawGradient(ctx, r.x, r.y, r.w, r.h, [{ offset:0, color:this._tint(col, 0.62) }, { offset:1, color:this._tint(col, 0.34) }]);
    else ctx.fillStyle = '#ffffff';
    drawRoundRect(ctx, r.x, r.y, r.w, r.h, R); ctx.fill();
    // title bar (rounded top only)
    drawGradient(ctx, r.x, r.y, r.w, tbH, [{ offset:0, color:this._tint(col, 0.30) }, { offset:1, color:col }]);
    drawRoundRect(ctx, r.x, r.y, r.w, tbH, { tl:R, tr:R, br:0, bl:0 }); ctx.fill();
    // faux window buttons
    const dot = (cx, cy, rad) => { ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.fill(); };
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const rad = active ? 3 : 1.6, dy = r.y + tbH / 2;
    dot(r.x + r.w - (active ? 14 : 7), dy, rad); dot(r.x + r.w - (active ? 26 : 13), dy, rad); dot(r.x + r.w - (active ? 38 : 19), dy, rad);
    // title text in bar
    if (win.title || win.label) {
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = (active ? 'bold 12px ' : '9px ') + "'Segoe UI', system-ui, Arial";
      const s = win.title || ('Fenêtre ' + win.label);
      let txt = s, max = r.w - (active ? 56 : 26);
      if (ctx.measureText(txt).width > max) { while (txt.length > 1 && ctx.measureText(txt + '…').width > max) txt = txt.slice(0, -1); txt += '…'; }
      ctx.fillText(txt, r.x + (active ? 10 : 5), dy + 0.5);
    }
    // big centred label in body
    if (win.label != null) {
      ctx.fillStyle = active ? '#ffffff' : this._shade(col, 0.15);
      ctx.font = 'italic bold ' + (active ? Math.round(r.h * 0.28) : Math.round(r.h * 0.32)) + "px 'Segoe UI', system-ui, Arial";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.globalAlpha = active ? 0.95 : 0.7;
      ctx.fillText(String(win.label), r.x + r.w / 2, r.y + tbH + (r.h - tbH) / 2);
      ctx.globalAlpha = 1;
    }
    // custom preview overlay
    if (typeof win.draw === 'function') { ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y + tbH, r.w, r.h - tbH); ctx.clip(); win.draw(ctx, { x:r.x, y:r.y + tbH, w:r.w, h:r.h - tbH }, active); ctx.restore(); }
    // border
    ctx.strokeStyle = hover ? colorToCSS(getTheme().tileView.selectedBorder) : colorToCSS(this._shade(col, 0.2));
    ctx.lineWidth = hover ? 2 : 1;
    drawRoundRect(ctx, r.x + .5, r.y + .5, r.w - 1, r.h - 1, R); ctx.stroke();
  }
  _inset(r, n) { return { x:r.x + n, y:r.y + n, w:r.w - n * 2, h:r.h - n * 2 }; }
  render(ctx) {
    const T = getTheme().tileView, b = this.bounds, R = T.radius;
    this._scroll = Math.max(0, Math.min(this._maxScroll(), this._scroll));
    const { strip, active } = this._regions();
    ctx.save();
    // outer surface
    drawGradient(ctx, b.x, b.y, b.width, b.height, this.background ?? T.background);
    drawRoundRect(ctx, b.x, b.y, b.width, b.height, R); ctx.fill();
    // active (centre) window
    const aw = this.activeWindow;
    if (aw) this._drawWindow(ctx, aw, this._inset(active, 14), true, false);
    // strip background + separator
    ctx.fillStyle = colorToCSS(T.tile);
    ctx.fillRect(strip.x, strip.y, strip.w, strip.h);
    ctx.strokeStyle = colorToCSS(T.border.color); ctx.lineWidth = 1;
    if (this.dock === 'left')  { ctx.beginPath(); ctx.moveTo(strip.x + strip.w - .5, strip.y); ctx.lineTo(strip.x + strip.w - .5, strip.y + strip.h); ctx.stroke(); }
    if (this.dock === 'right') { ctx.beginPath(); ctx.moveTo(strip.x + .5, strip.y); ctx.lineTo(strip.x + .5, strip.y + strip.h); ctx.stroke(); }
    if (this.dock === 'top')   { ctx.beginPath(); ctx.moveTo(strip.x, strip.y + strip.h - .5); ctx.lineTo(strip.x + strip.w, strip.y + strip.h - .5); ctx.stroke(); }
    if (this.dock === 'bottom'){ ctx.beginPath(); ctx.moveTo(strip.x, strip.y + .5); ctx.lineTo(strip.x + strip.w, strip.y + .5); ctx.stroke(); }
    // miniatures (clipped to strip)
    ctx.save();
    ctx.beginPath(); ctx.rect(strip.x, strip.y, strip.w, strip.h); ctx.clip();
    for (const t of this._thumbRects()) {
      const r = t.rect;
      if (this._horiz()) { if (r.x + r.w < strip.x || r.x > strip.x + strip.w) continue; }
      else { if (r.y + r.h < strip.y || r.y > strip.y + strip.h) continue; }
      this._drawWindow(ctx, this.windows[t.index], r, false, t.index === this._hover);
    }
    ctx.restore();
    // outer frame
    ctx.strokeStyle = colorToCSS(T.border.color); ctx.lineWidth = T.border.width;
    drawRoundRect(ctx, b.x + .5, b.y + .5, b.width - 1, b.height - 1, R); ctx.stroke();
    ctx.restore();
  }
}

window.openGaugesWindow = function() {
  const cell = 168, pad = 12, cols = 5, rows = 3;
  const cw = cols*cell + (cols+1)*pad;
  const b = winBounds(cw + 28, rows*cell + (rows+1)*pad + 56, 60, 40);
  const w = new GUIWindow('🎛️ Gauges — vitesse, horloges, marine & avionique', b);
  const ca = w.contentArea;

  // 5×3 grid matching the reference screenshot
  const defs = [
    Speed1Gauge, Speed2Gauge, Speed3Gauge, WoodClockGauge, BlackClockGauge,
    SystemClockGauge, BoatDirectionGauge, Gas1Gauge, Gas2Gauge, AirSpeedGauge,
    AltimeterGauge, AltitudeGauge, HeadingGauge, TurnCoordinatorGauge, VerticalSpeedGauge,
  ];
  const gauges = [];
  defs.forEach((Cls, i) => {
    const c = i % cols, r = (i / cols) | 0;
    const g = new Cls({ x: pad + c*(cell+pad), y: pad + r*(cell+pad), width: cell, height: cell });
    ca.addChild(g); gauges.push(g);
  });

  // Initial demo values (≈ screenshot)
  const G = {}; defs.forEach((Cls,i)=>G[Cls.name]=gauges[i]);
  G.Speed1Gauge._dispValue=G.Speed1Gauge.value=99;
  G.Speed2Gauge._dispValue=G.Speed2Gauge.value=10;
  G.Speed3Gauge._dispValue=G.Speed3Gauge.value=10;
  G.BoatDirectionGauge.value=300; G.BoatDirectionGauge.value1=120; G.BoatDirectionGauge.value2=240;
  G.Gas1Gauge.value=62; G.Gas2Gauge.value=7; G.AirSpeedGauge.value=250;
  G.AltimeterGauge.value=6280; G.AltitudeGauge.value=12; G.AltitudeGauge.rollAngle=-12;
  G.HeadingGauge.value=35; G.TurnCoordinatorGauge.value=2.5; G.TurnCoordinatorGauge.turnQuality=2;
  G.VerticalSpeedGauge.value=2;

  // Animation driver — retarget needles periodically (eased tween does the rest).
  const rnd = (a,bb)=>a+Math.random()*(bb-a);
  const timer = setInterval(() => {
    if (!engine.windowManager.windows.includes(w)) { clearInterval(timer); return; }
    G.Speed1Gauge.setValue(rnd(0,120)); G.Speed2Gauge.setValue(rnd(0,100)); G.Speed3Gauge.setValue(rnd(0,100));
    G.BoatDirectionGauge.value=rnd(0,360); G.BoatDirectionGauge.value1=rnd(0,360); G.BoatDirectionGauge.value2=rnd(0,360); G.BoatDirectionGauge.markDirty();
    G.Gas1Gauge.setValue(rnd(0,100)); G.Gas2Gauge.setValue(rnd(0,10)); G.AirSpeedGauge.setValue(rnd(40,700));
    G.AltimeterGauge.setValue(rnd(0,9000)); G.AltitudeGauge.setValue(rnd(-40,40)); G.AltitudeGauge.rollAngle=rnd(-25,25);
    G.HeadingGauge.setValue(rnd(0,360)); G.TurnCoordinatorGauge.setValue(rnd(-5,5)); G.TurnCoordinatorGauge.turnQuality=rnd(-8,8);
    G.VerticalSpeedGauge.setValue(rnd(-6,6));
  }, 2400);

  w._updateLayout();
  engine.windowManager.addWindow(w);
};

// ── Color helpers (HSV ⇆ RGB, hex) ─────────────────────────────────────────
function _ssHex(c){ // theme color obj / css → '#rrggbb'
  if(c==null) return null;
  if(typeof c==='string'){ if(c[0]==='#') return c; const m=c.match(/(\d+),\s*(\d+),\s*(\d+)/); if(m) return '#'+[m[1],m[2],m[3]].map(n=>(+n).toString(16).padStart(2,'0')).join(''); return c; }
  return '#'+[c.r,c.g,c.b].map(n=>Math.max(0,Math.min(255,n|0)).toString(16).padStart(2,'0')).join('');
}
function _hexRGB(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(x=>x+x).join(''); const n=parseInt(h,16); return {r:(n>>16)&255,g:(n>>8)&255,b:n&255}; }
function _rgb2hsv(r,g,b){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0; if(d){ if(mx===r)h=((g-b)/d)%6; else if(mx===g)h=(b-r)/d+2; else h=(r-g)/d+4; h*=60; if(h<0)h+=360; } return {h, s:mx?d/mx:0, v:mx}; }
function _hsv2rgb(h,s,v){ const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c; let r,g,b; if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;} return {r:Math.round((r+m)*255),g:Math.round((g+m)*255),b:Math.round((b+m)*255)}; }
function _hsv2hex(h,s,v){ const c=_hsv2rgb(h,s,v); return '#'+[c.r,c.g,c.b].map(n=>n.toString(16).padStart(2,'0')).join(''); }

  // les pointes de flèche débordent du tracé → on réserve leur demi-largeur
  _area(){ const a=super._area(); if(!(this.arrowStart||this.arrowEnd))return a;
    const m=(Math.max(7,this.arrowSize+this.strokeWidth*1.4))*0.45;
    return {x:a.x+m, y:a.y+m, w:Math.max(1,a.w-2*m), h:Math.max(1,a.h-2*m)}; }
  // Les points tracés sont normalisés sur `bounds` (et non sur l'aire rétrécie) :
  // les poignées d'édition tombent ainsi exactement sur le tracé.
  _abs(){ const b=this.bounds; return this.pts.map(([u,v])=>[b.x+u*b.width, b.y+v*b.height]); }
  _lpts(x,y,w,h){ return this.pts ? this._abs(x,y,w,h) : [[x,y+h],[x+w,y]]; }
  _path(ctx,x,y,w,h){ const p=this._lpts(x,y,w,h); this._ends=p; if(!p.length)return;
    ctx.moveTo(p[0][0],p[0][1]); for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]);
    if(this.closed) ctx.closePath(); }
  _decorate(ctx){ const p=this._ends; if(!p||p.length<2)return;
    if(this.arrowEnd)   this._arrowHead(ctx,p[p.length-1],p[p.length-2]);
    if(this.arrowStart) this._arrowHead(ctx,p[0],p[1]); }
}
// variante remplie d'un tracé ouvert (« … , remplie »)
function _filledLine(Base){ return class extends Base {
  constructor(b,o={}){ super(b,{fill:SHAPE_FILL,...o}); this.filled=true; this.closed=true; } }; }

// ════════════ 1. LIGNE ════════════
class SimpleLineShape extends LineShape {}
class FreeformShape extends LineShape {
  static get drawMode(){ return 'free'; }   // capture le chemin de la souris
  _lpts(x,y,w,h){ if(this.pts)return this._abs(x,y,w,h);
    const p=[], N=14;
    for(let i=0;i<=N;i++){ const t=i/N; p.push([x+t*w, y+h*(0.55+0.42*Math.sin(t*7.5)*Math.cos(t*2.1)-0.35*t)]); }
    return p; } }
class FreeformFilledShape extends _filledLine(FreeformShape) {}
class CurveShape extends LineShape {
  static get drawMode(){ return 'poly'; }   // clics successifs, double-clic pour finir
  // spline de Catmull-Rom passant par tous les points, convertie en béziers
  _path(ctx,x,y,w,h){
    if(!this.pts||this.pts.length<3){
      const p=this.pts?this._abs(x,y,w,h):[[x,y+h],[x+w,y]]; this._ends=p;
      ctx.moveTo(p[0][0],p[0][1]);
      if(p.length===2) ctx.bezierCurveTo(p[0][0]+(p[1][0]-p[0][0])*0.1,p[0][1], p[1][0]-(p[1][0]-p[0][0])*0.1,p[1][1], p[1][0],p[1][1]);
      else for(let i=1;i<p.length;i++) ctx.lineTo(p[i][0],p[i][1]);
      if(this.closed) ctx.closePath(); return; }
    const p=this._abs(x,y,w,h); this._ends=p;
    ctx.moveTo(p[0][0],p[0][1]);
    for(let i=0;i<p.length-1;i++){
      const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p[i+1];
      ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6,
                        p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6, p2[0],p2[1]); }
    if(this.closed) ctx.closePath(); } }
class CurveFilledShape extends _filledLine(CurveShape) {}
class PolylineShape extends LineShape {
  static get drawMode(){ return 'poly'; }
  _lpts(x,y,w,h){ if(this.pts)return this._abs(x,y,w,h);
    return [[x,y+h],[x+w*0.22,y+h*0.25],[x+w*0.5,y+h*0.72],[x+w*0.78,y+h*0.1],[x+w,y+h*0.55]]; } }
class Polyline45Shape extends LineShape {
  static get drawMode(){ return 'poly45'; }  // segments contraints à 0/45/90°
  _lpts(x,y,w,h){ if(this.pts)return this._abs(x,y,w,h);
    const u=Math.min(w,h)*0.5;
    return [[x,y+h],[x+u,y+h-u],[x+u,y+h*0.28],[x+w-u,y+h*0.28],[x+w,y+h*0.28+u]]; } }

// ════════════ 2. CONNECTEURS ════════════
// Le routage part des 2 extrémités (`pts` si tracées à la souris, sinon les coins
// bas-gauche → haut-droite), donc le connecteur suit le sens du glissé.
class ConnectorShape extends LineShape {
  constructor(b,o={}){ super(b,o); this.arrowSize=10; }
  get editablePoints(){ return false; }   // 2 extrémités : on redimensionne, on n'édite pas les coudes
  _ends2(x,y,w,h){ const p=this.pts&&this.pts.length>=2?this.pts:[[0,1],[1,0]];
    return [[x+p[0][0]*w, y+p[0][1]*h], [x+p[1][0]*w, y+p[1][1]*h]]; }
  _lpts(x,y,w,h){ const [a,b]=this._ends2(x,y,w,h), mx=(a[0]+b[0])/2;
    return [a,[mx,a[1]],[mx,b[1]],b]; }                                   // coudé (standard)
}
class ConnectorDirectShape extends ConnectorShape { _lpts(x,y,w,h){ return this._ends2(x,y,w,h); } }
class ConnectorLinearShape extends ConnectorShape {
  _lpts(x,y,w,h){ const [a,b]=this._ends2(x,y,w,h); return [a,[b[0],a[1]],b]; } }
class ConnectorCurvedShape extends ConnectorShape {
  _path(ctx,x,y,w,h){ const [a,b]=this._ends2(x,y,w,h); this._ends=[a,b];
    const dx=(b[0]-a[0])*0.55;
    ctx.moveTo(a[0],a[1]); ctx.bezierCurveTo(a[0]+dx,a[1], b[0]-dx,b[1], b[0],b[1]); }
  _decorate(ctx){ const p=this._ends; if(!p)return;
    if(this.arrowEnd)   this._arrowHead(ctx,p[1],[p[1][0]-1,p[1][1]]);
    if(this.arrowStart) this._arrowHead(ctx,p[0],[p[0][0]+1,p[0][1]]); } }
const _arrEnd =Base=>class extends Base { constructor(b,o={}){ super(b,{...o,arrowEnd:true}); } };
const _arrBoth=Base=>class extends Base { constructor(b,o={}){ super(b,{...o,arrowEnd:true,arrowStart:true}); } };

    if(cm){ ax=this._colLeft(cm.c1); ay=this._rowTop(cm.r1); aw=this._axCols[cm.c2+1]-this._axCols[cm.c1]; ah=this._axRows[cm.r2+1]-this._axRows[cm.r1]; }
    if(!this.editing){ ctx.strokeStyle=colorToCSS(T.activeBorder); ctx.lineWidth=2; ctx.strokeRect(ax+1,ay+1,aw-2,ah-2);
      // fill handle
      ctx.fillStyle=colorToCSS(T.fillHandle); ctx.fillRect(x2-3,y2-3,6,6); ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.strokeRect(x2-3.5,y2-3.5,6,6); }

  tb2.addWidget(ddSOpa,{width:82});                                              // Transparence
  tb2.addSeparator();
  tb2.addButton({ text:'↺', tooltip:'Rotation −90°', minWidth:26, onClick:onShape((sh,o)=>ss.rotateObj(o,-90)) });
  tb2.addButton({ text:'↻', tooltip:'Rotation +90°', minWidth:26, onClick:onShape((sh,o)=>ss.rotateObj(o,90)) });
  tb2.addButton({ text:'⊙', tooltip:'Réinitialiser la rotation', minWidth:26, onClick:onShape((sh,o)=>{ o.rot=0; }) });
  tb2.addSeparator();
  const btnPts = tb2.addButton({ text:'⌗', tooltip:'Modifier les points', minWidth:26,
    onClick:()=>{ ss.togglePointEdit(ss._selObj); refreshShapeTB(); focusSS(); } });
  tb2.addSeparator();
  tb2.addButton({ icon:'🔤', tooltip:'Texte de la forme', onClick:()=>{ const sh=selShape(); if(!sh)return;
    Dialogs.prompt('Texte de la forme','Texte :',sh.text||'').then(r=>{ if(r&&r.result==='ok'){ sh.text=r.value||''; ss.markDirty(); } focusSS(); }); } });
  tb2.addButton({ icon:'🗑️', tooltip:'Supprimer la forme', onClick:()=>{ ss.deleteSelObj(); focusSS(); } });

  // recopie l'état de la forme sélectionnée dans les contrôles
  const refreshShapeTB = ()=>{ const sh=selShape(); if(!sh)return;
    const di=SHAPE_DASH_LIST.findIndex(([k])=>k===sh.dash); ddDash.selectedIndex=di<0?0:di;
    const wi=SHAPE_WIDTHS.indexOf(sh.strokeWidth); ddW.selectedIndex=wi<0?4:wi;
    ddFill.selectedIndex = (!sh.filled||sh.fill==='none')?1:0;
    ddFill.enabled = sh.filled; btnFill.enabled = sh.filled;
    btnPts.enabled = ss.canEditPoints(ss._selObj); btnPts.toggled = ss._ptEdit===ss._selObj;
    btnSShadow.toggled = !!(ss._selObj&&ss._selObj.shadow); ddSOpa.selectedIndex = _opaIndex(ss._selObj);
    tb2.markDirty(); };
  tb2.setSize(ca.bounds.width, 34);
  w.setToolbar2(tb2, tb2.fitHeight());

  // ── Barre d'outils « Image » (visible quand une image est sélectionnée) ─────
  const tbImg = new Toolbar({x:0,y:0,width:b.width,height:34}, { gap:2, wrap:true, rowH:28 });
  tbImg.visible = false;
  const selImg = ()=>{ const o=ss._selObj; return (o&&o.type==='image')?o:null; };
  const onImg = fn => ()=>{ const o=selImg(); if(o){ fn(o); ss.markDirty(); refreshImgTB(); } focusSS(); };

  tbImg.addButton({ text:'⇱', tooltip:'Premier plan', minWidth:26, onClick:onImg(o=>ss.objToFront(o)) });
  tbImg.addButton({ text:'↑', tooltip:'Avancer d’un plan', minWidth:26, onClick:onImg(o=>ss.objForward(o)) });
  tbImg.addButton({ text:'↓', tooltip:'Reculer d’un plan', minWidth:26, onClick:onImg(o=>ss.objBackward(o)) });
  tbImg.addButton({ text:'⇲', tooltip:'Arrière-plan', minWidth:26, onClick:onImg(o=>ss.objToBack(o)) });
  tbImg.addSeparator();
  const ddIDash = new DropDown(SHAPE_DASH_LIST.map(x=>x[1]), {x:0,y:0,width:120,height:26});
  ddIDash.on('change', onImg(o=>{ o.dash=SHAPE_DASH_LIST[ddIDash.selectedIndex][0]; if(!o.strokeWidth)o.strokeWidth=1; if(!o.stroke)o.stroke=SHAPE_STROKE; }));
  tbImg.addWidget(ddIDash,{width:120});                                         // Contour
  const ddIW = new DropDown(SHAPE_WIDTHS.map(v=>v?String(v).replace('.',',')+' px':'Aucun'), {x:0,y:0,width:88,height:26});
  ddIW.on('change', onImg(o=>{ o.strokeWidth=SHAPE_WIDTHS[ddIW.selectedIndex]; if(o.strokeWidth&&!o.stroke)o.stroke=SHAPE_STROKE; }));
  tbImg.addWidget(ddIW,{width:88});                                             // Épaisseur du contour
  let btnILine;
  btnILine = tbImg.addButton({ icon:'🖊️', tooltip:'Couleur du contour', onClick:()=>{ const o=selImg(); if(!o)return;
    openColorPicker(wm, btnILine, (o.stroke&&o.stroke!=='none')?o.stroke:SHAPE_STROKE, hex=>{
      if(hex!==undefined){ o.stroke=hex||'none'; if(hex&&!o.strokeWidth)o.strokeWidth=1; ss.markDirty(); refreshImgTB(); } focusSS(); }, {allowNone:true}); } });
  tbImg.addSeparator();
  let btnIFx;
  btnIFx = tbImg.addButton({ icon:'✨', tooltip:'Filtres', onClick:()=>{ const o=selImg(); if(!o)return;
    const org=wm._widgetParentOrigin(btnIFx);
    _openMenu(wm, org.x+btnIFx.bounds.x, org.y+btnIFx.bounds.y+btnIFx.bounds.height,
      IMG_FILTERS.map(([k,lab])=>({ label:lab, checked:(o.filter||'none')===k, action:()=>{ ss.imgSetFilter(o,k); refreshImgTB(); focusSS(); } }))); } });
  const ddIMode = new DropDown(IMG_COLORMODES.map(x=>x[1]), {x:0,y:0,width:132,height:26});
  ddIMode.on('change', onImg(o=>{ ss.imgSetColorMode(o, IMG_COLORMODES[ddIMode.selectedIndex][0]); }));
  tbImg.addWidget(ddIMode,{width:132});                                         // Mode couleur
  tbImg.addSeparator();
  const btnICrop = tbImg.addButton({ text:'⬚', tooltip:'Rogner (Échap pour quitter)', minWidth:26,
    onClick:()=>{ ss.toggleCropMode(selImg()); refreshImgTB(); focusSS(); } });
  tbImg.addButton({ text:'⇕', tooltip:'Refléter verticalement', minWidth:26, onClick:onImg(o=>ss.imgFlip(o,'v')) });
  tbImg.addButton({ text:'⇔', tooltip:'Refléter horizontalement', minWidth:26, onClick:onImg(o=>ss.imgFlip(o,'h')) });
  const btnIShadow = tbImg.addButton({ text:'◪', tooltip:'Ombre', minWidth:26, onClick:onImg(o=>ss.imgToggleShadow(o)) });
  const ddIOpa = new DropDown(OPACITIES.map(v=>Math.round(v*100)+' %'), {x:0,y:0,width:82,height:26});
  ddIOpa.on('change', onImg(o=>ss.objSetOpacity(o,OPACITIES[ddIOpa.selectedIndex])));
  tbImg.addWidget(ddIOpa,{width:82});                                            // Transparence
  tbImg.addSeparator();
  tbImg.addButton({ text:'↺', tooltip:'Rotation −90°', minWidth:26, onClick:onImg(o=>ss.rotateObj(o,-90)) });
  tbImg.addButton({ text:'↻', tooltip:'Rotation +90°', minWidth:26, onClick:onImg(o=>ss.rotateObj(o,90)) });
  tbImg.addButton({ text:'⊙', tooltip:'Réinitialiser la rotation', minWidth:26, onClick:onImg(o=>{ o.rot=0; }) });
  tbImg.addSeparator();
  tbImg.addButton({ text:'⤾', tooltip:'Annuler le rognage', minWidth:26, onClick:onImg(o=>ss.imgResetCrop(o)) });
  tbImg.addButton({ icon:'🗑️', tooltip:'Supprimer l’image', onClick:()=>{ ss.deleteSelObj(); focusSS(); } });

  const refreshImgTB = ()=>{ const o=selImg(); if(!o)return;
    const di=SHAPE_DASH_LIST.findIndex(([k])=>k===(o.dash||'solid')); ddIDash.selectedIndex=di<0?0:di;
    const wi=SHAPE_WIDTHS.indexOf(o.strokeWidth||0); ddIW.selectedIndex=wi<0?0:wi;
    const mi=IMG_COLORMODES.findIndex(([k])=>k===(o.colorMode||'default')); ddIMode.selectedIndex=mi<0?0:mi;
    btnICrop.toggled = ss._cropObj===o; btnIShadow.toggled = !!o.shadow; ddIOpa.selectedIndex=_opaIndex(o);
    tbImg.markDirty(); };
  tbImg.setSize(ca.bounds.width, 34);

  // ── Barre d'outils « Widget » (Bouton, Case, Curseur, Barre de progression) ──
  const tbWid = new Toolbar({x:0,y:0,width:b.width,height:34}, { gap:2, wrap:true, rowH:28 });
  tbWid.visible = false;
  const selWid = ()=>{ const o=ss._selObj; return (o&&o.type==='widget'&&!(o.widget instanceof Shape))?o:null; };
  const onWid = fn => ()=>{ const o=selWid(); if(o){ fn(o); ss.markDirty(); refreshWidTB(); } focusSS(); };

  tbWid.addButton({ text:'⇱', tooltip:'Premier plan', minWidth:26, onClick:onWid(o=>ss.objToFront(o)) });
  tbWid.addButton({ text:'↑', tooltip:'Avancer d’un plan', minWidth:26, onClick:onWid(o=>ss.objForward(o)) });
  tbWid.addButton({ text:'↓', tooltip:'Reculer d’un plan', minWidth:26, onClick:onWid(o=>ss.objBackward(o)) });
  tbWid.addButton({ text:'⇲', tooltip:'Arrière-plan', minWidth:26, onClick:onWid(o=>ss.objToBack(o)) });
  tbWid.addSeparator();
  tbWid.addButton({ text:'↺', tooltip:'Rotation −90°', minWidth:26, onClick:onWid(o=>ss.rotateObj(o,-90)) });
  tbWid.addButton({ text:'↻', tooltip:'Rotation +90°', minWidth:26, onClick:onWid(o=>ss.rotateObj(o,90)) });
  tbWid.addButton({ text:'⊙', tooltip:'Réinitialiser la rotation', minWidth:26, onClick:onWid(o=>{ o.rot=0; }) });
  tbWid.addSeparator();
  const btnWShadow = tbWid.addButton({ text:'◪', tooltip:'Ombre', minWidth:26, onClick:onWid(o=>ss.objToggleShadow(o)) });
  const ddWOpa = new DropDown(OPACITIES.map(v=>Math.round(v*100)+' %'), {x:0,y:0,width:82,height:26});
  ddWOpa.on('change', onWid(o=>ss.objSetOpacity(o,OPACITIES[ddWOpa.selectedIndex])));
  tbWid.addWidget(ddWOpa,{width:82});                                            // Transparence
  tbWid.addSeparator();
  tbWid.addButton({ icon:'🗑️', tooltip:'Supprimer le widget', onClick:()=>{ ss.deleteSelObj(); focusSS(); } });
  const refreshWidTB = ()=>{ const o=selWid(); if(!o)return;
    btnWShadow.toggled=!!o.shadow; ddWOpa.selectedIndex=_opaIndex(o); tbWid.markDirty(); };
  tbWid.setSize(ca.bounds.width, 34);

  // ── Barre d'outils « Graphique » ───────────────────────────────────────────
  const CHART_KINDS=[['bar','Barres'],['line','Lignes'],['pie','Secteurs']];
  const tbCht = new Toolbar({x:0,y:0,width:b.width,height:34}, { gap:2, wrap:true, rowH:28 });
  tbCht.visible = false;
  const selCht = ()=>{ const o=ss._selObj; return (o&&o.type==='chart'&&o.chart)?o:null; };
  const onCht = fn => ()=>{ const o=selCht(); if(o){ fn(o); ss.markDirty(); refreshChtTB(); } focusSS(); };

  tbCht.addButton({ text:'⇱', tooltip:'Premier plan', minWidth:26, onClick:onCht(o=>ss.objToFront(o)) });
  tbCht.addButton({ text:'↑', tooltip:'Avancer d’un plan', minWidth:26, onClick:onCht(o=>ss.objForward(o)) });
  tbCht.addButton({ text:'↓', tooltip:'Reculer d’un plan', minWidth:26, onClick:onCht(o=>ss.objBackward(o)) });
  tbCht.addButton({ text:'⇲', tooltip:'Arrière-plan', minWidth:26, onClick:onCht(o=>ss.objToBack(o)) });
  tbCht.addSeparator();
  const ddCKind = new DropDown(CHART_KINDS.map(x=>x[1]), {x:0,y:0,width:120,height:26});
  ddCKind.on('change', onCht(o=>{ o.chart.kind=CHART_KINDS[ddCKind.selectedIndex][0]; }));
  tbCht.addWidget(ddCKind,{width:120});                                          // Type de graphique
  tbCht.addButton({ icon:'🔤', tooltip:'Titre du graphique', onClick:()=>{ const o=selCht(); if(!o)return;
    Dialogs.prompt('Titre du graphique','Titre :',o.chart.title||'').then(r=>{ if(r&&r.result==='ok'){ o.chart.title=r.value||''; ss.markDirty(); } focusSS(); }); } });
  tbCht.addButton({ text:'🖱', tooltip:'Choisir la source à la souris (glisser sur la grille)', minWidth:26, onClick:()=>{ const o=selCht(); if(o)ss.startChartPick(o); else focusSS(); } });
  tbCht.addButton({ text:'▦', tooltip:'Source des données (saisir la plage)', minWidth:26, onClick:()=>{ const o=selCht(); if(o)ss.promptChartRange(o); else focusSS(); } });
  tbCht.addButton({ text:'⤢', tooltip:'Source = sélection courante', minWidth:26, onClick:onCht(o=>ss.chartRangeFromSel(o)) });
  tbCht.addSeparator();
  tbCht.addButton({ text:'↺', tooltip:'Rotation −90°', minWidth:26, onClick:onCht(o=>ss.rotateObj(o,-90)) });
  tbCht.addButton({ text:'↻', tooltip:'Rotation +90°', minWidth:26, onClick:onCht(o=>ss.rotateObj(o,90)) });
  tbCht.addButton({ text:'⊙', tooltip:'Réinitialiser la rotation', minWidth:26, onClick:onCht(o=>{ o.rot=0; }) });
  tbCht.addSeparator();
  const btnCShadow = tbCht.addButton({ text:'◪', tooltip:'Ombre', minWidth:26, onClick:onCht(o=>ss.objToggleShadow(o)) });
  const ddCOpa = new DropDown(OPACITIES.map(v=>Math.round(v*100)+' %'), {x:0,y:0,width:82,height:26});
  ddCOpa.on('change', onCht(o=>ss.objSetOpacity(o,OPACITIES[ddCOpa.selectedIndex])));
  tbCht.addWidget(ddCOpa,{width:82});                                            // Transparence
  tbCht.addSeparator();
  tbCht.addButton({ icon:'🗑️', tooltip:'Supprimer le graphique', onClick:()=>{ ss.deleteSelObj(); focusSS(); } });

  const refreshChtTB = ()=>{ const o=selCht(); if(!o)return;
    const ki=CHART_KINDS.findIndex(([k])=>k===(o.chart.kind||'bar')); ddCKind.selectedIndex=ki<0?0:ki;
    btnCShadow.toggled=!!o.shadow; ddCOpa.selectedIndex=_opaIndex(o);
    tbCht.markDirty(); };
  ss.onChartPickEnd = ()=>{ refreshChtTB(); focusSS(); };
  tbCht.setSize(ca.bounds.width, 34);

  // affiche la barre contextuelle correspondant à l'objet sélectionné (forme / image / widget / graphique)
  ss.onObjChange = ()=>{ const sh=!!selShape(), im=!!selImg(), wd=!!selWid(), ch=!!selCht();
    tb2.visible=sh; tbImg.visible=im; tbWid.visible=wd; tbCht.visible=ch;
    const target = im?tbImg:(wd?tbWid:(ch?tbCht:tb2));
    if(w._dockTop2!==target) w.setToolbar2(target, target.fitHeight()); else w._updateLayout();
    if(sh)refreshShapeTB(); if(im)refreshImgTB(); if(wd)refreshWidTB(); if(ch)refreshChtTB();
    w.markDirty(); };

  // ── StatusBar ───────────────────────────────────────────────────────────────
  const sb = new StatusBar({x:0,y:0,width:b.width,height:24});
  const pCell = sb.addPanel({ text:'A1', width:78, align:'center' });
  const pStats = sb.addPanel({ text:'', width:0, align:'right' });
  w.setStatusBar(sb, 24);
  const statusUpdate = ()=>{ pCell.setText(_colName(ss.cur.c)+(ss.cur.r+1)); const st=ss.selStats(); pStats.setText(st.cnt?`Nb (non vides) : ${st.cnt}   Somme : ${_fmtNumber(st.sum,2,true)}   Moyenne : ${st.num?_fmtNumber(st.avg,2,true):'—'}`:'Prêt'); };

  // ── helpers ─────────────────────────────────────────────────────────────────
  function doClip(kind){ wm._setFocus(ss); try{ if(kind==='cut')document.execCommand('cut'); else if(kind==='copy')document.execCommand('copy'); else document.execCommand('paste'); }catch(e){}
    if(kind==='paste'){ /* paste via system event; fallback below */ } focusSS(); }
  let _bStyle={style:'solid',w:1,color:'#000000'};
  function openBorderMenu(x,y){
    const place=[ ['Toutes (grille)','all'],['Contour','outer'],['Intérieur','inner'],['Intérieur horizontal','innerH'],['Intérieur vertical','innerV'],['Aucune','none'] ];
    const place2=[ ['Haut','top'],['Bas','bottom'],['Gauche','left'],['Droite','right'],['Haut et bas','tb'],['Gauche et droite','lr'] ];
    const styles=[ ['Plein','solid',1],['Épais','solid',2],['Pointillé','dotted',1],['Tirets','dashed',1],['Double','double',1] ];
    const apply=which=>{ ss.cmdBorder(which, which==='none'?0:_bStyle.w, _bStyle.color, _bStyle.style); focusSS(); };
    const items=[];
    place.forEach(([lab,which])=>items.push({label:lab,action:()=>apply(which)}));
    items.push({separator:true});
    place2.forEach(([lab,which])=>items.push({label:lab,action:()=>apply(which)}));
    items.push({separator:true});
    items.push({label:'Style de trait',submenu:styles.map(([lab,stl,ww])=>({label:lab,checked:_bStyle.style===stl&&_bStyle.w===ww,action:()=>{ _bStyle.style=stl; _bStyle.w=ww; openBorderMenu(x,y); }}))});
    items.push({label:'Couleur du trait…',icon:'🎨',action:()=>{ openColorPicker(wm,btnBorder,_bStyle.color,hex=>{ if(hex!==undefined)_bStyle.color=hex||'#000000'; focusSS(); },{allowNone:false}); }});
    _openMenu(wm,x,y,items); }
  function openPivotDialog(){
    const s=ss._normSel();
    if(s.r2<=s.r1){ Dialogs.alert('Sélectionnez d’abord la plage source, ligne d’en-tête comprise.'); return; }
    const names=[]; for(let c=s.c1;c<=s.c2;c++) names.push(String(ss.cellDisplay(s.r1,c)||_colName(c)));
    const dw=new GUIWindow('Tableau croisé dynamique', winBounds(392,232,140,100));
    const dc=dw.contentArea; dc._contentSize=()=>({w:0,h:0});
    [['Lignes :',14],['Colonnes :',48],['Valeurs :',82],['Fonction :',116]].forEach(([t,y])=>dc.addChild(new Label(t,{x:12,y,width:96,height:22})));
    const ddRow=new DropDown(names,{x:112,y:10,width:252,height:26});
    const ddCol=new DropDown(['(aucune)',...names],{x:112,y:44,width:252,height:26});
    const ddVal=new DropDown(names,{x:112,y:78,width:252,height:26});
    const ddAgg=new DropDown(['Somme','Nombre','Moyenne','Min','Max'],{x:112,y:112,width:252,height:26});
    ddRow.selectedIndex=0; ddCol.selectedIndex=0; ddVal.selectedIndex=names.length>1?1:0; ddAgg.selectedIndex=0;
    [ddRow,ddCol,ddVal,ddAgg].forEach(d=>dc.addChild(d));
    const bOk=new Button('Créer',{x:184,y:152,width:86,height:28});
    const bNo=new Button('Annuler',{x:278,y:152,width:86,height:28});
    dc.addChild(bOk); dc.addChild(bNo);
    const AGGK=['sum','count','avg','min','max'];
    bOk.on('click',()=>{ const rf=ddRow.selectedIndex, cf=ddCol.selectedIndex-1, vf=ddVal.selectedIndex, ag=AGGK[ddAgg.selectedIndex]||'sum';
      wm.removeWindow(dw);
      ss.createPivot(rf,cf,vf,ag,names[rf],cf>=0?names[cf]:'',names[vf]); });
    bNo.on('click',()=>{ wm.removeWindow(dw); focusSS(); });
    wm.addWindow(dw); }
  function exportCSV(){ const lines=[]; let maxR=0,maxC=0; for(const k of ss.cells.keys()){ const [r,c]=k.split(':').map(Number); maxR=Math.max(maxR,r); maxC=Math.max(maxC,c); }
    for(let r=0;r<=maxR;r++){ const cols=[]; for(let c=0;c<=maxC;c++){ let v=ss.cellDisplay(r,c); if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"'; cols.push(v); } lines.push(cols.join(',')); }
    const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='classeur.csv'; a.click(); }

  // responsive layout: spreadsheet fills the content area
  const orig = w._updateLayout.bind(w);
  w._updateLayout = function(){ orig(); const need=tb.fitHeight(); if(need!==w._dockTopH){ w._dockTopH=need; orig(); }
    const t2=w._dockTop2; if(t2&&t2.visible){ const need2=t2.fitHeight(); if(need2!==w._dockTop2H){ w._dockTop2H=need2; orig(); } }
    ss.setBounds({x:0,y:0,width:ca.bounds.width,height:ca.bounds.height}); ss.markDirty(); };

  // seed demo data
  const seed=[['Produit','Qté','PU','Total'],['Pommes','12','0.50','=B2*C2'],['Poires','8','0.80','=B3*C3'],['Bananes','20','0.35','=B4*C4'],['','','Somme','=SUM(D2:D4)']];
  seed.forEach((row,r)=>row.forEach((v,c)=>{ if(v!=='')ss._setRaw(r,c,v); }));
  ss.getCell(0,0,true).style.bold=true; ss.getCell(0,1,true).style.bold=true; ss.getCell(0,2,true).style.bold=true; ss.getCell(0,3,true).style.bold=true;
  for(let c=0;c<4;c++){ const cell=ss.getCell(0,c,true); cell.style.bg='#4A86E8'; cell.style.color='#FFFFFF'; cell.style.align='center'; }
  ss.getCell(4,3,true).style.bold=true;
  ss.recalc();

  w._updateLayout(); refreshTB(); statusUpdate();
  engine.windowManager.addWindow(w);
  wm._setFocus(ss);
  ss.runOnOpen();
};

// ── Launch ─────────────────────────────────────────────────────────────────
openCalcWindow();

engine.start();
</script>
</body>
</html>

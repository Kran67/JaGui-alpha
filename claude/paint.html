    this.values = {};
    for (const p of params) this.values[p.key] = p.def;
    this._widgets = {};
    this._build();
  }
  _build() {
    const ca = this.contentArea, W = this.bounds.width;
    ca._contentSize = () => ({ w:0, h:0 });
    let y = 12;
    for (const p of this.params) {
      const lab = new Label(p.label, { x:14, y, width:130, height:24 });
      ca.addChild(lab);
      const bx = 150, bw = W - bx - 24;
      if (p.type === 'slider' || p.type === 'angle') {
        const sl = new Slider({ x:bx, y:y+3, width:bw-76, height:20 });
        sl.min = p.min ?? 0; sl.max = p.max ?? 100; sl.step = p.step ?? 1; sl.value = p.def;
        const num = new InputNumber({ x:bx+bw-70, y, width:70, height:24 }, { min:p.min ?? 0, max:p.max ?? 100, step:p.step ?? 1, decimals:p.decimals ?? 0, value:p.def });
        sl.on('change', () => { this.values[p.key] = sl.value; num.value = sl.value; this._changed(); });
        num.on('change', () => { const v = num.value ?? p.def; this.values[p.key] = v; sl.value = v; this._changed(); });
        ca.addChild(sl); ca.addChild(num); this._widgets[p.key] = { sl, num };
      } else if (p.type === 'num') {
        const num = new InputNumber({ x:bx, y, width:100, height:24 }, { min:p.min, max:p.max, step:p.step ?? 1, decimals:p.decimals ?? 0, value:p.def });
        num.on('change', () => { this.values[p.key] = num.value; this._changed(); });
        ca.addChild(num); this._widgets[p.key] = { num };
      } else if (p.type === 'check') {
        const cb = new CheckBox('', { x:bx, y:y+2, width:24, height:22 });
        cb.checked = !!p.def;
        cb.on('change', () => { this.values[p.key] = cb.checked; this._changed(); });
        ca.addChild(cb); this._widgets[p.key] = { cb };
      } else if (p.type === 'combo') {
        const dd = new DropDown(p.items.map(i => i.t), { x:bx, y, width:Math.min(bw, 220), height:24 });
        dd.selectedIndex = Math.max(0, p.items.findIndex(i => i.v === p.def));
        dd.on('change', () => { this.values[p.key] = p.items[dd.selectedIndex].v; this._changed(); });
        ca.addChild(dd); this._widgets[p.key] = { dd };
      } else if (p.type === 'color') {
        const cf = new ColorField({ x:bx, y, width:140, height:24 }, { value:p.def, allowNone:false });
        cf.on('change', () => { this.values[p.key] = cf.value; this._changed(); });
        ca.addChild(cf); this._widgets[p.key] = { cf };
      }
      y += 34;
    }
    const by = y + 10;
    const mk = (text, x, w, cb) => { const b = new Button(text, { x, y:by, width:w, height:28 }); b.on('click', cb); ca.addChild(b); return b; };
    mk('Réinitialiser', 14, 100, () => this.reset());
    mk('OK', W - 190, 80, () => this.ok());
    mk('Annuler', W - 100, 80, () => this.cancel());
    this.bounds.height = by + 28 + 16 + getTheme().window.titleBar.height;
    this._updateLayout();
  }
  reset() {
    for (const p of this.params) {
      this.values[p.key] = p.def;
      const w = this._widgets[p.key];
      if (!w) continue;
      if (w.sl) { w.sl.value = p.def; w.num.value = p.def; }
      else if (w.num) w.num.value = p.def;
      else if (w.cb) w.cb.checked = !!p.def;
      else if (w.dd) w.dd.selectedIndex = Math.max(0, p.items.findIndex(i => i.v === p.def));
      else if (w.cf) w.cf.value = p.def;
    }
    this._changed();
  }
  _changed() { if (this.opts.onChange) this.opts.onChange(this.values); this.markDirty(); }
  ok() { const cb = this.opts.onOk; this._close(); if (cb) cb(this.values); }
  cancel() { const cb = this.opts.onCancel; this._close(); if (cb) cb(); }
  _onCancel() { this.cancel(); }
  _onClose() { this.cancel(); }
  _close() { const wm = _rootWM(this) || engine.windowManager; wm.removeWindow ? wm.removeWindow(this) : wm.closeWindow(this); }
  showModal(wm) {
    wm = wm || engine.windowManager;
    const b = winBounds(this.bounds.width, this.bounds.height);
    this.bounds.x = b.x; this.bounds.y = b.y;
    wm.addWindow(this); this._updateLayout(); return this;
  }
}

// Applique un effet/ajustement avec aperçu en direct sur le calque actif.
function runEffect(app, title, params, applyFn, opts = {}) {
  const d = app.doc, L = d.layer;
  const base = _cloneCv(L.canvas);
  let raf = null;
  const apply = vals => {
    L.ctx.setTransform(1,0,0,1,0,0);
    L.ctx.globalCompositeOperation = 'copy'; L.ctx.drawImage(base, 0, 0);
    L.ctx.globalCompositeOperation = 'source-over';
    d.applyPixels((src, rect) => applyFn(src, vals, rect, base, d), L);
    L.touch(); d.touch();
  };
  const schedule = vals => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { raf = null; apply(vals); }); };
  const dlg = new PDialog(title, params, {
    width: opts.width ?? 420,
    onChange: v => schedule(v),
    onOk: v => { if (raf) cancelAnimationFrame(raf); apply(v); d.pushHistory(title, 'fx'); app.refreshAll(); },
    onCancel: () => {
      if (raf) cancelAnimationFrame(raf);
      L.ctx.globalCompositeOperation = 'copy'; L.ctx.drawImage(base, 0, 0);
      L.ctx.globalCompositeOperation = 'source-over'; L.touch(); d.touch(); app.refreshAll();
    },
  });
  dlg.showModal(engine.windowManager);
  apply(dlg.values);
  return dlg;
}
// Effet sans paramètre : application immédiate
function runInstant(app, title, applyFn) {
  const d = app.doc;
  d.applyPixels((src, rect) => applyFn(src, {}, rect, null, d));
  d.pushHistory(title, 'fx'); app.refreshAll();
}

// Faire pivoter / zoomer le calque
function openRotateZoomDialog(app) {
  const d = app.doc, L = d.layer, base = _cloneCv(L.canvas);
  let raf = null;
  const render = v => {
    L.ctx.setTransform(1,0,0,1,0,0); L.ctx.clearRect(0, 0, d.width, d.height);
    L.ctx.save();
    L.ctx.translate(d.width/2 + v.px, d.height/2 + v.py);
    L.ctx.rotate(v.angle*Math.PI/180);
    L.ctx.scale(v.zoom/100, v.zoom/100);
    L.ctx.translate(-d.width/2, -d.height/2);
    L.ctx.drawImage(base, 0, 0);
    L.ctx.restore(); L.touch(); d.touch();
  };
  const dlg = new PDialog('Faire pivoter / Zoomer', [
    { key:'angle', label:'Angle :', type:'slider', min:-180, max:180, def:0 },
    { key:'zoom',  label:'Zoom (%) :', type:'slider', min:1, max:800, def:100 },
    { key:'px',    label:'Décalage X :', type:'slider', min:-2000, max:2000, def:0 },
    { key:'py',    label:'Décalage Y :', type:'slider', min:-2000, max:2000, def:0 },
  ], {
    onChange: v => { if (raf) cancelAnimationFrame(raf); raf = requestAnimationFrame(() => render(v)); },

    onCancel: () => { L.ctx.setTransform(1,0,0,1,0,0); L.ctx.globalCompositeOperation = 'copy'; L.ctx.drawImage(base, 0, 0); L.ctx.globalCompositeOperation = 'source-over'; L.touch(); d.touch(); app.refreshAll(); },

// ── Fichiers ──────────────────────────────────────────────────────────────
function pickImageFile(cb, accept) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = accept || 'image/*,.pdn';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) cb(f); };
  inp.click();
}
function loadImageFile(file, cb) {
  if (/\.pdn$/i.test(file.name)) {
    const r = new FileReader();
    r.onload = () => { try { cb(null, JSON.parse(r.result), file.name); } catch (e) { Dialogs.error('Fichier .pdn illisible'); } };
    r.readAsText(file); return;
  }
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => cb(img, null, file.name); img.src = r.result; };
  r.readAsDataURL(file);
}
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function saveDocAs(app, format) {
  const d = app.doc;
  const base = (d.fileName || 'Sans titre').replace(/\.[^.]+$/, '');
  if (format === 'pdn') {
    const data = {
      _type:'paint.net-clone', width:d.width, height:d.height, dpi:d.dpi,
      layers: d.layers.map(l => ({ name:l.name, visible:l.visible, opacity:l.opacity, blend:l.blend, data:l.canvas.toDataURL('image/png') })),
    };
    downloadBlob(new Blob([JSON.stringify(data)], { type:'application/json' }), base + '.pdn');
    d.dirty = false; return;
  }
  const mime = format === 'jpg' ? 'image/jpeg' : format === 'webp' ? 'image/webp' : format === 'bmp' ? 'image/bmp' : 'image/png';
  const cv = (format === 'jpg' || format === 'bmp') ? d.flattenCanvas() : d.composite();
  const ext = format === 'jpg' ? 'jpg' : format;
  cv.toBlob(b => { if (b) { downloadBlob(b, `${base}.${ext}`); d.dirty = false; } else Dialogs.error('Format non pris en charge par le navigateur.'); }, mime, 0.92);
}
function docFromPdn(json) {
  const d = new PaintDoc(json.width, json.height, 'transparent');
  d.layers = []; d.dpi = json.dpi || 96;
  let pending = json.layers.length;
  return new Promise(res => {
    json.layers.forEach((o, i) => {
      const l = new PaintLayer(json.width, json.height, o.name);
      l.visible = o.visible; l.opacity = o.opacity; l.blend = o.blend;
      const img = new Image();
      img.onload = () => { l.ctx.drawImage(img, 0, 0); l.touch(); if (--pending === 0) { d.active = 0; d.history = []; d.histIndex = -1; d.pushHistory('Ouvrir', 'open'); d.touch(); res(d); } };
      img.src = o.data;
      d.layers[i] = l;
    });
    if (!json.layers.length) { d.layers.push(new PaintLayer(json.width, json.height, 'Arrière-plan')); res(d); }
  });
}
function printDoc(app) {
  const url = app.doc.flattenCanvas().toDataURL('image/png');
  const w = window.open('', '_blank');
  if (!w) { Dialogs.error("Le navigateur a bloqué la fenêtre d'impression."); return; }
  w.document.write(`<html><head><title>${app.doc.fileName}</title></head><body style="margin:0;text-align:center">
    <img src="${url}" style="max-width:100%" onload="window.print()"></body></html>`);
  w.document.close();
}

// ════════════════════════════════════════════════════════════════════════
// BOÎTE À OUTILS PIXELS (convolution, flous, HSL) + AJUSTEMENTS + EFFETS
// ════════════════════════════════════════════════════════════════════════

function _idClone(id) { const o = new ImageData(id.width, id.height); o.data.set(id.data); return o; }
function _rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  let h = 0, s = 0;
  if (mx !== mn) {
    const d = mx-mn;
    s = l > 0.5 ? d/(2-mx-mn) : d/(mx+mn);
    if (mx === r) h = ((g-b)/d + (g < b ? 6 : 0));
    else if (mx === g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  return { h, s, l };
}
function _hsl2rgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2*l - 1)) * s, x = c * (1 - Math.abs((h/60) % 2 - 1)), m = l - c/2;
  let r, g, b;
  if (h < 60) [r,g,b] = [c,x,0]; else if (h < 120) [r,g,b] = [x,c,0];
  else if (h < 180) [r,g,b] = [0,c,x]; else if (h < 240) [r,g,b] = [0,x,c];
  else if (h < 300) [r,g,b] = [x,0,c]; else [r,g,b] = [c,0,x];
  return { r:_c255((r+m)*255), g:_c255((g+m)*255), b:_c255((b+m)*255) };
}
function _applyLUT(id, lutR, lutG, lutB) {
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = lutR[d[i]]; d[i+1] = (lutG||lutR)[d[i+1]]; d[i+2] = (lutB||lutR)[d[i+2]]; }
  return id;
}
function _convolve(id, k, kw, div, bias, alphaToo) {
  const w = id.width, h = id.height, src = id.data, out = _idClone(id), dst = out.data;
  const half = (kw-1)/2, D = div || k.reduce((a,b)=>a+b,0) || 1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let r = 0, g = 0, b = 0, a = 0;
    for (let ky = 0; ky < kw; ky++) for (let kx = 0; kx < kw; kx++) {
      const sx = _clamp(x+kx-half, 0, w-1), sy = _clamp(y+ky-half, 0, h-1);
      const i = (sy*w+sx)*4, kv = k[ky*kw+kx];
      r += src[i]*kv; g += src[i+1]*kv; b += src[i+2]*kv; if (alphaToo) a += src[i+3]*kv;
    }
    const o = (y*w+x)*4;
    dst[o] = _c255(r/D + (bias||0)); dst[o+1] = _c255(g/D + (bias||0)); dst[o+2] = _c255(b/D + (bias||0));
    dst[o+3] = alphaToo ? _c255(a/D) : src[o+3];
  }
  return out;
}
function _boxBlur(id, radius) {
  if (radius < 1) return id;
  const w = id.width, h = id.height;
  let src = id.data, tmp = new Uint8ClampedArray(src.length);
  const pass = (from, to, W, H) => {
    for (let y = 0; y < H; y++) {
      let rs = 0, gs = 0, bs = 0, as = 0, n = 0;
      for (let x = -radius; x <= radius; x++) { const i = (y*W + _clamp(x,0,W-1))*4; rs += from[i]; gs += from[i+1]; bs += from[i+2]; as += from[i+3]; n++; }
      for (let x = 0; x < W; x++) {
        const o = (y*W+x)*4;
        to[o] = rs/n; to[o+1] = gs/n; to[o+2] = bs/n; to[o+3] = as/n;
        const iAdd = (y*W + _clamp(x+radius+1,0,W-1))*4, iSub = (y*W + _clamp(x-radius,0,W-1))*4;
        rs += from[iAdd]-from[iSub]; gs += from[iAdd+1]-from[iSub+1]; bs += from[iAdd+2]-from[iSub+2]; as += from[iAdd+3]-from[iSub+3];
      }
    }
  };
  const transpose = (from, to, W, H) => { for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = (y*W+x)*4, o = (x*H+y)*4; to[o]=from[i]; to[o+1]=from[i+1]; to[o+2]=from[i+2]; to[o+3]=from[i+3]; } };
  const a = new Uint8ClampedArray(src.length), b = new Uint8ClampedArray(src.length);
  pass(src, a, w, h); transpose(a, b, w, h);
  pass(b, a, h, w); transpose(a, tmp, h, w);
  const out = new ImageData(w, h); out.data.set(tmp); return out;
}
function _gaussBlur(id, radius) {
  let r = Math.max(0, radius|0); if (r < 1) return id;
  let out = id;
  const box = Math.max(1, Math.round(r/2));
  for (let i = 0; i < 3; i++) out = _boxBlur(out, box);
  return out;
}
// Échantillonnage bilinéaire dans une ImageData
function _sampleBi(src, x, y) {
  const w = src.width, h = src.height, d = src.data;
  x = _clamp(x, 0, w-1.001); y = _clamp(y, 0, h-1.001);
  const x0 = x|0, y0 = y|0, fx = x-x0, fy = y-y0;
  const x1 = Math.min(x0+1, w-1), y1 = Math.min(y0+1, h-1);
  const i00 = (y0*w+x0)*4, i10 = (y0*w+x1)*4, i01 = (y1*w+x0)*4, i11 = (y1*w+x1)*4;
  const o = [0,0,0,0];
  for (let k = 0; k < 4; k++)
    o[k] = d[i00+k]*(1-fx)*(1-fy) + d[i10+k]*fx*(1-fy) + d[i01+k]*(1-fx)*fy + d[i11+k]*fx*fy;
  return o;
}
// Déformation générique : map(x,y) → coordonnées source
function _warp(id, map) {
  const w = id.width, h = id.height, out = new ImageData(w, h), dst = out.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const s = map(x, y);
    const c = _sampleBi(id, s[0], s[1]), o = (y*w+x)*4;
    dst[o] = c[0]; dst[o+1] = c[1]; dst[o+2] = c[2]; dst[o+3] = c[3];
  }
  return out;
}
function _histogram(id) {
  const H = { r:new Uint32Array(256), g:new Uint32Array(256), b:new Uint32Array(256), l:new Uint32Array(256) };
  const d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    H.r[d[i]]++; H.g[d[i+1]]++; H.b[d[i+2]]++;
    H.l[_c255(_lum709(d[i], d[i+1], d[i+2]))]++;
  }
  return H;
}

// ── Courbes (éditeur interactif) ──────────────────────────────────────────
class CurveEditorWidget extends BaseWidget {
  constructor(bounds) {
    super('curve_'+(++_idCounter), bounds);
    this.channels = { rgb:[[0,0],[255,255]], r:[[0,0],[255,255]], g:[[0,0],[255,255]], b:[[0,0],[255,255]] };
    this.channel = 'rgb'; this._drag = -1; this.capturesDrag = true; this.cursor = 'crosshair';
    this.on('mousedown', e => this._down(e));
    this.on('mousemove', e => this._move(e));
    this.on('mouseup', () => { this._drag = -1; });
  }
  _toLocal(e) {
    const b = this.bounds;
    return [_clamp(Math.round((e.x - b.x)/b.width*255), 0, 255), _clamp(Math.round((1 - (e.y - b.y)/b.height)*255), 0, 255)];
  }
  _down(e) {
    const pts = this.channels[this.channel], [x, y] = this._toLocal(e);
    let idx = pts.findIndex(p => Math.abs(p[0]-x) < 10 && Math.abs(p[1]-y) < 14);
    if (e.button === 2) { if (idx > 0 && idx < pts.length-1) { pts.splice(idx, 1); this._emit(); } return; }
    if (idx < 0) { pts.push([x, y]); pts.sort((a, b) => a[0]-b[0]); idx = pts.findIndex(p => p[0] === x && p[1] === y); }
    this._drag = idx; this._emit();
  }
  _move(e) {
    if (this._drag < 0) return;
    const pts = this.channels[this.channel], [x, y] = this._toLocal(e);
    const i = this._drag;
    pts[i] = [i === 0 ? 0 : i === pts.length-1 ? 255 : _clamp(x, (pts[i-1]?.[0] ?? 0)+1, (pts[i+1]?.[0] ?? 255)-1), y];
    this._emit();
  }
  _emit() { this.markDirty(); this.emit({ type:'change', target:this, x:0, y:0, stopPropagation(){}, preventDefault(){} }); }
  lut(ch) {
    const pts = this.channels[ch] || [[0,0],[255,255]];
    const L = new Uint8ClampedArray(256);
    for (let x = 0; x < 256; x++) {
      let i = 0; while (i < pts.length-2 && pts[i+1][0] < x) i++;
      const p0 = pts[i], p1 = pts[i+1] || pts[i];
      const t = p1[0] === p0[0] ? 0 : (x - p0[0])/(p1[0] - p0[0]);
      const s = t*t*(3 - 2*t);   // lissage type spline
      L[x] = _c255(p0[1] + (p1[1] - p0[1])*s);
    }
    return L;
  }
  reset() { for (const k in this.channels) this.channels[k] = [[0,0],[255,255]]; this._emit(); }
  render(ctx) {
    const b = this.bounds;
    ctx.save();
    ctx.fillStyle = colorToCSS(getTheme().listBox.background); ctx.fillRect(b.x, b.y, b.width, b.height);
    ctx.strokeStyle = colorToCSS(_rgba(_solid(getTheme().label.text), 0.18)); ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath(); ctx.moveTo(b.x + b.width*i/4, b.y); ctx.lineTo(b.x + b.width*i/4, b.y+b.height);
      ctx.moveTo(b.x, b.y + b.height*i/4); ctx.lineTo(b.x+b.width, b.y + b.height*i/4); ctx.stroke();
    }
    ctx.strokeStyle = colorToCSS(_rgba(_solid(getTheme().label.text), 0.35));
    ctx.beginPath(); ctx.moveTo(b.x, b.y+b.height); ctx.lineTo(b.x+b.width, b.y); ctx.stroke();
    const col = { rgb:'#dddddd', r:'#e05555', g:'#55cc66', b:'#5599ee' };
    for (const ch of ['rgb','r','g','b']) {
      if (ch !== this.channel && ch !== 'rgb') continue;
      const L = this.lut(ch);
      ctx.strokeStyle = ch === this.channel ? col[ch] : _rgba(_hexRGB(col[ch]), 0.3);
      ctx.lineWidth = ch === this.channel ? 2 : 1;
      ctx.beginPath();
      for (let x = 0; x < 256; x++) { const X = b.x + x/255*b.width, Y = b.y + (1 - L[x]/255)*b.height; x ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
      ctx.stroke();
    }
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000';
    for (const p of this.channels[this.channel]) {
      const X = b.x + p[0]/255*b.width, Y = b.y + (1 - p[1]/255)*b.height;
      ctx.beginPath(); ctx.arc(X, Y, 4, 0, 7); ctx.fill(); ctx.stroke();
    }
    ctx.strokeStyle = colorToCSS(getTheme().listBox.border.color); ctx.strokeRect(b.x+.5, b.y+.5, b.width-1, b.height-1);
    ctx.restore();
  }
}

// ── Slider à piste dégradée (canaux RVB / TSV / alpha) ────────────────────
class GradSlider extends Slider {
  constructor(bounds, stops) { super(bounds); this.stops = stops || (() => ['#000','#fff']); this.showTooltip = false; }
  render(ctx) {
    const b = this.bounds, cy = b.y + b.height/2, tw = b.width - 10;
    ctx.save();

    _drawChecker(ctx, b.x+5, cy-6, tw, 12, 6);
    const g = ctx.createLinearGradient(b.x+5, 0, b.x+5+tw, 0);
    const st = this.stops();

    ctx.fillStyle = g; ctx.fillRect(b.x+5, cy-6, tw, 12);
    ctx.strokeStyle = colorToCSS(_rgba(_solid(getTheme().label.text), 0.45)); ctx.lineWidth = 1;
    ctx.strokeRect(b.x+5.5, cy-6.5, tw-1, 13);
    const t = (this.value - this.min)/Math.max(1e-6, this.max - this.min);
    const x = b.x + 5 + t*tw;

    ctx.beginPath(); ctx.moveTo(x, cy-9); ctx.lineTo(x-5, cy-16); ctx.lineTo(x+5, cy-16); ctx.closePath(); ctx.fill();

class ColorWheelWidget extends BaseWidget {
  constructor(bounds) {
    super('wheel_'+(++_idCounter), bounds);
    this.h = 0; this.s = 1; this.v = 1;
    this._drag = false; this.capturesDrag = true; this.cursor = 'crosshair';
    this._cache = null; this._cacheKey = '';
    this.on('mousedown', e => { e.stopPropagation?.(); this._drag = true; this._pick(e); });
    this.on('mousemove', e => { if (this._drag) this._pick(e); });
    this.on('mouseup', () => { this._drag = false; });
  }
  _pick(e) {
    const b = this.bounds, cx = b.x + b.width/2, cy = b.y + b.height/2, R = Math.min(b.width, b.height)/2 - 2;
    const dx = e.x - cx, dy = e.y - cy, r = Math.hypot(dx, dy);
    this.h = ((Math.atan2(dy, dx)*180/Math.PI) + 360) % 360;
    this.s = _clamp(r/R, 0, 1);
    this.markDirty();
    this.emit({ type:'change', target:this, x:0, y:0, stopPropagation(){}, preventDefault(){} });
  }
  setHSV(h, s, v) { this.h = h; this.s = s; this.v = v; this.markDirty(); }
  _wheelCanvas(size, v) {
    const key = size + '|' + v.toFixed(2);
    if (this._cache && this._cacheKey === key) return this._cache;
    const cv = _cv(size, size), c = cv.getContext('2d');
    const id = c.createImageData(size, size), d = id.data, R = size/2;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const dx = x - R + 0.5, dy = y - R + 0.5, r = Math.hypot(dx, dy);
      const i = (y*size+x)*4;
      if (r > R) { d[i+3] = 0; continue; }
      const h = ((Math.atan2(dy, dx)*180/Math.PI) + 360) % 360;
      const col = _hsv2rgb(h, _clamp(r/R, 0, 1), v);
      d[i] = col.r; d[i+1] = col.g; d[i+2] = col.b;
      d[i+3] = r > R-1.5 ? _c255((R - r)/1.5*255) : 255;
    }
    c.putImageData(id, 0, 0);
    this._cache = cv; this._cacheKey = key; return cv;
  }
  render(ctx) {
    const b = this.bounds, size = Math.min(b.width, b.height) - 4;
    const cv = this._wheelCanvas(Math.max(8, Math.round(size)), 1);

    ctx.drawImage(cv, x0, y0, size, size);
    const R = size/2, a = this.h*Math.PI/180;
    const px = x0 + R + Math.cos(a)*this.s*R, py = y0 + R + Math.sin(a)*this.s*R;
    ctx.save();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px, py, 6, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.stroke();
    ctx.restore();
  }
}

class HistoryListWidget extends BaseWidget {
  constructor(bounds, app) {
    super('hist_'+(++_idCounter), bounds);
    this.app = app; this.rowH = 22; this.scroll = 0;
    this.on('mousedown', e => {
      e.stopPropagation?.();
      const i = Math.floor((e.y - this.bounds.y + this.scroll)/this.rowH);
      if (i >= 0 && i < this.app.doc.history.length) { this.app.doc.gotoHistory(i); this.app.refreshAll(); }
    });
    this.on('scroll', e => { this.scroll = _clamp(this.scroll + (e.deltaY > 0 ? 44 : -44), 0, Math.max(0, this.app.doc.history.length*this.rowH - this.bounds.height)); this.markDirty(); e.stopPropagation?.(); });
  }
  ensureVisible() {
    const d = this.app.doc, y = d.histIndex*this.rowH;
    if (y < this.scroll) this.scroll = y;
    else if (y + this.rowH > this.scroll + this.bounds.height) this.scroll = y + this.rowH - this.bounds.height;
    this.markDirty();
  }
  render(ctx) {
    const b = this.bounds, d = this.app.doc, t = getTheme();
    ctx.save();
    ctx.beginPath(); ctx.rect(b.x, b.y, b.width, b.height); ctx.clip();
    ctx.fillStyle = colorToCSS(t.listBox.background); ctx.fillRect(b.x, b.y, b.width, b.height);
    ctx.font = fontToCSS(t.label.font); ctx.textBaseline = 'middle';
    d.history.forEach((h, i) => {
      const y = b.y + i*this.rowH - this.scroll;
      if (y + this.rowH < b.y || y > b.y + b.height) return;
      const cur = i === d.histIndex;
      if (cur) { ctx.fillStyle = colorToCSS(_solid(t.slider.fill.background)); ctx.fillRect(b.x, y, b.width, this.rowH); }
      ctx.fillStyle = colorToCSS(i > d.histIndex ? _rgba(_solid(t.label.text), 0.4) : (cur ? (t.messageDlg?.onAccent || hexToColor('#FFFFFF')) : t.label.text));
      ctx.textAlign = 'left';
      ctx.fillText('▸', b.x+6, y + this.rowH/2);
      ctx.fillText(h.name, b.x+22, y + this.rowH/2);
    });
    ctx.restore();
  }
}

// Barre d'options : au retour à la ligne, un libellé ne doit jamais être séparé
// du champ qu'il décrit → les items marqués `glue` restent collés au précédent.
class OptionsToolbar extends Toolbar {
  _relayout() {
    if (!this.wrap) return super._relayout();
    const b = this.bounds, rowH = this.rowH, maxX = b.width - this.padding;
    const widths = this._items.map(it => it.kind === 'sep' ? 8 : it.kind === 'stretch' ? 0
      : (it.width != null ? it.width : (typeof it.widget.measureWidth === 'function' ? it.widget.measureWidth() : it.widget.bounds.width)));
    const groups = [];
    this._items.forEach((it, i) => {
      if (!it.glue || !groups.length) groups.push([{ it, w:widths[i] }]);
      else groups[groups.length-1].push({ it, w:widths[i] });
    });
    let x = this.padding, y = this.padding, rows = 1;
    for (const g of groups) {
      const gw = g.reduce((s, e) => s + e.w, 0) + this.gap*(g.length-1);
      if (x > this.padding && x + gw > maxX) { x = this.padding; y += rowH + this.gap; rows++; }
      for (const e of g) {
        if (e.it.kind === 'stretch') continue;
        if (e.it.kind === 'sep') { e.it._x = x; e.it._y = y; x += 8 + this.gap; continue; }
        e.it.widget.bounds.x = x; e.it.widget.bounds.y = y;
        e.it.widget.bounds.width = e.w; e.it.widget.bounds.height = rowH;
        x += e.w + this.gap;
      }
    }
    this._rows = rows;
  }
}

class PaintApp {
  constructor() {
    this.doc = new PaintDoc(800, 600, '#ffffff');
    this.view = null; this.win = null;
    this.toolId = 'rectSelect'; this._prevTool = null;
    this.optsStore = {};
    this.primary = '#000000'; this.primaryAlpha = 255;
    this.secondary = '#FFFFFF'; this.secondaryAlpha = 255;
    this.act = null; this.gizmo = null; this.textEdit = null; this.lineEdit = null; this.shapeEdit = null;
    this.cloneSrc = null;
    this._needsOverlayFrame = false;
  }
  get tool() { return PTools[this.toolId]; }
  // ── couleurs ──
  primaryRGB()   { return _hexRGB(this.primary); }
  secondaryRGB() { return _hexRGB(this.secondary); }
  primaryHSV()   { const c = this.primaryRGB(); return _rgb2hsv(c.r, c.g, c.b); }
  primaryCSS()   { const c = this.primaryRGB();   return `rgba(${c.r},${c.g},${c.b},${this.primaryAlpha/255})`; }
  secondaryCSS() { const c = this.secondaryRGB(); return `rgba(${c.r},${c.g},${c.b},${this.secondaryAlpha/255})`; }
  setPrimary(hex, a) { this.primary = _ssHex(hex).toUpperCase(); if (a != null) this.primaryAlpha = a; this.refreshColors(); }
  setSecondary(hex, a) { this.secondary = _ssHex(hex).toUpperCase(); if (a != null) this.secondaryAlpha = a; this.refreshColors(); }
  swapColors() { const c = this.primary, a = this.primaryAlpha; this.primary = this.secondary; this.primaryAlpha = this.secondaryAlpha; this.secondary = c; this.secondaryAlpha = a; this.refreshColors(); this._syncColors && this._syncColors(); }
  resetColors() { this.primary = '#000000'; this.secondary = '#FFFFFF'; this.primaryAlpha = this.secondaryAlpha = 255; this.refreshColors(); this._syncColors && this._syncColors(); }
  refreshColors() {
    if (this._syncColors && !this._syncingColors) { this._syncingColors = true; try { this._syncColors(); } finally { this._syncingColors = false; } }
    if (this.winColors) { this.winColors.markDirty(); this.winColors.contentArea.markDirty(); }
  }
  // ── options d'outil ──
  opt(toolId, key) {
    const k = toolId + '.' + key;
    if (k in this.optsStore) return this.optsStore[k];
    const t = PTools[toolId];
    const d = (t.options || []).find(o => o.key === key);
    const def = d ? (d.def !== undefined ? d.def : (d.items ? d.items[0].v : (d.kind === 'check' ? false : 0))) : 0;
    this.optsStore[k] = def; return def;
  }
  setOpt(toolId, key, v) { this.optsStore[toolId + '.' + key] = v; }
  setTool(id) {
    if (id === this.toolId) return;
    const old = this.tool;
    if (old && old.onDeactivate) old.onDeactivate(this);
    this._prevTool = this.toolId;
    this.toolId = id; this.act = null;
    if (this._toolButtons) for (const k in this._toolButtons) this._toolButtons[k].toggled = (k === id);
    this.buildToolOptions();
    if (this.view) { this.view.cursor = PTools[id].cursor || 'crosshair'; this.view.markDirty(); }
    this.updateStatus(); this.refreshAll();
  }
  // ── événements canevas ──
  onCanvasDown(p, e) { const t = this.tool; if (t.onDown) t.onDown(this, p, e); }
  onCanvasMove(p, e, down) { const t = this.tool; if (t.onMove) t.onMove(this, p, e, down); }
  onCanvasUp(p, e)   { const t = this.tool; if (t.onUp) t.onUp(this, p, e); }
  onCanvasDblClick(p, e) { const t = this.tool; if (t.onDblClick) t.onDblClick(this, p, e); }
  onKey(e) {
    const t = this.tool;
    if (t.onKey && t.onKey(this, e)) { this.refreshAll(); return true; }
    return false;
  }
  refreshAll() {
    if (this.view) this.view.markDirty();
    if (this._layersList) this._layersList.markDirty();
    if (this._histList) { this._histList.ensureVisible(); this._histList.markDirty(); }
    if (this.winLayers) { this.winLayers.markDirty(); this.winLayers.contentArea.markDirty(); }
    if (this.winHistory) { this.winHistory.markDirty(); this.winHistory.contentArea.markDirty(); }
    if (this.win) this.win.markDirty();
    this.updateStatus();
  }
  toast(msg) { if (typeof toasts !== 'undefined' && toasts && toasts.show) toasts.show(msg); }
  updateStatus() {
    if (!this.sb) return;
    const d = this.doc, v = this.view;
    this.sbHint.setText(this.tool ? this.tool.name : '');
    const s = d.selection ? d.selection.bounds : null;
    this.sbSel.setText(s ? `${s.w} × ${s.h}` : `${d.width} × ${d.height}`);
    const m = v && v._mouseImg;
    this.sbPos.setText(m ? `${Math.floor(m.x)}, ${Math.floor(m.y)}` : '—');
    if (this.zoomLbl) this.zoomLbl.text = Math.round((v ? v.zoom : 1)*100) + ' %';
    if (this.zoomSl && !this.zoomSl._dragging) this.zoomSl.value = _clamp(Math.round(Math.log2((v ? v.zoom : 1))*100), -700, 600);
    this.sb.markDirty();
    if (this.win) this.win.title = `${d.fileName}${d.dirty ? ' *' : ''} — Paint.NET v5.1.12 (clone Canvas GUI)`;
  }

  // ── commandes ──
  cmd(name, arg) {
    const d = this.doc, v = this.view;
    switch (name) {
      case 'new': new NewImageDialog(this, (w, h, dpi) => {
          this.doc = new PaintDoc(w, h, '#ffffff'); this.doc.dpi = dpi;
          this.view.zoomFit(); this.refreshAll();
        }).showModal(); break;
      case 'open': pickImageFile(f => loadImageFile(f, async (img, json, name) => {
          if (json) { this.doc = await docFromPdn(json); this.doc.fileName = name; }
          else { this.doc = PaintDoc.fromImage(img, name); }
          this.view.zoomFit(); this.refreshAll();
        })); break;
      case 'save': saveDocAs(this, 'png'); break;
      case 'savePng': saveDocAs(this, 'png'); break;
      case 'saveJpg': saveDocAs(this, 'jpg'); break;
      case 'saveWebp': saveDocAs(this, 'webp'); break;
      case 'savePdn': saveDocAs(this, 'pdn'); break;
      case 'print': printDoc(this); break;
      case 'close': Dialogs.confirm("Fermer l'image en cours ?").then(r => { if (r.result === 'ok') { this.doc = new PaintDoc(800, 600, '#ffffff'); this.view.zoomFit(); this.refreshAll(); } }); break;
      case 'undo': if (d.undo()) this.refreshAll(); break;
      case 'redo': if (d.redo()) this.refreshAll(); break;
      case 'cut': this.cmd('copy'); this.cmd('eraseSel'); break;
      case 'copy': case 'copyMerged': {
        const b = d.selBounds();
        const cv = _cv(Math.max(1, b.w), Math.max(1, b.h)), c = cv.getContext('2d');
        c.drawImage(name === 'copyMerged' ? d.composite() : d.layer.canvas, -b.x, -b.y);
        if (d.selection) {
          const m = _cv(cv.width, cv.height), mc = m.getContext('2d');
          mc.drawImage(d.selection.cv, -b.x, -b.y);
          c.globalCompositeOperation = 'destination-in'; c.drawImage(m, 0, 0);
        }
        _paintClipboard = cv;
        try { cv.toBlob(bl => { if (bl && navigator.clipboard && window.ClipboardItem) navigator.clipboard.write([new ClipboardItem({ 'image/png': bl })]).catch(()=>{}); }); } catch (e) {}
        this.toast('Copié'); break;
      }
      case 'paste': case 'pasteLayer': case 'pasteImage': {
        if (!_paintClipboard) { this.toast('Presse-papiers vide'); break; }
        const cb = _paintClipboard;
        if (name === 'pasteImage') { this.doc = PaintDoc.fromImage(cb, 'Collage'); this.view.zoomFit(); this.refreshAll(); break; }
        if (name === 'pasteLayer') { const l = new PaintLayer(d.width, d.height, 'Calque collé'); l.ctx.drawImage(cb, 0, 0); d.addLayer(l); }
        else d.layer.ctx.drawImage(cb, 0, 0);
        d.layer.touch(); d.touch(); d.pushHistory('Coller', 'paste'); this.refreshAll(); break;
      }
      case 'eraseSel': {
        const L = d.layer;
        L.ctx.save();
        if (d.selection) { L.ctx.globalCompositeOperation = 'destination-out'; L.ctx.drawImage(d.selection.cv, 0, 0); }
        else L.ctx.clearRect(0, 0, d.width, d.height);
        L.ctx.restore(); L.touch(); d.touch(); d.pushHistory('Effacer la sélection', 'erase'); this.refreshAll(); break;
      }
      case 'fillSel': d.paint(c => { c.fillStyle = this.primaryCSS(); c.fillRect(0, 0, d.width, d.height); });
        d.pushHistory('Remplir la sélection', 'fill'); this.refreshAll(); break;
      case 'copySel': _paintSelClipboard = d.selection ? d.selection.clone() : null; this.toast(_paintSelClipboard ? 'Sélection copiée' : 'Aucune sélection'); break;
      case 'pasteSel': {
        if (!_paintSelClipboard) { this.toast('Aucune sélection copiée'); break; }
        const sel = _paintSelClipboard.clone();
        if (!d.selection || arg === 'replace' || !arg) d.selection = sel;
        else d.selection.combine(sel, arg);
        d.touch(); d.pushHistory('Coller la sélection', 'select'); this.refreshAll(); break;
      }
      case 'colorProfile': {
        const L = d.layer, base = _cloneCv(L.canvas);
        const dlg = new PDialog('Profil de couleur', [
          { key:'p', label:'Profil :', type:'combo', def:'srgb', items:[{v:'srgb',t:'sRGB (IEC 61966-2.1)'},{v:'linear',t:'Linéaire (gamma 1.0)'},{v:'adobe',t:'Adobe RGB (approx.)'}] },
          { key:'g', label:'Gamma :', type:'slider', min:0.1, max:3, step:0.05, decimals:2, def:1 },
        ], {
          onChange: v => {
            L.ctx.globalCompositeOperation = 'copy'; L.ctx.drawImage(base, 0, 0); L.ctx.globalCompositeOperation = 'source-over';
            const g = v.p === 'linear' ? 2.2*v.g : v.p === 'adobe' ? (2.2/2.19)*v.g : v.g;
            if (Math.abs(g-1) < 1e-3) { L.touch(); d.touch(); return; }
            const lut = new Uint8ClampedArray(256);
            for (let i = 0; i < 256; i++) lut[i] = _c255(Math.pow(i/255, 1/g)*255);
            d.applyPixels(src => _applyLUT(src, lut), L);
          },
          onOk: () => { d.pushHistory('Profil de couleur', 'image'); this.refreshAll(); },
          onCancel: () => { L.ctx.globalCompositeOperation = 'copy'; L.ctx.drawImage(base, 0, 0); L.ctx.globalCompositeOperation = 'source-over'; L.touch(); d.touch(); this.refreshAll(); },
        });
        dlg.showModal(); break;
      }
      case 'quit': engine.windowManager.removeWindow(this.win); this.win = null; break;
      case 'selectAll': d.selectAll(); d.pushHistory('Sélectionner tout', 'select'); this.refreshAll(); break;
      case 'deselect': d.deselect(); d.pushHistory('Désélectionner', 'select'); this.refreshAll(); break;
      case 'invertSel': if (!d.selection) d.selectAll(); d.selection.invert(); d.touch(); d.pushHistory('Inverser la sélection', 'select'); this.refreshAll(); break;
      case 'zoomIn': v.zoomIn(); break;
      case 'zoomOut': v.zoomOut(); break;
      case 'zoomFit': v.zoomFit(); break;
      case 'zoomSel': v.zoomToSelection(); break;
      case 'zoom100': v.setZoom(1); break;
      case 'toggleGrid': v.showGrid = !v.showGrid; v.markDirty(); break;
      case 'toggleRulers': v.showRulers = !v.showRulers; v.clampOffsets(); v.markDirty(); break;
      case 'unit': v.unit = arg; v.markDirty(); this.updateStatus(); break;
      case 'crop': {
        if (!d.selection) { this.toast('Aucune sélection'); break; }
        const b = d.selection.bounds; d.cropTo(b.x, b.y, b.w, b.h);
        d.deselect(); d.pushHistory('Rogner selon la sélection', 'image'); v.zoomFit(); this.refreshAll(); break;
      }
      case 'resize': openResizeDialog(this); break;
      case 'canvasSize': openCanvasSizeDialog(this); break;
      case 'flipH': d.flipH(); d.pushHistory('Retourner horizontalement', 'image'); this.refreshAll(); break;
      case 'flipV': d.flipV(); d.pushHistory('Retourner verticalement', 'image'); this.refreshAll(); break;
      case 'rotCW': d.rot90(true); d.pushHistory('Pivoter de 90° à droite', 'image'); v.zoomFit(); this.refreshAll(); break;
      case 'rotCCW': d.rot90(false); d.pushHistory('Pivoter de 90° à gauche', 'image'); v.zoomFit(); this.refreshAll(); break;
      case 'rot180': d.rot180(); d.pushHistory('Pivoter de 180°', 'image'); this.refreshAll(); break;
      case 'flatten': d.flatten(); d.pushHistory('Aplatir', 'image'); this.refreshAll(); break;
      case 'layerAdd': d.addLayer(new PaintLayer(d.width, d.height, `Calque ${d.layers.length+1}`)); d.pushHistory('Ajouter un nouveau calque', 'layer'); this.refreshAll(); break;
      case 'layerDup': { const l = d.layer.clone(); l.name = d.layer.name + ' — copie'; d.addLayer(l); d.pushHistory('Dupliquer le calque', 'layer'); this.refreshAll(); break; }
      case 'layerDel': if (d.removeLayer(d.active)) { d.pushHistory('Supprimer le calque', 'layer'); this.refreshAll(); } else this.toast('Impossible de supprimer le dernier calque'); break;
      case 'layerMerge': if (d.mergeDown(d.active)) { d.pushHistory('Fusionner avec le calque inférieur', 'layer'); this.refreshAll(); } break;
      case 'layerToggle': d.layer.visible = !d.layer.visible; d.touch(); this.refreshAll(); break;
      case 'layerUp': if (d.active < d.layers.length-1) { d.moveLayer(d.active, d.active+1); d.pushHistory('Déplacer le calque vers le haut', 'layer'); this.refreshAll(); } break;
      case 'layerDown': if (d.active > 0) { d.moveLayer(d.active, d.active-1); d.pushHistory('Déplacer le calque vers le bas', 'layer'); this.refreshAll(); } break;
      case 'layerTop': d.moveLayer(d.active, d.layers.length-1); d.pushHistory('Déplacer le calque tout en haut', 'layer'); this.refreshAll(); break;
      case 'layerBottom': d.moveLayer(d.active, 0); d.pushHistory('Déplacer le calque tout en bas', 'layer'); this.refreshAll(); break;
      case 'layerSelUp': if (d.active < d.layers.length-1) { d.active++; this.refreshAll(); } break;
      case 'layerSelDown': if (d.active > 0) { d.active--; this.refreshAll(); } break;
      case 'layerSelTop': d.active = d.layers.length-1; this.refreshAll(); break;
      case 'layerSelBottom': d.active = 0; this.refreshAll(); break;
      case 'layerProps': openLayerPropsDialog(this); break;
      case 'layerImport': pickImageFile(f => loadImageFile(f, img => {
          if (!img) return;
          const l = new PaintLayer(d.width, d.height, 'Image importée');
          l.ctx.drawImage(img, 0, 0); d.addLayer(l); d.pushHistory('Importer à partir d’un fichier', 'layer'); this.refreshAll();
        })); break;
      case 'layerFlipH': { const L = d.layer, old = _cloneCv(L.canvas); L.ctx.clearRect(0,0,d.width,d.height); L.ctx.save(); L.ctx.translate(d.width,0); L.ctx.scale(-1,1); L.ctx.drawImage(old,0,0); L.ctx.restore(); L.touch(); d.touch(); d.pushHistory('Calque : retourner horizontalement', 'layer'); this.refreshAll(); break; }
      case 'layerFlipV': { const L = d.layer, old = _cloneCv(L.canvas); L.ctx.clearRect(0,0,d.width,d.height); L.ctx.save(); L.ctx.translate(0,d.height); L.ctx.scale(1,-1); L.ctx.drawImage(old,0,0); L.ctx.restore(); L.touch(); d.touch(); d.pushHistory('Calque : retourner verticalement', 'layer'); this.refreshAll(); break; }
      case 'layerRot180': { const L = d.layer, old = _cloneCv(L.canvas); L.ctx.clearRect(0,0,d.width,d.height); L.ctx.save(); L.ctx.translate(d.width,d.height); L.ctx.rotate(Math.PI); L.ctx.drawImage(old,0,0); L.ctx.restore(); L.touch(); d.touch(); d.pushHistory('Calque : pivoter de 180°', 'layer'); this.refreshAll(); break; }
      case 'rotateZoom': openRotateZoomDialog(this); break;
      case 'randomFx': { const ids = Object.keys(PEffects); const id = ids[Math.floor(Math.random()*ids.length)]; PEffects[id].run(this); break; }
      case 'pluginErrors': Dialogs.showMessage('Aucune erreur de plug-in.', { caption:'Erreurs des plug-ins' }); break;
      case 'about': Dialogs.showMessage("Clone de Paint.NET construit sur le Canvas GUI Framework.\nCalques, sélections, 19 outils, ajustements et effets.", { caption:'À propos' }); break;
      default: if (PAdjust[name]) PAdjust[name].run(this); else if (PEffects[name]) PEffects[name].run(this);
    }
  }

  // Adapte les largeurs de la barre d'état à la largeur de la fenêtre
  layoutStatusBar() {
    const sb = this.sb; if (!sb) return;
    const W = sb.bounds.width;
    const narrow = W < 620, tiny = W < 460;
    const set = (i, w) => { if (sb._panels[i]) sb._panels[i].width = w; };
    set(1, tiny ? 84 : narrow ? 96 : 110);           // taille de sélection
    set(2, tiny ? 0 : narrow ? 78 : 100);            // position du curseur
    set(3, tiny ? 56 : 70);                          // unité
    set(4, tiny ? 46 : 56);                          // pourcentage de zoom
    set(5, Math.max(60, Math.min(154, W - (tiny ? 300 : narrow ? 380 : 430))));  // curseur de zoom
    sb._relayout(); sb.markDirty();
  }

  // ── barre d'options de l'outil ──
  buildToolOptions() {
    if (!this.win) return;
    const t = this.tool;
    const bw = getTheme().window.border.width;
    const bar = new OptionsToolbar({ x:0, y:0, width:this.win.bounds.width - bw*2, height:30 }, { wrap:true, rowH:24, padding:3 });
    const glue = () => { const it = bar._items[bar._items.length-1]; if (it) it.glue = true; };
    const lbl = new Label('Outil :', { x:0, y:0, width:44, height:22 });
    bar.addWidget(lbl, { width:44 });
    const ico = new IconButton(t.icon, { width:26, height:24, iconSize:16, tooltip:t.name });
    ico.on('click', () => { const w = openToolsWindow(); engine.windowManager.bringToFront?.(w); });
    bar.addWidget(ico, { width:26 }); glue();
    bar.addSeparator();
    for (const o of (t.options || [])) {
      if (o.kind === 'label') {
        const l = new Label(o.text, { x:0, y:0, width:10, height:22 });
        _measureCtx.font = fontToCSS(getTheme().label.font);
        bar.addWidget(l, { width: Math.ceil(_measureCtx.measureText(o.text).width) + 8 });
      } else if (o.kind === 'num') {
        const n = new InputNumber({ x:0, y:0, width:o.width || 64, height:22 }, { min:o.min, max:o.max, step:o.step || 1, value:this.opt(t.id, o.key) });
        n.on('change', () => this.setOpt(t.id, o.key, n.value));
        bar.addWidget(n, { width:o.width || 64 }); glue();
      } else if (o.kind === 'combo') {
        const dd = new DropDown(o.items.map(i => i.t), { x:0, y:0, width:o.width || 120, height:22 });
        const cur = this.opt(t.id, o.key);
        dd.selectedIndex = Math.max(0, o.items.findIndex(i => i.v === cur));
        dd.on('change', () => this.setOpt(t.id, o.key, o.items[dd.selectedIndex].v));
        bar.addWidget(dd, { width:o.width || 120 }); glue();
      } else if (o.kind === 'check') {
        const cb = new CheckBox(o.text, { x:0, y:0, width:0, height:22 });
        cb.checked = !!this.opt(t.id, o.key);
        cb.on('change', () => this.setOpt(t.id, o.key, cb.checked));
        _measureCtx.font = fontToCSS(getTheme().checkBox.font);
        bar.addWidget(cb, { width: Math.ceil(_measureCtx.measureText(o.text).width) + 26 });
      } else if (o.kind === 'sep') bar.addSeparator();
    }
    const h = bar.fitHeight();
    bar.bounds.height = h;
    this.win.setToolbar2(bar, h);
    this.toolbar2 = bar;
    this.win._updateLayout();
  }

// ── Fenêtre principale ────────────────────────────────────────────────────
function openPaintWindow() {
  if (PA.win && engine.windowManager.windows.includes(PA.win)) { engine.windowManager.bringToFront?.(PA.win); return PA.win; }
  const narrow = canvas.width < 1150;
  const leftPad = 92;                                   // place de la palette d'outils
  const rightPad = narrow ? 12 : 276;                   // place des fenêtres Historique / Calques
  const b = winBounds(Math.max(420, canvas.width - leftPad - rightPad), Math.max(380, canvas.height - 72), leftPad, 56);
  const win = new GUIWindow('Sans titre — Paint.NET v5.1.12 (clone Canvas GUI)', b);
  PA.win = win;
  const ca = win.contentArea;
  ca._contentSize = () => ({ w:0, h:0 });

  // menu
  const mb = new MenuBar({ x:0, y:0, width:b.width, height:26 }, { menus: PA.buildMenus() });
  win.setMenuBar(mb, 26);

  // barre d'outils principale
  const tb = new Toolbar({ x:0, y:0, width:b.width, height:34 }, { padding:4, rowH:28 });
  const add = (icon, tip, cmd) => { const bt = new IconButton(icon, { width:28, height:28, iconSize:19, tooltip:tip }); bt.on('click', () => PA.cmd(cmd)); tb.addWidget(bt, { width:28 }); return bt; };
  add('newDoc', 'Nouveau (Ctrl+N)', 'new');
  add('open', 'Ouvrir (Ctrl+O)', 'open');
  add('save', 'Enregistrer (Ctrl+S)', 'savePng');
  add('print', 'Imprimer (Ctrl+P)', 'print');
  tb.addSeparator();
  add('cut', 'Couper (Ctrl+X)', 'cut');
  add('copy', 'Copier (Ctrl+C)', 'copy');
  add('paste', 'Coller (Ctrl+V)', 'paste');
  tb.addSeparator();
  add('crop', 'Rogner selon la sélection', 'crop');
  add('deselect', 'Désélectionner (Ctrl+D)', 'deselect');
  tb.addSeparator();
  PA._btnUndo = add('undo', 'Annuler (Ctrl+Z)', 'undo');
  PA._btnRedo = add('redo', 'Répéter (Ctrl+Y)', 'redo');
  tb.addSeparator();
  add('grid', 'Grille des pixels', 'toggleGrid');
  add('ruler', 'Règles', 'toggleRulers');
  tb.addStretch();
  const bPal = new IconButton('palette', { width:28, height:28, iconSize:19, tooltip:'Fenêtre Couleurs' });
  bPal.on('click', () => openColorsWindow()); tb.addWidget(bPal, { width:28 });
  const bSet = new IconButton('settings', { width:28, height:28, iconSize:19, tooltip:'Paramètres' });
  bSet.on('click', () => Dialogs.showMessage('Paramètres — thème géré par la barre du haut.', { caption:'Paramètres' }));
  tb.addWidget(bSet, { width:28 });
  const bHelp = new IconButton('help', { width:28, height:28, iconSize:19, tooltip:'À propos' });
  bHelp.on('click', () => PA.cmd('about')); tb.addWidget(bHelp, { width:28 });
  win.setToolbar(tb, 34);

  // zone de dessin
  const view = new PaintCanvasWidget({ x:0, y:0, width:ca.bounds.width, height:ca.bounds.height }, PA);
  PA.view = view;
  view.cursor = PTools[PA.toolId].cursor || 'crosshair';
  view.on('keydown', e => {
    if (PA.onKey(e)) { e.preventDefault?.(); e.stopPropagation?.(); }
  });
  ca.addChild(view);

  // barre d'état
  const sb = new StatusBar({ x:0, y:0, width:b.width, height:24 });
  PA.sb = sb;
  PA.sbHint = sb.addPanel({ text:'', width:0 });
  PA.sbSel  = sb.addPanel({ text:'', width:110, align:'center' });
  PA.sbPos  = sb.addPanel({ text:'', width:100, align:'center' });
  const unitDD = new DropDown(['px','pouces','cm'], { x:0, y:0, width:80, height:18 });
  unitDD.selectedIndex = 0;
  unitDD.on('change', () => PA.cmd('unit', ['px','in','cm'][unitDD.selectedIndex]));
  sb.addWidget(unitDD, { width:84 });
  const zl = new Label('100 %', { x:0, y:0, width:60, height:18 });
  zl.align = 'center'; PA.zoomLbl = zl;
  sb.addWidget(zl, { width:62 });
  const zoomSl = new Slider({ x:0, y:0, width:150, height:18 });
  zoomSl.min = -700; zoomSl.max = 600; zoomSl.step = 1; zoomSl.value = 0; zoomSl.showTooltip = false;
  zoomSl.on('change', () => { PA.view.setZoom(Math.pow(2, zoomSl.value/100)); });
  PA.zoomSl = zoomSl;
  sb.addWidget(zoomSl, { width:154 });
  sb.showGrip = false;
  win.setStatusBar(sb, 24);

  // relayout
  const origLayout = win._updateLayout.bind(win);
  win._updateLayout = () => {
    origLayout();                       // positionne et dimensionne déjà les docks (innerW)
    // la barre d'options peut changer de nombre de rangées avec la largeur
    if (PA.toolbar2) {
      const h = PA.toolbar2.fitHeight();
      if (h !== win._dockTop2H) { win._dockTop2H = h; PA.toolbar2.bounds.height = h; origLayout(); }
    }
    PA.layoutStatusBar();
    const c = win.contentArea.bounds;
    view.setBounds({ x:0, y:0, width:c.width, height:c.height });
    view.clampOffsets();
  };

  // La fenêtre suit la taille du canevas tant que l'utilisateur ne l'a pas
  // déplacée ou redimensionnée lui-même.
  win._autoFit = true;
  const origStartDrag = win.startDrag.bind(win);
  // startDrag est appelé à CHAQUE clic dans la fenêtre : ne couper le suivi
  // automatique que si un déplacement ou un redimensionnement démarre vraiment.
  win.startDrag = (ax, ay, btn) => { origStartDrag(ax, ay, btn); if (win._dragging || win._resizing) win._autoFit = false; };

  engine.windowManager.addWindow(win);
  win._updateLayout();
  PA.buildToolOptions();
  view.zoomFit();
  PA.refreshAll();
  return win;
}

// Réajuste la fenêtre principale quand le canevas change de taille
function _paintFitMainWindow() {
  const w = PA.win;
  if (!w || !w._autoFit || !engine.windowManager.windows.includes(w)) return;
  const narrow = canvas.width < 1150;
  const b = winBounds(Math.max(420, canvas.width - 92 - (narrow ? 12 : 276)), Math.max(380, canvas.height - 72), 92, 56);
  w.bounds.x = b.x; w.bounds.y = b.y; w.bounds.width = b.width; w.bounds.height = b.height;
  w._updateLayout(); w.markDirty();
  if (PA.winTools) { PA.winTools.bounds.x = 8; PA.winTools.bounds.y = 64; PA.winTools.markDirty(); }
  if (PA.view) { PA.view.clampOffsets(); PA.view.markDirty(); }
  engine._fullRedraw = true;
}
window.addEventListener('resize', () => setTimeout(_paintFitMainWindow, 0));

// ── Raccourcis clavier globaux ────────────────────────────────────────────
const TOOL_KEYS = { s:['rectSelect','lasso','ellipseSelect'], m:['moveSel','moveSelection'], w:['magicWand'], z:['zoom'], h:['pan'],
  f:['bucket'], g:['gradient'], b:['brush'], e:['eraser'], p:['pencil'], k:['picker'], l:['clone'], r:['recolor'], t:['text'], d:['line'], o:['shapes'] };
window.addEventListener('keydown', e => {
  if (!PA.win || !engine.windowManager.windows.includes(PA.win)) return;
  const focused = engine.windowManager._focusedWidget;
  if (focused instanceof TextBox) return;                 // saisie en cours
  // Édition de texte / tracé en cours sur le canevas : l'outil a la priorité
  // absolue sur les raccourcis (sinon Retour arrière remplit la sélection…).
  if (PA.textEdit || PA.lineEdit || PA.shapeEdit) return;
  if (engine.windowManager._topModal && engine.windowManager._topModal()) return;
  const k = e.key.toLowerCase();
  const C = e.ctrlKey || e.metaKey, S = e.shiftKey, A = e.altKey;
  let done = true;
  if (C && !S && !A && k === 'n') PA.cmd('new');
  else if (C && !S && k === 'o') PA.cmd('open');
  else if (C && !S && k === 's') PA.cmd('savePng');
  else if (C && !S && k === 'p') PA.cmd('print');
  else if (C && !S && k === 'z') PA.cmd('undo');
  else if ((C && !S && k === 'y') || (C && S && k === 'z')) PA.cmd('redo');
  else if (C && !S && k === 'x') PA.cmd('cut');
  else if (C && S && A && k === 'c') PA.cmd('copySel');
  else if (C && S && k === 'c') PA.cmd('copyMerged');
  else if (C && !S && k === 'c') PA.cmd('copy');
  else if (C && S && k === 'v') PA.cmd('pasteLayer');
  else if (C && A && k === 'v') PA.cmd('pasteImage');
  else if (C && !S && k === 'v') PA.cmd('paste');
  else if (C && !S && k === 'a') PA.cmd('selectAll');
  else if (C && !S && k === 'd') PA.cmd('deselect');
  else if (C && S && k === 'i') PA.cmd('invert');
  else if (C && A && k === 'i') PA.cmd('invertAlpha');
  else if (C && !S && !A && k === 'i') PA.cmd('invertSel');
  else if (C && S && k === 'x') PA.cmd('crop');
  else if (C && !S && k === 'r') PA.cmd('resize');
  else if (C && S && k === 'r') PA.cmd('canvasSize');
  else if (C && !S && k === 'h') PA.cmd('rotCW');
  else if (C && !S && k === 'g') PA.cmd('rotCCW');
  else if (C && S && k === 'f') PA.cmd('flatten');
  else if (C && S && k === 'n') PA.cmd('layerAdd');
  else if (C && S && k === 'd') PA.cmd('layerDup');
  else if (C && !S && k === 'm') PA.cmd('layerMerge');
  else if (C && S && k === 'l') PA.cmd('autolevel');
  else if (C && S && k === 'm') PA.cmd('curves');
  else if (C && !S && k === 'l') PA.cmd('levels');
  else if (C && S && k === 'g') PA.cmd('bw');
  else if (C && S && k === 'p') PA.cmd('posterize');
  else if (C && S && k === 'e') PA.cmd('sepia');
  else if (C && S && k === 'u') PA.cmd('huesat');
  else if (C && S && k === 't') PA.cmd('brightcontrast');
  else if (C && S && k === 'b') PA.cmd('zoomSel');
  else if (C && !S && k === 'b') PA.cmd('zoomFit');
  else if (C && (k === '+' || k === '=')) PA.cmd('zoomIn');
  else if (C && k === '-') PA.cmd('zoomOut');
  else if (C && k === '0') PA.cmd('zoom100');
  else if (k === 'f4') PA.cmd('layerProps');
  else if (!C && !A && k === 'delete') PA.cmd('eraseSel');
  else if (!C && !A && k === 'backspace') PA.cmd('fillSel');
  else if (!C && !A && TOOL_KEYS[k] && !PA.textEdit) {
    const list = TOOL_KEYS[k], i = list.indexOf(PA.toolId);
    PA.setTool(list[(i+1) % list.length]);
  }
  else done = false;
  if (done) { e.preventDefault(); e.stopPropagation(); }
}, true);

// ── Débogage hit-test ─────────────────────────────────────────────────────
window.toggleDebugHit = function() {
  _debugHitTest = !_debugHitTest;
  const btn = document.getElementById('debugHitBtn');
  if (btn) btn.style.outline = _debugHitTest ? '2px solid #f80' : '';
  engine.windowManager.markDirty();
};
window.openPaintWindow = openPaintWindow;
window.openToolsWindow = openToolsWindow;
window.openColorsWindow = openColorsWindow;
window.openLayersWindow = openLayersWindow;
window.openHistoryWindow = openHistoryWindow;

// ── Démarrage ─────────────────────────────────────────────────────────────
currentTheme = themes['modern-dark'] || currentTheme;
const _sel = document.getElementById('themeSelect'); if (_sel) _sel.value = 'modern-dark';
const _narrowUI = canvas.width < 1150;
openPaintWindow();
openToolsWindow();
if (!_narrowUI) { openHistoryWindow(); openLayersWindow(); openColorsWindow(); }
engine.windowManager.bringToFront?.(PA.win);
PA.refreshAll();

engine.start();
</script>

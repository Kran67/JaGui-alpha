<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint — clone de Paint.NET (Canvas GUI Framework)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  body { background: #1a1a2e; display: flex; flex-direction: column; font-family: system-ui; }

  /* ---- TOOLBAR ---- */
  #toolbar {
    background: rgba(0,0,0,0.6);
    width: 100%;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    border-bottom: 1px solid rgba(255,255,255,0.12);
    z-index: 10;
    flex-shrink: 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  #toolbar::-webkit-scrollbar { display: none; }
  #toolbar label { color: #aaa; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  #themeSelect {
    background: #2a2a4a; color: #ddd; border: 1px solid #555;
    border-radius: 4px; padding: 6px 8px; font-size: 12px; cursor: pointer;
    flex-shrink: 0; min-height: 34px;
    -webkit-appearance: none; appearance: none;
  }
  .tb-btn {
    background: #2a2a4a; color: #ccc; border: 1px solid #555;
    border-radius: 4px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    transition: background 0.15s, color 0.15s; white-space: nowrap;
    flex-shrink: 0; min-height: 34px; user-select: none;
    -webkit-user-select: none;
  }
  .tb-btn:hover, .tb-btn:active { background: #3a3a6a; color: #fff; border-color: #888; }

  @media (max-width: 480px) {
    .tb-btn { padding: 6px 8px; font-size: 11px; }
    .tb-label { display: none; }
  }

  /* ---- CANVAS ---- */
  #canvasContainer { flex: 1; width: 100%; position: relative; overflow: hidden; min-height: 0; }
  canvas { display: block; touch-action: none; cursor: default; outline: none; }

  /* ---- OVERLAYS ---- */
  #fps { position: fixed; bottom: 6px; right: 10px; color: rgba(255,255,255,0.35); font-size: 10px; font-family: monospace; pointer-events: none; }
  #info { position: fixed; bottom: 6px; left: 10px; color: rgba(255,255,255,0.25); font-size: 10px; font-family: monospace; pointer-events: none; }
  @media (max-width: 480px) { #info { display: none; } }

  /* ---- HIDDEN INPUT for mobile keyboard ---- */
  #mobileInput {
    position: fixed; top: -200px; left: 0;
    width: 1px; height: 1px; opacity: 0;
    border: none; outline: none; background: transparent;
    font-size: 16px;
  }
</style>
</head>

<div id="toolbar">
  <label class="tb-label">🎨</label>
  <select id="themeSelect">
    <option value="modern-dark">Dark</option>
    <option value="windows-xp">Windows XP</option>
    <option value="macos">macOS</option>
    <option value="windows-vista">Vista Aero</option>

  <button class="tb-btn" onclick="openToolsWindow()">🧰 <span class="tb-label">Outils</span></button>

  <button class="tb-btn" onclick="openLayersWindow()">📚 <span class="tb-label">Calques</span></button>

// ---- TYPES ----
const _colorCSSCache0 = new Map();
function colorToCSS(c) {
  if (!c) return 'transparent';
  if (typeof c === 'string') return c;
  const a = c.a !== undefined ? c.a : 1;
  const key = c.r * 100000000 + c.g * 100000 + c.b * 1000 + Math.round(a * 999);
  let v = _colorCSSCache0.get(key);
  if (v === undefined) {
    v = a < 1 ? `rgba(${c.r},${c.g},${c.b},${a})` : `rgb(${c.r},${c.g},${c.b})`;
    if (_colorCSSCache0.size > 256) _colorCSSCache0.clear();
    _colorCSSCache0.set(key, v);
  }
  return v;
}
function hexToColor(hex) {
  let clean = hex.replace('#', '');
  if (clean.length === 3) clean = clean[0]+clean[0]+clean[1]+clean[1]+clean[2]+clean[2];
  return { r: parseInt(clean.substring(0, 2), 16), g: parseInt(clean.substring(2, 4), 16), b: parseInt(clean.substring(4, 6), 16), a: 1 };
}
function _easeOut(t)      { return 1-(1-t)*(1-t); }
function _easeOutCubic(t) { return 1-(1-t)*(1-t)*(1-t); }
function _easeInOut(t)    { return t<0.5 ? 2*t*t : 1-2*(1-t)*(1-t); }
function _easeSpring(t)   { // slight overshoot
  const c4 = (2*Math.PI)/3;
  return t===0?0:t===1?1:Math.pow(2,-8*t)*Math.sin((t*10-0.75)*c4)+1;
}

function rectContains(rect, x, y) {
  return x >= rect.x && x < rect.x + rect.width && y >= rect.y && y < rect.y + rect.height;
}
function rectIntersects(a, b) {
  return !(a.x + a.width <= b.x || b.x + b.width <= a.x || a.y + a.height <= b.y || b.y + b.height <= a.y);
}
function rectUnion(a, b) {
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  return { x, y, width: Math.max(a.x + a.width, b.x + b.width) - x, height: Math.max(a.y + a.height, b.y + b.height) - y };
}
function rectInflate(r, dx, dy) {
  const dxy = dy !== undefined ? dy : dx;
  return { x: r.x - dx, y: r.y - dxy, width: r.width + dx * 2, height: r.height + dxy * 2 };
}

function fontToCSS(f) {

function drawGradient(ctx, x, y, w, h, bg, vertical=true) {
  if (Array.isArray(bg)) {

    bg.forEach(s => grad.addColorStop(s.offset, colorToCSS(s.color)));

  } else {

  }
}
function applyShadow(ctx, s) {
  if (s) { ctx.shadowOffsetX = s.x; ctx.shadowOffsetY = s.y; ctx.shadowBlur = s.blur; ctx.shadowColor = colorToCSS(s.color); }

function clearShadow(ctx) {

// r can be: number | {tl,tr,br,bl} | [tl,tr,br,bl]
function _resolveRadii(r, w, h) {
  const max = Math.max(0, Math.min(w, h) / 2);
  const clamp = v => Math.min(Math.max(v||0, 0), max);
  if (typeof r === 'number') { const c=clamp(r); return [c,c,c,c]; }
  if (Array.isArray(r)) return r.map(clamp);
  return [clamp(r.tl), clamp(r.tr), clamp(r.br), clamp(r.bl)];
}
// Test if point (px,py) is inside a rounded rect — matches drawRoundRect exactly
function pointInRoundRect(px, py, x, y, w, h, r) {
  if (px < x || px > x+w || py < y || py > y+h) return false;
  if (!r) return true;
  const [tl, tr, br, bl] = _resolveRadii(r, w, h);
  // Check each corner: if point is in the corner bounding square, test circle
  // Top-left
  if (px < x+tl && py < y+tl && (px-x-tl)**2+(py-y-tl)**2 > tl*tl) return false;
  // Top-right
  if (px > x+w-tr && py < y+tr && (px-x-w+tr)**2+(py-y-tr)**2 > tr*tr) return false;
  // Bottom-right
  if (px > x+w-br && py > y+h-br && (px-x-w+br)**2+(py-y-h+br)**2 > br*br) return false;
  // Bottom-left
  if (px < x+bl && py > y+h-bl && (px-x-bl)**2+(py-y-h+bl)**2 > bl*bl) return false;
  return true;
}

function drawRoundRect(ctx, x, y, w, h, r) {
  if (w <= 0 || h <= 0) { ctx.beginPath(); return; }
  const [tl, tr, br, bl] = _resolveRadii(r, w, h);
  ctx.beginPath();
  ctx.moveTo(x+tl, y);
  ctx.lineTo(x+w-tr, y);    ctx.arcTo(x+w, y,   x+w, y+tr,   tr);
  ctx.lineTo(x+w, y+h-br);  ctx.arcTo(x+w, y+h, x+w-br, y+h, br);
  ctx.lineTo(x+bl, y+h);    ctx.arcTo(x,   y+h, x,   y+h-bl, bl);
  ctx.lineTo(x, y+tl);      ctx.arcTo(x,   y,   x+tl, y,     tl);
  ctx.closePath();
}

// Extract a single solid {r,g,b,a} color from a theme background token
// (string CSS, {r,g,b} object, or a gradient stop array → middle stop).
function _solid(bg) {
  if (bg == null) return null;
  if (typeof bg === 'string') return bg.startsWith('#') ? hexToColor(bg) : bg;
  if (Array.isArray(bg)) { const m = bg[Math.floor((bg.length-1)/2)] || bg[0]; return m ? _solid(m.color) : null; }
  return bg; // already a color object

function _lum(c) { c=_solid(c); return (0.299*c.r+0.587*c.g+0.114*c.b)/255; }

class Slider extends BaseWidget {
  /*
   * Mode simple:   sl.value / .min / .max / .step

    this._range=false; this._valueLow=20; this._valueHigh=80;

  get max(){ return this._max; } set max(v){ this._max=v; this.markDirty(); }
  get step(){ return this._step; } set step(v){ this._step=v; this.markDirty(); }
  // ── range ──

    const b=this.bounds; const cy=b.y+b.height/2;

    const {t,ts,x:tx,w:tw}=this._tr(); const b=this.bounds;

      }
    }
    ctx.restore();
  }
}

class ListBox extends BaseWidget {
  constructor(items, bounds) {
    super(undefined,bounds); 
    this.items=items||[]; 
    this._selectedIndex=-1; 
    this._hoverIndex=-1; 
    this._scrollY=0; 
    this._focused=false;
    this._scrollbarDragging=false;
    this._scrollbarHovered=false;
    this.background = null;
    
    this.on('focus',()=>{this._focused=true;this.markDirty();});
    this.on('blur',()=>{this._focused=false;this.markDirty();});
    
    this.on('mousemove',e=>{
      const t=getTheme().listBox;
      const itemH=t.itemHeight;
      const totalH=this.items.length*itemH;
      const hasScroll=totalH>this.bounds.height;
      
      if(hasScroll){
        const sb=t.scrollBar||{width:8};
        const sbX=this.bounds.x+this.bounds.width-sb.width;
        const sbY=this.bounds.y;
        const sbH=this.bounds.height;
        const thumbH=Math.max(20,sbH*(this.bounds.height/totalH));
        const thumbY=sbY+(this._scrollY/(totalH-this.bounds.height))*(sbH-thumbH);
        
        const wasHov=this._scrollbarHovered;
        this._scrollbarHovered=(e.x>=sbX&&e.x<sbX+sb.width&&e.y>=sbY&&e.y<sbY+sbH);
        if(wasHov!==this._scrollbarHovered)this.markDirty();
        
        if(this._scrollbarDragging){
          const ratio=(e.y-sbY-thumbH/2)/Math.max(1,sbH-thumbH);
          const ns=Math.max(0,Math.min(totalH-this.bounds.height,ratio*(totalH-this.bounds.height)));
          this._scrollY=ns;
          this.markDirty();
          return;
        }
      }
      
      const idx=this._itemAt(e.y);
      if(idx!==this._hoverIndex){this._hoverIndex=idx;this.markDirty();}
    });
    
    this.on('mouseleave',()=>{this._hoverIndex=-1;this._scrollbarHovered=false;this.markDirty();});
    
    this.on('click',e=>{
      const t=getTheme().listBox;
      const itemH=t.itemHeight;
      const totalH=this.items.length*itemH;
      const hasScroll=totalH>this.bounds.height;
      
      if(hasScroll){
        const sb=t.scrollBar||{width:8};
        const sbX=this.bounds.x+this.bounds.width-sb.width;
        if(e.x>=sbX&&e.x<sbX+sb.width){return;}
      }
      
      const idx=this._itemAt(e.y);
      if(idx>=0&&idx<this.items.length){this._selectedIndex=idx;this._emit();this.markDirty();}
    });
    
    const _doScroll=e=>{
      const t=getTheme().listBox;
      const itemH=t.itemHeight;
      const totalH=this.items.length*itemH;
      const ms=Math.max(0,totalH-this.bounds.height);
      const dir=(e.deltaY??e.delta??0)>0?itemH:-itemH;
      this._scrollY=Math.max(0,Math.min(ms,this._scrollY+dir));
      this.markDirty();
      e.stopPropagation?.();
    };
    this.on('wheel',_doScroll);
    this.on('scroll',_doScroll);
    
    this.on('mousedown',e=>{
      const t=getTheme().listBox;
      const itemH=t.itemHeight;
      const totalH=this.items.length*itemH;
      const hasScroll=totalH>this.bounds.height;
      
      if(hasScroll){
        const sb=t.scrollBar||{width:8};
        const sbX=this.bounds.x+this.bounds.width-sb.width;
        const sbY=this.bounds.y;
        const sbH=this.bounds.height;
        
        if(e.x>=sbX&&e.x<sbX+sb.width&&e.y>=sbY&&e.y<sbY+sbH){
          const thumbH=Math.max(20,sbH*(this.bounds.height/totalH));
          const trackH=sbH-thumbH;
          const thumbY=sbY+(this._scrollY/(totalH-this.bounds.height))*trackH;
          
          if(e.y>=thumbY&&e.y<thumbY+thumbH){
            this._scrollbarDragging=true;
            this.markDirty();
          }else{
            const ratio=(e.y-sbY-thumbH/2)/Math.max(1,trackH);
            const ns=Math.max(0,Math.min(totalH-this.bounds.height,ratio*(totalH-this.bounds.height)));
            this._scrollY=ns;
            this.markDirty();
          }
        }
      }
    });
    
    this.on('mouseup',()=>{
      if(this._scrollbarDragging){this._scrollbarDragging=false;this.markDirty();}
    });
    
    this.on('keydown',e=>{if(e.key==='ArrowUp'&&this._selectedIndex>0){this._selectedIndex--;this._emit();this.markDirty();}else if(e.key==='ArrowDown'&&this._selectedIndex<this.items.length-1){this._selectedIndex++;this._emit();this.markDirty();}});
  }
  
  get selectedIndex(){return this._selectedIndex;} 
  set selectedIndex(v){this._selectedIndex=v;this.markDirty();}
  get selectedValue(){return this.items[this._selectedIndex]??null;}
  
  _itemAt(ry){const t=getTheme().listBox,b=this.bounds;return Math.floor((ry-b.y+this._scrollY)/t.itemHeight);}
  
  _emit(){const ev={type:'change',target:this,x:0,y:0,stopPropagation(){this.stopped=true;},preventDefault(){this.defaultPrevented=true;},stopped:false,defaultPrevented:false};this.emit(ev);}
  
  render(ctx) {
    const t=getTheme().listBox, b=this.bounds, sb=t.scrollBar, r=t.borderRadius, itemH=t.itemHeight;
    const totalH=this.items.length*itemH, hasScroll=totalH>b.height, cw=hasScroll?b.width-sb.width:b.width;
    ctx.save();
    drawGradient(ctx, b.x, b.y, b.width, b.height, this.background ?? t.background);
    drawRoundRect(ctx,b.x,b.y,b.width,b.height,r); ctx.fill();
    ctx.beginPath(); ctx.rect(b.x,b.y,cw,b.height); ctx.clip();
    ctx.font=fontToCSS(t.font);
    const first=Math.floor(this._scrollY/itemH), last=Math.min(this.items.length-1,first+Math.ceil(b.height/itemH)+1);
    for(let i=first;i<=last;i++){
      const iy=b.y+i*itemH-this._scrollY, isSel=i===this._selectedIndex, isHov=i===this._hoverIndex;
      if(isSel){ctx.fillStyle=colorToCSS(t.item.selected);ctx.fillRect(b.x,iy,cw,itemH);}
      else if(isHov){ctx.fillStyle=colorToCSS(t.item.hover);ctx.fillRect(b.x,iy,cw,itemH);}
      ctx.fillStyle=colorToCSS(isSel?t.itemText.selected:t.itemText.normal); ctx.textBaseline='middle';
      ctx.fillText(this.items[i],b.x+8,iy+itemH/2);
    }
    ctx.restore();
    ctx.save();
    ctx.strokeStyle=colorToCSS(t.border.color); ctx.lineWidth=t.border.width;
    drawRoundRect(ctx,b.x+.5,b.y+.5,b.width-1,b.height-1,r); ctx.stroke();
    if(hasScroll){
      const sbX=b.x+b.width-sb.width-1, scrollRatio=b.height/totalH, thumbH=Math.max(20,scrollRatio*b.height), thumbY=b.y+(this._scrollY/(totalH-b.height))*(b.height-thumbH);
      ctx.fillStyle=colorToCSS(sb.track); ctx.fillRect(sbX,b.y+1,sb.width,b.height-2);
      const thumbCol=this._scrollbarDragging?sb.thumbActive:(this._scrollbarHovered?sb.thumbHover:sb.thumb);
      drawGradient(ctx,sbX+2,thumbY+2,sb.width-4,thumbH-4,thumbCol); drawRoundRect(ctx,sbX+2,thumbY+2,sb.width-4,thumbH-4,sb.borderRadius); ctx.fill();
    }
    ctx.restore();
  }
}

const _pad2 = n => String(n).padStart(2,'0');
function _inRect(r, x, y) { return x>=r.x && x<r.x+r.w && y>=r.y && y<r.y+r.h; }
function _rootWM(w) { let r=w; while(r.parent) r=r.parent; return r; }
function _isoWeek(d) {
  const date=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=(date.getUTCDay()+6)%7; date.setUTCDate(date.getUTCDate()-dayNum+3);
  const ft=date.getTime(); date.setUTCMonth(0,1);
  if(date.getUTCDay()!==4) date.setUTCMonth(0,1+((4-date.getUTCDay())+7)%7);
  return 1+Math.round((ft-date.getTime())/(7*_DAY_MS));
}
function _drawStarPath(ctx,cx,cy,rOut) {
  const rIn=rOut*0.42; ctx.beginPath();
  for(let i=0;i<10;i++){ const r=i%2?rIn:rOut; const a=-Math.PI/2+i*Math.PI/5; const px=cx+Math.cos(a)*r, py=cy+Math.sin(a)*r; i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
  ctx.closePath();
}

// ── ContainerWidget : base for widgets that host child widgets ─────────────
// Children live in this.children, positioned in the container's own coordinate
// space (origin = top-left of bounds). render/dispatch translate by bounds so
// nesting works with the framework's hover/focus (_findInWidget) and the
// generalised drag-coord path (WindowManager._widgetParentOrigin).
class ContainerWidget extends BaseWidget {
  _disabledContent() { return false; }
  render(ctx) { this._renderSelf(ctx); this._renderChildren(ctx); }
  _renderSelf(ctx) {}
  _renderChildren(ctx) {
    ctx.save();
    ctx.translate(this.bounds.x, this.bounds.y);
    if (this._disabledContent()) ctx.globalAlpha *= 0.5;
    const sorted=[...this.children].sort((a,b)=>a.zIndex-b.zIndex);
    for (const c of sorted) if (c.visible) this._renderChild(ctx,c);
    // Open DropDown lists are drawn unclipped, ABOVE every sibling (z-order fix,
    // same approach as WindowContent) so a later widget can't paint over them.
    for (const c of sorted) if (c.visible && c instanceof DropDown && c._open) c._renderList(ctx);
    // Un enfant peut lui-même héberger une liste ouverte (PropertyGrid) : elle doit
    // aussi passer au-dessus des frères suivants.
    for (const c of sorted) if (c.visible && typeof c._renderOpenPopups === 'function') c._renderOpenPopups(ctx);
    ctx.restore();
  }
  _renderChild(ctx,c) {
    const eff=(c.opacity??1);
    const needC=eff<0.9999||c.tint!=null||!!c.rotation;
    if (needC) {
      const bw=Math.ceil(c.bounds.width),bh=Math.ceil(c.bounds.height);
      if (bw>0&&bh>0) {
        const off=new OffscreenCanvas(bw,bh); const octx=off.getContext('2d');
        octx.translate(-c.bounds.x,-c.bounds.y); c.render(octx);
        ctx.save(); ctx.globalAlpha*=eff;
        if (c.rotation) { const cx=c.bounds.x+bw/2,cy=c.bounds.y+bh/2; ctx.translate(cx,cy); ctx.rotate(c.rotation); ctx.drawImage(off,-bw/2,-bh/2); }
        else ctx.drawImage(off,c.bounds.x,c.bounds.y);
        ctx.restore();
      }
    } else c.render(ctx);
  }
  dispatchEvent(ev) {
    const lx=ev.x-this.bounds.x, ly=ev.y-this.bounds.y;
    const sorted=[...this.children].sort((a,b)=>b.zIndex-a.zIndex);
    for (const c of sorted) {
      if (c.visible && c.hitTest(lx,ly)) {
        const re={...ev,x:lx,y:ly};
        c.dispatchEvent(re); ev.stopped=re.stopped;
        if (ev.stopped) return true;
      }
    }
    this.emit(ev);
    return !ev.stopped;
  }
}

// ── Panel : simple themed container (used as PageControl page content) ──────

// ── PopupBox : anchored overlay panel hosting arbitrary widgets ────────────
// Same spirit as a context menu but holds a layout of real framework widgets.
class PopupBox extends ContainerWidget {
  constructor(bounds, opts={}) {
    super('popup_'+(++_idCounter), bounds);
    this.zIndex = 9000;
    this.background = opts.background ?? null;
    this._onCloseCb = opts.onClose || null;
    this._backdrop = null; this._closed=false;
    this._openTime = performance.now();
    this.capturesDrag = false;
    this.on('mousedown', e => e.stopPropagation());
  }
  // Size bounds to fit current children (+ uniform padding)
  fit(pad=10) {
    let w=0,h=0; for(const c of this.children){ w=Math.max(w,c.bounds.x+c.bounds.width); h=Math.max(h,c.bounds.y+c.bounds.height); }
    this.bounds.width=w+pad; this.bounds.height=h+pad; return this;
  }
  // Also accept clicks on an open DropDown list that spills past the panel, so it
  // routes to the popup (not the backdrop, which would close it).
  hitTest(x, y) {
    if (!this.visible) return false;
    if (rectContains(this.bounds, x, y)) return true;
    for (const c of this.children) {
      if (c instanceof DropDown && c._open) {
        const lr = c._listRect();
        if (rectContains({ x:this.bounds.x+lr.x, y:this.bounds.y+lr.y, width:lr.width, height:lr.height }, x, y)) return true;
      }
    }
    return false;
  }
  attachAnchored(wm, anchor, opts={}) {
    const o=wm._widgetParentOrigin(anchor);
    const ar={x:o.x+anchor.bounds.x, y:o.y+anchor.bounds.y, w:anchor.bounds.width, h:anchor.bounds.height};
    const cw=wm.bounds.width, ch=wm.bounds.height;
    let px=opts.align==='right' ? ar.x+ar.w-this.bounds.width : ar.x;
    let py=ar.y+ar.h+2;
    if (px+this.bounds.width>cw-4) px=Math.max(4, cw-this.bounds.width-4);
    if (py+this.bounds.height>ch-4) { const above=ar.y-this.bounds.height-2; py = above>=4 ? above : Math.max(4, ch-this.bounds.height-4); }
    this._attach(wm, Math.max(4,px), Math.max(4,py));
    return this;
  }
  attachAt(wm, x, y) { this._attach(wm, x, y); return this; }
  _attach(wm, x, y) {
    this.bounds.x=x; this.bounds.y=y;
    const bd=new BaseWidget('popup_bd',{x:0,y:0,width:wm.bounds.width,height:wm.bounds.height});
    bd.zIndex=this.zIndex-1; bd.render=()=>{};
    bd.on('mousedown', e=>e.stopPropagation());
    bd.on('click', e=>{ e.stopPropagation(); if(performance.now()-this._openTime<250) return; this.close(); });
    this._backdrop=bd;
    wm.addChild(bd); wm.addChild(this);
    this.markDirty();
  }
  close() {
    if (this._closed) return; this._closed=true;
    const wm=this.parent;
    if (wm) { wm.removeChild(this); if(this._backdrop) wm.removeChild(this._backdrop); }
    if (this._onCloseCb) this._onCloseCb();
    if (wm) wm.markDirty();
  }
  _renderSelf(ctx) {
    const t=getTheme().popup, b=this.bounds;
    ctx.save();
    if (t.shadow) applyShadow(ctx, t.shadow);
    drawGradient(ctx,b.x,b.y,b.width,b.height,this.background ?? t.background);
    drawRoundRect(ctx,b.x,b.y,b.width,b.height,t.radius); ctx.fill();
    clearShadow(ctx);
    ctx.strokeStyle=colorToCSS(t.border.color); ctx.lineWidth=t.border.width;
    drawRoundRect(ctx,b.x+.5,b.y+.5,b.width-1,b.height-1,t.radius); ctx.stroke();
    ctx.restore();
  }
}

    const sel=this.selectedItems; this._items.sort((a,b)=>{ let va=this._cellVal(a,k), vb=this._cellVal(b,k); const na=parseFloat(va), nb=parseFloat(vb); if(!isNaN(na)&&!isNaN(nb)){va=na;vb=nb;} return (va<vb?-1:va>vb?1:0)*dir; });
    this._sel=new Set(sel.map(it=>this._items.indexOf(it)).filter(i=>i>=0));
  }
  // ── rendering ──
  render(ctx){
    const b=this.bounds, L=this._layout(), lb=getTheme().listBox, accent=_solid(getTheme().slider.fill.background), txt=_solid(lb.itemText.normal);
    this._clampScroll(L);
    ctx.save();

    drawGradient(ctx,b.x,b.y,b.width,b.height,this.background??lb.background); ctx.fillRect(b.x,b.y,b.width,b.height);
    ctx.strokeStyle=colorToCSS(lb.border.color); ctx.lineWidth=lb.border.width; ctx.strokeRect(b.x+.5,b.y+.5,b.width-1,b.height-1);
    // body clip
    ctx.save(); ctx.beginPath(); ctx.rect(b.x+1,b.y+1+L.headerH,L.viewW-2,L.viewH-1); ctx.clip();
    ctx.font=fontToCSS(lb.font); ctx.textBaseline='middle';
    const ox=b.x-this._scrollX, oy=b.y+L.headerH-this._scrollY;
    for (let i=0;i<L.n;i++){ const r=this._cellRect(i,L); const rx=ox+r.x, ry=oy+r.y;
      if (rx+r.w<b.x||rx>b.x+L.viewW||ry+r.h<b.y+L.headerH||ry>b.y+L.headerH+L.viewH) continue;
      const seld=this._sel.has(i), hov=this._hover===i;
      this._drawCell(ctx, L.m, this._items[i], rx, ry, r.w, r.h, seld, hov, accent, txt, lb, i);
      if (this._focus===i){ ctx.save(); ctx.strokeStyle=colorToCSS(_rgba(accent,0.9)); ctx.setLineDash([1,1]); ctx.lineWidth=1; ctx.strokeRect(rx+1.5,ry+1.5,r.w-3,r.h-3); ctx.setLineDash([]); ctx.restore(); }
    }
    // rubber-band (lasso) selection rectangle
    if (this._marquee){ const r=this._marqueeRect(), mx=ox+r.x, my=oy+r.y;
      ctx.fillStyle=colorToCSS(_rgba(accent,0.15)); ctx.fillRect(mx,my,r.w,r.h);

    ctx.restore();
    // details header (drawn after body so it overlays the top)
    if (L.m.mode==='rows') this._drawHeader(ctx, L, accent, txt, lb);
    // scrollbars
    if (L.needV) _paintScroll(ctx, b.x+L.viewW, b.y+L.headerH, L.viewH, L.SB, true,  L.contentH, this._scrollY, this._sbDrag?.dir==='v'?'active':(this._sbHover==='v'?'hover':'normal'));
    if (L.needH) _paintScroll(ctx, b.x, b.y+L.headerH+L.viewH, L.viewW, L.SB, false, L.contentW, this._scrollX, this._sbDrag?.dir==='h'?'active':(this._sbHover==='h'?'hover':'normal'));
    if (L.needV && L.needH){ ctx.fillStyle=colorToCSS(lb.scrollBar.track); ctx.fillRect(b.x+L.viewW,b.y+L.headerH+L.viewH,L.SB,L.SB); }
    ctx.restore();
  }
  _selBg(ctx,x,y,w,h,sel,hov,accent){ if(!sel&&!hov)return; ctx.fillStyle=colorToCSS(_rgba(accent, sel?0.26:0.12)); drawRoundRect(ctx,x+1,y+1,w-2,h-2,3); ctx.fill(); if(sel){ ctx.strokeStyle=colorToCSS(_rgba(accent,0.7)); ctx.lineWidth=1; drawRoundRect(ctx,x+1.5,y+1.5,w-3,h-3,3); ctx.stroke(); } }
  _drawCell(ctx,m,it,x,y,w,h,sel,hov,accent,txt,lb,i){
    ctx.save(); ctx.fillStyle=colorToCSS(txt);
    if (m.mode==='grid'){ this._selBg(ctx,x,y,w,h,sel,hov,accent);
      ctx.font=`${m.icon}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText(it.icon, x+w/2, y+8+m.icon*0.85);
      ctx.font=fontToCSS(lb.font); ctx.fillStyle=colorToCSS(txt); ctx.textBaseline='middle';
      const lines=_wrap2(ctx, it.text, w-10), ly=y+16+m.icon;

    } else if (m.mode==='tiles'){ this._selBg(ctx,x,y,w,h,sel,hov,accent);
      ctx.font=`${m.icon}px sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(it.icon, x+8, y+h/2);
      const tx=x+8+m.icon+8;
      ctx.font=fontToCSS({...lb.font,weight:'bold'}); ctx.fillStyle=colorToCSS(txt); ctx.fillText(_ellip(ctx,it.text,w-(tx-x)-8), tx, y+h/2-8);
      ctx.font=fontToCSS(lb.font); ctx.fillStyle=colorToCSS(_rgba(txt,0.7)); ctx.fillText(_ellip(ctx,it.subtitle||this._cellVal(it,'type'),w-(tx-x)-8), tx, y+h/2+9);
    } else if (m.mode==='hflow'||m.mode==='vflow'){ this._selBg(ctx,x,y,w,h,sel,hov,accent);
      ctx.font=`${m.icon}px sans-serif`; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(it.icon, x+4, y+h/2);
      ctx.font=fontToCSS(lb.font); ctx.fillStyle=colorToCSS(txt); ctx.fillText(_ellip(ctx,it.text,w-m.icon-12), x+m.icon+8, y+h/2);
    } else if (m.mode==='rows'){
      if(sel||hov){ ctx.fillStyle=colorToCSS(_rgba(accent, sel?0.24:0.10)); ctx.fillRect(x,y,w,h); if(sel){ctx.fillStyle=colorToCSS(_rgba(accent,0.7));ctx.fillRect(x,y,2,h);} }
      ctx.textBaseline='middle'; let cx=x;
      for(const col of this._cols){ ctx.save(); ctx.beginPath(); ctx.rect(cx+4,y,col.width-8,h); ctx.clip();
        ctx.fillStyle=colorToCSS(txt); ctx.font=fontToCSS(lb.font);
        if(col.key==='__name'){ ctx.font=`${m.icon}px sans-serif`; ctx.textAlign='left'; ctx.fillText(it.icon, cx+5, y+h/2); ctx.font=fontToCSS(lb.font); ctx.fillStyle=colorToCSS(txt); ctx.fillText(_ellip(ctx,it.text,col.width-m.icon-14), cx+m.icon+10, y+h/2); }
        else { ctx.textAlign=col.align==='right'?'right':'left'; const v=String(this._cellVal(it,col.key)); ctx.fillText(_ellip(ctx,v,col.width-10), col.align==='right'?cx+col.width-6:cx+6, y+h/2); }
        ctx.restore(); cx+=col.width;
      }
    }
    ctx.restore();
  }
  _drawHeader(ctx,L,accent,txt,lb){ const b=this.bounds, hh=L.headerH, base=_solid(getTheme().window.body.background);
    ctx.save(); ctx.beginPath(); ctx.rect(b.x+1,b.y+1,L.viewW-2,hh); ctx.clip();
    const g=ctx.createLinearGradient(0,b.y,0,b.y+hh); g.addColorStop(0,colorToCSS(_mix(base,{r:255,g:255,b:255},0.5))); g.addColorStop(1,colorToCSS(_mix(base,{r:0,g:0,b:0},0.05)));
    ctx.fillStyle=g; ctx.fillRect(b.x+1,b.y+1,L.viewW-2,hh);
    ctx.font=fontToCSS({...lb.font,weight:'bold'}); ctx.textBaseline='middle'; let cx=b.x-this._scrollX;
    for(const c of this._cols){
      if(this._hdrHover===c.key){ ctx.fillStyle=colorToCSS(_rgba(accent,0.12)); ctx.fillRect(cx,b.y+1,c.width,hh-1); }
      ctx.fillStyle=colorToCSS(_rgba(_solid(getTheme().window.border.color),0.5)); ctx.fillRect(cx+c.width-0.5,b.y+3,1,hh-6);
      ctx.fillStyle=colorToCSS(txt); ctx.textAlign='left';
      ctx.save(); ctx.beginPath(); ctx.rect(cx+5,b.y,c.width-22,hh); ctx.clip(); ctx.fillText(c.title, cx+6, b.y+hh/2); ctx.restore();
      if(this._sortKey===c.key){ const ax=cx+c.width-12, ay=b.y+hh/2; ctx.fillStyle=colorToCSS(accent); ctx.beginPath(); if(this._sortDir>0){ctx.moveTo(ax-4,ay+2);ctx.lineTo(ax+4,ay+2);ctx.lineTo(ax,ay-3);}else{ctx.moveTo(ax-4,ay-2);ctx.lineTo(ax+4,ay-2);ctx.lineTo(ax,ay+3);} ctx.closePath(); ctx.fill(); }
      cx+=c.width;
    }
    ctx.fillStyle=colorToCSS(_rgba(_solid(getTheme().window.border.color),0.6)); ctx.fillRect(b.x+1,b.y+hh-0.5,L.viewW-2,1);
    ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════════════
// WindowContent — scrollbars H+V, show on hover
// ════════════════════════════════════════════════════════════════════
class WindowContent extends BaseWidget {
  constructor(bounds) {
    super(undefined, bounds);
    this._scrollX = 0; this._scrollY = 0;
    this._SB = 12; this._hovered = false; this._sbDrag = null;
  }

  hitTest(x, y) {
    if (!this.visible) return false;
    if (this._anim && (this._anim.type==='close'||this._anim.type==='minimize')) return false;
    return rectContains(this.getAbsoluteBounds(), x, y);
  }

  _contentSize() {
    let maxX=0, maxY=0;
    for (const c of this.children) {
      if (!c.visible) continue;
      maxX = Math.max(maxX, c.bounds.x+c.bounds.width);
      maxY = Math.max(maxY, c.bounds.y+c.bounds.height);
    }
    return { w:maxX+10, h:maxY+10 };
  }

  _bars(b) {
    const cs=this._contentSize(), SB=this._SB;
    const needV=cs.h>b.height;
    const needH=cs.w>b.width-(needV?SB:0);
    return { needH, needV, SB,
      viewW:b.width-(needV?SB:0), viewH:b.height-(needH?SB:0), cw:cs.w, ch:cs.h };
  }

  _clamp(b) {
    const{viewW,viewH,cw,ch}=this._bars(b);
    this._scrollX=Math.max(0,Math.min(Math.max(0,cw-viewW),this._scrollX));
    this._scrollY=Math.max(0,Math.min(Math.max(0,ch-viewH),this._scrollY));
  }

  _thumbInfo(dir,viewSz,contentSz,scroll) {
    const len=Math.max(24,viewSz*Math.min(1,viewSz/contentSz));
    const maxScroll=Math.max(1,contentSz-viewSz);
    return { off:(scroll/maxScroll)*(viewSz-len), len, maxScroll };
  }

  _onScroll(ev) {
    const b=this.bounds; this._clamp(b);
    const{needH,needV,viewW,viewH,cw,ch}=this._bars(b);
    const dy=ev.deltaY||0, dx=ev.deltaX||0;
    if (dx!==0) {
      if (needH) this._scrollX=Math.max(0,Math.min(Math.max(0,cw-viewW),this._scrollX+dx));
    } else if (ev.shiftKey||(!needV&&needH)) {
      if (needH) this._scrollX=Math.max(0,Math.min(Math.max(0,cw-viewW),this._scrollX+dy));
    } else {
      if (needV)      this._scrollY=Math.max(0,Math.min(Math.max(0,ch-viewH),this._scrollY+dy));
      else if (needH) this._scrollX=Math.max(0,Math.min(Math.max(0,cw-viewW),this._scrollX+dy));
    }
    this.markDirty();
  }

  _hitSB(ax,ay) {
    const b=this.bounds, ab=this.getAbsoluteBounds();
    const{needH,needV,SB,viewW,viewH,cw,ch}=this._bars(b);
    if (needV) {
      const tx=ab.x+viewW, ty=ab.y;
      if (ax>=tx&&ax<=tx+SB&&ay>=ty&&ay<=ty+viewH) {
        const ti=this._thumbInfo('v',viewH,ch,this._scrollY);
        return{dir:'v',trackStart:ty,trackLen:viewH,thumbOff:ti.off,thumbLen:ti.len,maxScroll:ti.maxScroll};
      }
    }
    if (needH) {
      const tx=ab.x, ty=ab.y+viewH;
      if (ax>=tx&&ax<=tx+viewW&&ay>=ty&&ay<=ty+SB) {
        const ti=this._thumbInfo('h',viewW,cw,this._scrollX);
        return{dir:'h',trackStart:tx,trackLen:viewW,thumbOff:ti.off,thumbLen:ti.len,maxScroll:ti.maxScroll};
      }
    }
    return null;
  }

  setHovered(v)        { if (this._hovered!==v){this._hovered=v;this.markDirty();} }
  isOverScrollbar(ax,ay){ return !!this._hitSB(ax,ay); }

  onMouseDownAbs(ax,ay) {
    const sb=this._hitSB(ax,ay); if (!sb) return false;
    this._clamp(this.bounds);
    const mousePos=sb.dir==='v'?ay:ax, curScroll=sb.dir==='v'?this._scrollY:this._scrollX;
    const inThumb=mousePos>=sb.trackStart+sb.thumbOff&&mousePos<=sb.trackStart+sb.thumbOff+sb.thumbLen;
    if (inThumb) {
      this._sbDrag={dir:sb.dir,startScroll:curScroll,startMouse:mousePos,
        trackLen:sb.trackLen,thumbLen:sb.thumbLen,maxScroll:sb.maxScroll};
    } else {
      const ratio=(mousePos-sb.trackStart-sb.thumbLen/2)/Math.max(1,sb.trackLen-sb.thumbLen);
      const ns=Math.max(0,Math.min(sb.maxScroll,ratio*sb.maxScroll));
      if (sb.dir==='v') this._scrollY=ns; else this._scrollX=ns;
      this.markDirty();
    }
    return true;
  }

  onMouseMoveAbs(ax,ay) {
    if (!this._sbDrag) return false;
    const d=this._sbDrag, pos=d.dir==='v'?ay:ax;
    const range=d.trackLen-d.thumbLen;
    const ns=d.startScroll+(range>0?(pos-d.startMouse)*d.maxScroll/range:0);
    if (d.dir==='v') this._scrollY=Math.max(0,Math.min(d.maxScroll,ns));
    else             this._scrollX=Math.max(0,Math.min(d.maxScroll,ns));
    this.markDirty(); return true;
  }

  onMouseUpAbs() { const had=!!this._sbDrag; this._sbDrag=null; return had; }

  dispatchEvent(ev) {
    // Handle scroll/wheel events specially - don't depend on hitTest
    if (ev.type === 'scroll' || ev.type === 'wheel') {
      // For scroll/wheel, distribute to all visible children at the event position
      const b = this.bounds;
      const lx = ev.x - b.x, ly = ev.y - b.y;
      const sorted = [...this.children].sort((a, b2) => b2.zIndex - a.zIndex);
      
      for (const c of sorted) {
        if (!c.visible) continue;
        // Check if point is in child bounds
        const cb = c.bounds;
        if (lx >= cb.x && lx <= cb.x + cb.width && ly >= cb.y && ly <= cb.y + cb.height) {
          const re = { ...ev, x: lx, y: ly };
          c.dispatchEvent(re);
          // Don't break for scroll events - let them propagate
        }
      }
      // Also handle scroll at WindowContent level (e.g. for window scrollbars)
      this._onScroll(ev);
      return true;
    }
    
    // Default behavior for other events
    const sorted = [...this.children].sort((a, b2) => b2.zIndex - a.zIndex);
    for (const c of sorted) {
      if (c.visible && c.hitTest(ev.x, ev.y)) {
        const re = { ...ev, x: ev.x - this.bounds.x, y: ev.y - this.bounds.y };
        c.dispatchEvent(re);
        if (ev.stopped) return true;
      }
    }
    this.emit(ev);
    return !ev.stopped;
  }

  render(ctx) {
    const b=this.bounds; this._clamp(b);
    const{needH,needV,SB,viewW,viewH,cw,ch}=this._bars(b);
    const sx=this._scrollX, sy=this._scrollY;
    const showSB=this._hovered||!!this._sbDrag;
    const sorted=[...this.children].sort((a,b2)=>a.zIndex-b2.zIndex);

    // Children rendered in scrolled content space
    // ctx is in WINDOW space (absolute). Children bounds are in CONTENT space (0-based).
    // WindowContent.render is called with ctx translated to window origin (by GUIWindow.render).
    // So we need to position children at (b.x - sx + child.bounds.x, b.y - sy + child.bounds.y).
    ctx.save();
    ctx.beginPath(); ctx.rect(b.x,b.y,viewW,viewH); ctx.clip();
    ctx.translate(b.x-sx, b.y-sy);

    for (const child of sorted) {
      if (!child.visible) continue;
      const _noDS=child instanceof RadioButton||child instanceof Slider||child instanceof ListBox||child instanceof ProgressBar;
      const effOp=(!child.enabled&&_noDS?0.38:1)*(child.opacity??1);
      const needC=effOp<0.9999||child.tint!=null||!!child.rotation;
      if (needC) {
        const bw=Math.ceil(child.bounds.width),bh=Math.ceil(child.bounds.height);
        if (bw>0&&bh>0) {
          const off=new OffscreenCanvas(bw,bh); const octx=off.getContext('2d');
          octx.translate(-child.bounds.x,-child.bounds.y); child.render(octx);
          if (child.tint) {
            octx.setTransform(1,0,0,1,0,0); octx.globalCompositeOperation='source-atop';
            octx.fillStyle=`rgba(${child.tint.r},${child.tint.g},${child.tint.b},${child.tint.a??0.3})`;
            octx.fillRect(0,0,bw,bh);
          }
          ctx.save(); ctx.globalAlpha*=effOp;
          if (child.rotation) {
            const cx=child.bounds.x+bw/2,cy=child.bounds.y+bh/2;
            ctx.translate(cx,cy); ctx.rotate(child.rotation); ctx.drawImage(off,-bw/2,-bh/2);
          } else ctx.drawImage(off,child.bounds.x,child.bounds.y);
          ctx.restore();
        }
      } else child.render(ctx);
    }
    ctx.restore();

    if (showSB) {
      if (needV) this._drawBar(ctx,b,'v',viewW,viewH,sy,ch,SB);
      if (needH) this._drawBar(ctx,b,'h',viewW,viewH,sx,cw,SB);
      //if (needV&&needH){ctx.fillStyle='rgba(200,200,200,0.5)';ctx.fillRect(b.x+viewW,b.y+viewH,SB,SB);}
    }

    // Unclipped dropdowns
    for (const child of sorted) {
      if (!child.visible||!(child instanceof DropDown)||!child._open) continue;
      ctx.save(); ctx.translate(b.x-sx,b.y-sy); child._renderList(ctx); ctx.restore();
    }
    // …y compris celles hébergées par un enfant (PropertyGrid et consorts)
    for (const child of sorted) {
      if (!child.visible||typeof child._renderOpenPopups!=='function') continue;
      ctx.save(); ctx.translate(b.x-sx,b.y-sy); child._renderOpenPopups(ctx); ctx.restore();
    }


    if (_debugHitTest) {
      ctx.save(); ctx.translate(b.x-sx,b.y-sy);
      for (const child of sorted) {
        if (!child.visible) continue;
        if (child.rotation) {
          const bx=child.bounds.x,by2=child.bounds.y,bw2=child.bounds.width,bh2=child.bounds.height;
          const cx2=bx+bw2/2,cy2=by2+bh2/2,cos=Math.cos(child.rotation),sin=Math.sin(child.rotation);
          const corners=[{x:bx,y:by2},{x:bx+bw2,y:by2},{x:bx+bw2,y:by2+bh2},{x:bx,y:by2+bh2}]
            .map(p=>({x:cx2+(p.x-cx2)*cos-(p.y-cy2)*sin,y:cy2+(p.x-cx2)*sin+(p.y-cy2)*cos}));
          ctx.beginPath();ctx.moveTo(corners[0].x,corners[0].y);
          for(let i=1;i<corners.length;i++)ctx.lineTo(corners[i].x,corners[i].y);
          ctx.closePath();ctx.strokeStyle='rgba(0,255,0,0.9)';ctx.lineWidth=1.5;ctx.setLineDash([4,2]);ctx.stroke();ctx.setLineDash([]);
        } else {
          const{x:bx,y:by2,width:bw2,height:bh2}=child.bounds;
          ctx.strokeStyle='rgba(0,180,255,0.8)';ctx.lineWidth=1;ctx.setLineDash([3,2]);
          ctx.strokeRect(bx+0.5,by2+0.5,bw2-1,bh2-1);ctx.setLineDash([]);
        }
      }
      ctx.restore();
    }
  }

  _drawBar(ctx,b,dir,viewW,viewH,scroll,contentSz,SB) {
    const t=getTheme().window.scrollBar;
    const isV=dir==='v';
    const trackX=isV?b.x+viewW:b.x, trackY=isV?b.y:b.y+viewH;
    const trackW=isV?SB:viewW, trackH=isV?viewH:SB;
    const viewSz=isV?viewH:viewW;
    const{off,len}=this._thumbInfo(dir,viewSz,contentSz,scroll);
    const isDrag=this._sbDrag?.dir===dir;
    ctx.fillStyle='rgba(220,220,220,0.6)'; ctx.fillRect(trackX,trackY,trackW,trackH);
    ctx.fillStyle=isDrag?'rgba(70,70,70,0.7)':'rgba(100,100,100,0.45)';
    const tr=SB/2-1; ctx.beginPath();
        const thumbColor = isDrag ? t.thumbActive : (this._hoveredBar===dir ? t.thumbHover : t.thumb);

    if (isV) {
      drawGradient(ctx, trackX+2, trackY+off, SB-4, len, thumbColor, true);
      ctx.roundRect(trackX+2,trackY+off,SB-4,len,tr);
    }
    else {
      drawGradient(ctx, trackX+off, trackY+2, len, SB-4, thumbColor, false);
      ctx.roundRect(trackX+off,trackY+2,len,SB-4,tr);
    }
    ctx.fill();
  }
}

class GUIWindow extends BaseWidget {
  constructor(title, bounds) {
    super(undefined, bounds);
    this.title = title;
    this.resizable = true; this.closable = true;
    this.minimizable = true; this.maximizable = true; this.modal = false;
    this._active = false; this._state = 'normal';
    this._prevBounds = null;
    // Animation
    this._anim = null;
    this._animScale = 1;
    this._animOpacity = 1;
    this._dragging = false; this._dragOffset = { x:0, y:0 };
    this._resizing = false; this._resizeEdge = ''; this._resizeStart = null;
    this._titleBarHover = '';
    // Docked chrome (rendered between the title bar and the content, never scrolled
    // by the content scrollbars). See setMenuBar() / setToolbar() / setStatusBar().
    // Order top→down : title bar · menu bar · toolbar · content · status bar.
    this._dockMenu = null; this._dockMenuH = 0;
    this._dockTop = null; this._dockTopH = 0;
    this._dockTop2 = null; this._dockTop2H = 0;   // 2e barre (contextuelle : objet sélectionné)
    this._dockBottom = null; this._dockBottomH = 0;

    const t = getTheme().window;
    const th = t.titleBar.height;
    const btnStyle = t.buttonStyle;
    const btnSize = btnStyle === 'circle' ? 14 : 16;
    const btnY = (th - btnSize) / 2;

    // Content area: position relative to window origin
    this._contentArea = new WindowContent({
      x: t.border.width, y: th,
      width:  bounds.width  - t.border.width * 2,
      height: bounds.height - th - t.border.width
    });
    this._contentArea.parent = this;

    // Title-bar buttons (coords relative to window origin)
    if (btnStyle === 'circle') {
      this._closeBtn = new WinButton('close',    { x:10,    y:btnY, width:btnSize, height:btnSize });
      this._minBtn   = new WinButton('minimize', { x:28,    y:btnY, width:btnSize, height:btnSize });
      this._maxBtn   = new WinButton('maximize', { x:46,    y:btnY, width:btnSize, height:btnSize });
    } else {
      const bx = bounds.width - 3*(btnSize+2) - 4;
      this._closeBtn = new WinButton('close',    { x:bx + 2*(btnSize+2), y:btnY, width:btnSize, height:btnSize });
      this._minBtn   = new WinButton('minimize', { x:bx,                 y:btnY, width:btnSize, height:btnSize });
      this._maxBtn   = new WinButton('maximize', { x:bx + btnSize+2,     y:btnY, width:btnSize, height:btnSize });
    }
    this._closeBtn.parent = this._minBtn.parent = this._maxBtn.parent = this;

    this._closeBtn.on('click', () => this._onClose());
    this._minBtn.on('click',   () => this._onMin());
    this._maxBtn.on('click',   () => this._onMax());

    this.on('dblclick', e => {
      const ab = this.getAbsoluteBounds();
      if (e.y >= ab.y && e.y < ab.y + getTheme().window.titleBar.height && this.maximizable)
        this._onMax();
    });
  }

  get active()  { return this._active; }
  set active(v) { this._active = v; this.markDirty(); }
  get state()       { return this._state; }
  get contentArea() { return this._contentArea; }

  // Dock a widget (typically a Toolbar / StatusBar) as window chrome above or
  // below the scrollable content area. The content area shrinks to fit; the dock
  // is rendered in window-relative coords and is NOT affected by content scroll.
  setMenuBar(widget, height)   { this._dockMenu=widget; this._dockMenuH=height ?? widget.bounds.height; widget.parent=this; this._updateLayout(); this.markDirty(); return widget; }
  setToolbar(widget, height)   { this._dockTop=widget; this._dockTopH=height ?? widget.bounds.height; widget.parent=this; this._updateLayout(); this.markDirty(); return widget; }
  // 2e barre, sous la première : masquée quand widget.visible===false (hauteur 0)
  setToolbar2(widget, height)  { this._dockTop2=widget; this._dockTop2H=height ?? widget.bounds.height; widget.parent=this; this._updateLayout(); this.markDirty(); return widget; }
  setStatusBar(widget, height) { this._dockBottom=widget; this._dockBottomH=height ?? widget.bounds.height; widget.parent=this; this._updateLayout(); this.markDirty(); return widget; }

  // Returns true if absolute point (ax,ay) is inside the content area
  _caHitAbs(ax, ay) {
    const ab = this.getAbsoluteBounds(), ca = this._contentArea.bounds;
    return rectContains({ x: ab.x + ca.x, y: ab.y + ca.y, width: ca.width, height: ca.height }, ax, ay);
  }

  // Returns true if absolute point (ax,ay) hits a title-bar button
  _hitBtn(btn, ax, ay) {
    const ab = this.getAbsoluteBounds();
    return rectContains({
      x: ab.x + btn.bounds.x, y: ab.y + btn.bounds.y,
      width: btn.bounds.width, height: btn.bounds.height
    }, ax, ay);
  }

  // Returns resize edge string ('n','s','e','w','ne'…) or '' if not on an edge
  _getEdge(ax, ay) {
    if (!this.resizable || this._state !== 'normal') return '';
    const t = getTheme().window, rh = t.resizeHandle;
    const ab = this.getAbsoluteBounds(), { x, y, width:w, height:h } = ab;
    let edge = '';
    if      (ay < y + rh)     edge += 'n';
    else if (ay > y + h - rh) edge += 's';
    if      (ax < x + rh)     edge += 'w';
    else if (ax > x + w - rh) edge += 'e';
    const onEdge = ax < x+rh || ax > x+w-rh || ay < y+rh || ay > y+h-rh;
    return onEdge ? edge : '';
  }

  // Called by WindowManager directly (not via dispatchEvent) to start drag/resize
  startDrag(ax, ay, button) {
    if (button !== 0) return;
    const t = getTheme().window, th = t.titleBar.height;
    const ab = this.getAbsoluteBounds();

    // Edge resize FIRST: the top resize strip is inside the title bar band, so
    // testing the title bar first made the window move instead of resizing
    // (the cursor already showed the resize arrow — getCursorAt tests the edge first).
    const edge = this._getEdge(ax, ay);
    if (edge) {
      this._resizing = true;
      this._resizeEdge = edge;
      this._resizeStart = { mouse: { x:ax, y:ay }, bounds: { ...this.bounds } };
      return;
    }
    // Title bar drag
    if (ay >= ab.y && ay < ab.y + th && this._state !== 'maximized') {
      this._dragging = true;
      this._dragOffset = { x: ax - this.bounds.x, y: ay - this.bounds.y };
    }
  }

  // Called by WindowManager on every mousemove (even outside window)
  continueDrag(ax, ay) {
    if (this._dragging) {
      const nx = ax - this._dragOffset.x;
      const ny = Math.max(0, ay - this._dragOffset.y);
      this.bounds.x = nx; this.bounds.y = ny;
      this._contentArea.markDirty();
      return;
    }
    if (this._resizing && this._resizeStart) {
      const dx = ax - this._resizeStart.mouse.x;
      const dy = ay - this._resizeStart.mouse.y;
      const orig = this._resizeStart.bounds;
      const minW = 180, minH = 80;
      let nx = orig.x, ny = orig.y, nw = orig.width, nh = orig.height;
      if (this._resizeEdge.includes('e')) nw = Math.max(minW, orig.width  + dx);
      if (this._resizeEdge.includes('s')) nh = Math.max(minH, orig.height + dy);
      if (this._resizeEdge.includes('w')) { nw = Math.max(minW, orig.width  - dx); nx = orig.x + orig.width  - nw; }
      if (this._resizeEdge.includes('n')) { nh = Math.max(minH, orig.height - dy); ny = orig.y + orig.height - nh; }
      this.bounds.x = nx; this.bounds.y = ny;
      this.bounds.width = nw; this.bounds.height = nh;
      this._updateLayout();
    }
  }

  // Called by WindowManager on mouseup
  endDrag() {
    this._dragging = false;
    this._resizing = false;
    this._resizeStart = null;
  }

  get isDragging() { return this._dragging || this._resizing; }

  // Returns the CSS cursor to show for this absolute position
  getCursorAt(ax, ay) {
    if (this._dragging) return 'grabbing';
    if (this._resizing) {
      const m = { n:'n-resize', s:'s-resize', e:'e-resize', w:'w-resize',
                  ne:'ne-resize', nw:'nw-resize', se:'se-resize', sw:'sw-resize' };
      return m[this._resizeEdge] || 'default';
    }
    const edge = this._getEdge(ax, ay);
    if (edge) {
      const m = { n:'n-resize', s:'s-resize', e:'e-resize', w:'w-resize',
                  ne:'ne-resize', nw:'nw-resize', se:'se-resize', sw:'sw-resize' };
      return m[edge] || 'default';
    }
    return 'default';
  }

  update(dt) {
    super.update(dt);
    this._contentArea.update(dt);
    if (!this._anim) return;
    const a = this._anim;
    a.t = Math.min(1, a.t + dt / a.duration);
    // Choose easing per style
    let p;
    if (a.style === 'genie')     p = _easeInOut(a.t);
    else if (a.style === 'zoom') p = _easeSpring(a.t);
    else                         p = _easeOutCubic(a.t);
    a.p = p; // store for render
    if (a.type === 'maximize' || a.type === 'unmaximize') {
      const lerp = (f,t2) => f+(t2-f)*p;
      this.setBounds({ x:lerp(a.from.x,a.to.x), y:lerp(a.from.y,a.to.y),
        width:lerp(a.from.width,a.to.width), height:lerp(a.from.height,a.to.height) });
      this._updateLayout();
    } else {
      // Zoom/fade: scale/opacity driven by render
      this._animScale   = a.from.scale   + (a.to.scale   - a.from.scale)   * p;
      this._animOpacity = a.from.opacity + (a.to.opacity - a.from.opacity) * p;
    }
    this.markDirty();
    if (a.t >= 1) {
      const type = a.type;
      this._anim = null; this._animScale = 1; this._animOpacity = 1;
      if (type === 'close') {
        // Mark the entire window area as dirty before hiding
        this.markDirty(this.getAbsoluteBounds());
        this.visible = false;
        // Remove from window manager
        if (this.parent && this.parent instanceof WindowManager) {
          this.parent.removeWindow(this);
        }
      }
    }
  }
  _onClose() {
    this._anim = { style:'fade', type:'close', t:0, duration:160,
      from:{scale:1,opacity:1}, to:{scale:0.92,opacity:0} };
    this._animScale = 1; this._animOpacity = 1;
    this.markDirty();
  }
  _onMin() {
    if (this._state === 'minimized') {
      this._state = 'normal';
      if (this._prevBounds) this.setBounds(this._prevBounds);
      this._animScale = 0.7; this._animOpacity = 0;
      this._anim = { style:'zoom', type:'unminimize', t:0, duration:200,
        from:{scale:0.7,opacity:0}, to:{scale:1,opacity:1} };
    } else {
      this._prevBounds = { ...this.bounds };
      this._state = 'minimized';
      this._anim = { style:'zoom', type:'minimize', t:0, duration:180,
        from:{scale:0.9,opacity:1}, to:{scale:0.1,opacity:0} };
    }
    this._updateLayout();
    this.markDirty();
  }
  _onMax() {
    if (this._state === 'maximized') {
      const fromB = { ...this.bounds };
      const toB   = { ...this._prevBounds };
      this._state = 'normal';
      this.setBounds(toB); this._updateLayout();
      this._anim = { style:'fade', type:'unmaximize', t:0, duration:200, from:fromB, to:toB };
    } else {
      this._prevBounds = { ...this.bounds };
      const fromB = { ...this.bounds };
      // WM bounds set in WindowManager.update; snapshot current as from, WM target as to
      const wmB = this.parent ? this.parent.bounds : this.bounds;
      const toB = { x:0, y:0, width:wmB.width, height:wmB.height };
      this._state = 'maximized';
      this.setBounds(fromB); this._updateLayout();
      this._anim = { style:'fade', type:'maximize', t:0, duration:200, from:fromB, to:toB };
    }
    this._updateLayout();
    this.markDirty();
  }

  _updateLayout() {
    const t = getTheme().window, th = t.titleBar.height, bw = t.border.width;
    const menuH = this._dockMenu ? this._dockMenuH : 0;
    const topH = this._dockTop ? this._dockTopH : 0, botH = this._dockBottom ? this._dockBottomH : 0;
    const top2H = (this._dockTop2 && this._dockTop2.visible !== false) ? this._dockTop2H : 0;
    const innerW = this.bounds.width - bw * 2;
    this._contentArea.bounds = {
      x: bw, y: th + menuH + topH + top2H,
      width:  innerW,
      height: this.bounds.height - th - menuH - topH - top2H - botH - bw
    };
    if (this._dockMenu)   this._dockMenu.setBounds({ x:bw, y:th, width:innerW, height:menuH });
    if (this._dockTop)    this._dockTop.setBounds({ x:bw, y:th+menuH, width:innerW, height:topH });
    if (this._dockTop2)   this._dockTop2.setBounds({ x:bw, y:th+menuH+topH, width:innerW, height:top2H });
    if (this._dockBottom) this._dockBottom.setBounds({ x:bw, y:this.bounds.height - bw - botH, width:innerW, height:botH });
    // Always reposition ALL buttons based on current width
    const btnStyle = t.buttonStyle;
    const btnSize = btnStyle === 'circle' ? 14 : 16;
    const btnY = (th - btnSize) / 2;
    if (btnStyle === 'circle') {
      this._closeBtn.bounds = { x:10, y:btnY, width:btnSize, height:btnSize };
      this._minBtn.bounds   = { x:28, y:btnY, width:btnSize, height:btnSize };
      this._maxBtn.bounds   = { x:46, y:btnY, width:btnSize, height:btnSize };
    } else {
      const bx = this.bounds.width - 3*(btnSize+2) - 4;
      this._closeBtn.bounds = { x:bx + 2*(btnSize+2), y:btnY, width:btnSize, height:btnSize };
      this._minBtn.bounds   = { x:bx,                 y:btnY, width:btnSize, height:btnSize };
      this._maxBtn.bounds   = { x:bx + btnSize+2,     y:btnY, width:btnSize, height:btnSize };
    }
    this.markDirty();
  }

  hitTest(x, y) {
    if (!this.visible) return false;
    if (this._state === 'minimized') {
      const ab = this.getAbsoluteBounds(), th = getTheme().window.titleBar.height;
      return rectContains({ x:ab.x, y:ab.y, width:ab.width, height:th }, x, y);
    }
    return rectContains(this.getAbsoluteBounds(), x, y);
  }

  // Dispatch an event to the correct sub-element.
  // ev.x, ev.y are ABSOLUTE canvas coords throughout.
  dispatchEvent(ev) {
    // Title bar buttons (check before content area)
    if (this.closable    && this._hitBtn(this._closeBtn, ev.x, ev.y)) { this._closeBtn.emit(ev); return true; }
    if (this.minimizable && this._hitBtn(this._minBtn,   ev.x, ev.y)) { this._minBtn.emit(ev);   return true; }
    if (this.maximizable && this._hitBtn(this._maxBtn,   ev.x, ev.y)) { this._maxBtn.emit(ev);   return true; }

    // Docked toolbar / status bar (window-relative coords, never scrolled)
    if (this._state !== 'minimized') {
      const ab0 = this.getAbsoluteBounds();
      const lx = ev.x-ab0.x, ly = ev.y-ab0.y;
      // Outside-click : ferme toute DropDown ouverte d'un dock dont la liste déborde.
      if (ev.type === 'mousedown') {
        for (const dock of [this._dockMenu, this._dockTop, this._dockTop2, this._dockBottom]) {
          if (!dock || !dock.visible) continue;
          const dlx = lx-dock.bounds.x, dly = ly-dock.bounds.y;
          for (const c of (dock.children||[])) {
            if (c instanceof DropDown && c._open && !rectContains(c.bounds, dlx, dly) && !rectContains(c._listRect(), dlx, dly)) c.close();
          }
        }
      }
      // Routage : hitTest du dock (réclame la zone d'une liste DropDown qui déborde).
      for (const dock of [this._dockMenu, this._dockTop, this._dockTop2, this._dockBottom]) {
        if (!dock || !dock.visible) continue;
        if (dock.hitTest(lx, ly)) { const re = { ...ev, x:lx, y:ly }; dock.dispatchEvent(re); ev.stopped = re.stopped; return true; }
      }
    }

    // Content area: convert to content-relative coords for children
    if (this._state !== 'minimized' && this._caHitAbs(ev.x, ev.y)) {
      const ab = this.getAbsoluteBounds();
      const relX = ev.x - ab.x - this._contentArea.bounds.x + this._contentArea._scrollX;
      const relY = ev.y - ab.y - this._contentArea.bounds.y + this._contentArea._scrollY;
      const relEv = { ...ev, x: relX, y: relY };
      const sorted = [...this._contentArea.children].sort((a, b) => b.zIndex - a.zIndex);
      let handled = false;
      // Outside-click : un clic ailleurs dans la fenêtre ferme toute liste ouverte
      // (même si le clic atterrit sur un autre widget non focusable)
      if (ev.type === 'mousedown') {
        for (const child of sorted) {
          if (child instanceof DropDown && child._open && !rectContains(child.bounds, relX, relY) && !rectContains(child._listRect(), relX, relY)) child.close();
        }
      }
      // First pass: check open DropDown list areas (rendered unclipped, high priority)
      // Applies to click, mousemove AND scroll events
      for (const child of sorted) {
        if (!child.visible || !(child instanceof DropDown) || !child._open) continue;
        const listRect = child._listRect();
        // For scroll: also match if cursor is over the header (natural UX)
        const inList   = rectContains(listRect, relX, relY);
        const inHeader = ev.type === 'scroll' && rectContains(child.bounds, relX, relY);
        if (inList || inHeader) {
          child.dispatchEvent(relEv);
          ev.stopped = relEv.stopped;
          handled = true;
          break;
        }
      }
      // Second pass: normal hit test (uses child.hitTest which handles rotation correctly)
      if (!handled) {
        for (const child of sorted) {
          if (!child.visible) continue;
          if (child.hitTest(relX, relY)) {
            child.dispatchEvent(relEv);
            ev.stopped = relEv.stopped;
            // Scroll not consumed by child → fall through to window content scroll
            if (ev.type !== 'scroll' || relEv.stopped) return true;
            break;
          }
        }
        // Forward scroll events to content area
        if (ev.type === 'scroll') {
          this._contentArea._onScroll(ev);
          this.markDirty();
          return true;
        }
        // Close any open dropdown if this click didn't land on it
        if (ev.type === 'click') {
          for (const child of sorted) {
            if (child instanceof DropDown && child._open && !rectContains(child.bounds, relX, relY)) {
              const listRect = child._listRect();
              if (!rectContains(listRect, relX, relY)) child.close();
            }
          }
        }
      }
    } // end content area if
    // Always let the window itself hear the event (for drag/resize start)
    this.emit(ev);
    return true;
  }

  render(ctx) {
    const t = getTheme().window, b = this.bounds;
    const th = t.titleBar.height, bw = t.border.width, r = t.borderRadius;
    ctx.save();
    if (this._animScale != null && this._animScale !== 1) {
      const cx2 = b.x+b.width/2, cy2 = b.y+b.height/2;
      ctx.translate(cx2,cy2); ctx.scale(this._animScale,this._animScale); ctx.translate(-cx2,-cy2);
    }
    if (this._animOpacity != null && this._animOpacity !== 1) {
      ctx.globalAlpha *= Math.max(0, this._animOpacity);
    }
    if (this._state === 'minimized' && (!this._anim || (this._anim.type !== 'minimize' && this._anim.type !== 'unminimize'))) {
      this._renderTitleBar(ctx, b, th);
      ctx.restore(); return;
    }
    if (t.shadow) applyShadow(ctx, t.shadow);
    ctx.fillStyle = colorToCSS(t.body.background);
    drawRoundRect(ctx, b.x, b.y, b.width, b.height, r); ctx.fill();
    clearShadow(ctx);
    ctx.strokeStyle = colorToCSS(t.border.color); ctx.lineWidth = bw;
    drawRoundRect(ctx, b.x+.5, b.y+.5, b.width-1, b.height-1, r); ctx.stroke();
    this._renderTitleBar(ctx, b, th);
    // Render content area (ctx is in canvas space, contentArea.render handles translation)
    ctx.save();
    ctx.translate(b.x, b.y);
    this._contentArea.render(ctx);
    // Docked chrome on top of the content (window-relative, no scroll)
    if (this._dockMenu)   this._dockMenu.render(ctx);
    if (this._dockTop)    this._dockTop.render(ctx);
    if (this._dockTop2 && this._dockTop2.visible !== false) this._dockTop2.render(ctx);
    if (this._dockBottom) this._dockBottom.render(ctx);
    // La liste d'une DropDown débordant d'une barre dockée doit passer AU-DESSUS
    // des barres suivantes : on la repeint après toutes les autres.
    for (const dock of [this._dockMenu, this._dockTop, this._dockTop2, this._dockBottom]) {
      if (!dock || dock.visible === false || !dock.children) continue;
      for (const c of dock.children) {
        if (c instanceof DropDown && c._open) {
          ctx.save(); ctx.translate(dock.bounds.x, dock.bounds.y);
          c._renderList(ctx); ctx.restore(); continue; }
        if (typeof c._renderOpenPopups === 'function') {
          ctx.save(); ctx.translate(dock.bounds.x, dock.bounds.y);
          c._renderOpenPopups(ctx); ctx.restore(); } } }
    ctx.restore();
    ctx.restore();
  }

  _renderTitleBar(ctx, b, th) {
    const t = getTheme().window;
    const ts = this._active ? t.titleBar : (t.titleBar.inactive || t.titleBar);
    ctx.save();
    ctx.beginPath();
    if (this._state === 'minimized') {
      drawRoundRect(ctx, b.x, b.y, b.width, th, t.borderRadius);
    } else {
      const cr = t.borderRadius;
      ctx.moveTo(b.x+cr, b.y);
      ctx.lineTo(b.x+b.width-cr, b.y);
      ctx.arcTo(b.x+b.width, b.y, b.x+b.width, b.y+cr, cr);
      ctx.lineTo(b.x+b.width, b.y+th);
      ctx.lineTo(b.x, b.y+th);
      ctx.lineTo(b.x, b.y+cr);
      ctx.arcTo(b.x, b.y, b.x+cr, b.y, cr);
      ctx.closePath();
    }
    drawGradient(ctx, b.x, b.y, b.width, th, ts.background);
    ctx.fill();

    // Title text — fixed size, never scales
    const font = t.titleBar.font;
    ctx.font = `${font.weight||'bold'} ${font.size}px ${font.family}`;
    ctx.fillStyle = colorToCSS(ts.text);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(this.title, b.x + b.width/2, b.y + th/2, b.width - 120);

    // Buttons
    this._renderWinBtn(ctx, this._closeBtn, t.closeButton,    b, t.buttonStyle);
    if (this.minimizable) this._renderWinBtn(ctx, this._minBtn, t.minimizeButton, b, t.buttonStyle);
    if (this.maximizable) this._renderWinBtn(ctx, this._maxBtn, t.maximizeButton, b, t.buttonStyle);
    ctx.restore();
  }

  _renderWinBtn(ctx, btn, colors, wb, style) {
    const bx = wb.x + btn.bounds.x, by = wb.y + btn.bounds.y;
    const bw2 = btn.bounds.width, bh = btn.bounds.height;
    const cx = bx + bw2/2, cy = by + bh/2;
    const color = btn.pressed ? colors.pressed : btn.hovered ? colors.hover : colors.normal;
    ctx.save();
    ctx.fillStyle = colorToCSS(color);
    if (style === 'circle') {
      ctx.beginPath(); ctx.arc(cx, cy, bw2/2, 0, Math.PI*2); ctx.fill();
      if (btn.hovered) {
        ctx.strokeStyle = colorToCSS({ ...colors.icon, a: 0.8 });
        ctx.lineWidth = 1.5; ctx.lineCap = 'round';
        if (btn.role === 'close') {
          ctx.beginPath(); ctx.moveTo(cx-3,cy-3); ctx.lineTo(cx+3,cy+3);
          ctx.moveTo(cx+3,cy-3); ctx.lineTo(cx-3,cy+3); ctx.stroke();
        } else if (btn.role === 'minimize') {
          ctx.beginPath(); ctx.moveTo(cx-3,cy); ctx.lineTo(cx+3,cy); ctx.stroke();
        } else if (btn.role === 'maximize') {
          ctx.strokeRect(cx-3, cy-3, 6, 6);
        }
      }
    } else {
      ctx.fillRect(bx, by, bw2, bh);
      ctx.strokeStyle = colorToCSS({ ...colors.normal, a: 0.5 });
      ctx.lineWidth = 1; ctx.strokeRect(bx+.5, by+.5, bw2-1, bh-1);
      ctx.strokeStyle = colorToCSS(colors.icon);
      ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      if (btn.role === 'close') {
        ctx.beginPath(); ctx.moveTo(bx+4,by+4); ctx.lineTo(bx+bw2-4,by+bh-4);
        ctx.moveTo(bx+bw2-4,by+4); ctx.lineTo(bx+4,by+bh-4); ctx.stroke();
      } else if (btn.role === 'minimize') {
        ctx.beginPath(); ctx.moveTo(bx+3,by+bh-4); ctx.lineTo(bx+bw2-3,by+bh-4); ctx.stroke();
      } else if (btn.role === 'maximize') {
        if (this._state === 'maximized') {
          ctx.strokeRect(bx+5,by+3,bw2-8,bh-8); ctx.strokeRect(bx+3,by+5,bw2-8,bh-8);
        } else ctx.strokeRect(bx+3,by+3,bw2-6,bh-6);
      }
    }
    ctx.restore();
  }
}

// ---- WINDOW MANAGER ----
class WindowManager extends BaseWidget {
  constructor(bounds) {
    super(undefined, bounds);
    this._windows = []; this._activeWindow = null; this._focusedWidget = null;
    this._hoveredWidget = null; this._draggedWindow = null;
    this._tooltipWidget = null; this._tooltipTimer = 0;
    this._tooltipVisible = false; this._tooltipPos = { x:0, y:0 };
    this._tooltipAppearTime = 0; this._tooltipAppearDuration = 300;
    this._tooltipFadingOut = false; this._tooltipFadeDuration = 150;
    this._mousePos = { x:0, y:0 };
    this._mouseDown = false;
  }

  addWindow(win) {
    this._windows.push(win); win.parent=this; this._activate(win);

      // Internal column separators — only draw the gap zone, not over cells
      for (let ci = 1; ci < cols.length - 1; ci++) {

        // Draw dashed line through the gap width

        ctx.beginPath();
        ctx.moveTo(px + pad.l, ey - gapH/2 + 0.5);
        ctx.lineTo(px + pw - pad.r, ey - gapH/2 + 0.5);
        ctx.stroke();
      }

      // ── Panel outer border ──
      ctx.setLineDash([5, 3]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = 'rgba(80, 80, 220, 0.8)';

      // ── Size annotations — outside the panel, in the padding zone ──
      ctx.font = 'bold 8px monospace';
      ctx.fillStyle = 'rgba(50, 50, 180, 0.9)';
      ctx.textBaseline = 'bottom';
      ctx.textAlign = 'center';

      if (pad.t >= 9) {

          if (cw2 < 20) continue;

      // Row heights in left padding
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      if (pad.l >= 10) {

    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';

    ctx.restore();

    ctx.restore();
  }

}

// ── Palettes dérivées pour les nouveaux widgets (suit le thème actif) ───────
function _augmentExtraThemes() {
  for (const key in themes) {
    const T = themes[key];
    const dark    = _lum(T.window.body.background) < 0.45;
    const accent  = _solid(T.slider.fill.background) || _solid(T.button.toggled.background);
    const text    = _solid(T.label.text);
    const subtle  = _solid(T.label.disabledText);
    const surface = _solid(T.listBox.background);
    const border  = _solid(T.listBox.border.color);
    const onAccent= _solid(T.dropdown.itemSelectedText) || hexToColor('#FFFFFF');

    T.toggleSwitch = {
      trackOff: dark ? _mix(surface,{r:0,g:0,b:0},0.25) : _mix(border,{r:255,g:255,b:255},0.2),
      trackOn:  accent, knob: hexToColor('#FFFFFF'),
      knobShadow: { x:0, y:1, blur:3, color:{r:0,g:0,b:0,a:0.35} },
    };
    T.menuBar = {
      background: _rgba(border, dark?0.16:0.08), text, font: T.label.font,
      hoverBg: _rgba(accent,0.18), hoverText: text, openBg: _rgba(accent,0.30),
    };
    T.accordion = {
      headerBg: _rgba(border, dark?0.22:0.10), headerHover: _rgba(accent,0.16),
      headerText: text, font: { ...T.label.font, weight:'bold' },
      border: T.listBox.border, body: _rgba(surface, dark?0.5:1), chevron: subtle,
    };
    T.toast = {
      background: dark ? _mix(surface,{r:255,g:255,b:255},0.06) : surface,
      text, font: T.label.font, shadow: { x:0, y:4, blur:16, color:{r:0,g:0,b:0,a:0.35} },
      border: T.listBox.border, radius: 8,
      accent: { info: hexToColor('#3A8DDE'), success: hexToColor('#2Fa45a'),
                warning: hexToColor('#F5A623'), error: hexToColor('#E0463C') },
    };
    T.messageDlg = {
      titleBar: T.window.titleBar, titleText: _solid(T.window.titleBar.text),
      body: T.window.body.background, border: T.window.border,
      radius: T.window.borderRadius || 6, text, font: T.label.font,
      shadow: T.window.shadow || { x:0, y:10, blur:30, color:{r:0,g:0,b:0,a:0.5} },
      onAccent,

}
_augmentExtraThemes();

function _dlgWrapLines(text, maxW, font) {
  _measureCtx.font = font;

    const words=para.split(' '); let cur='';
    for (const w of words) { const test=cur?cur+' '+w:w; if(_measureCtx.measureText(test).width<=maxW) cur=test; else { if(cur)out.push(cur); cur=w; } }
    out.push(cur);
  }

  }

  else if (type==='information') { bg='#3A8DDE'; glyph='i'; }

  // opts: { caption, message, dlgType, buttons:[{text,result,isDefault,isCancel}], input, inputValue, inputMask }
  constructor(opts={}) {

      ca.addChild(this._input);

// ── Adaptive window sizing ───────────────────────────────────────────────
// Returns { w, h, x, y } that fits the current viewport
function winBounds(desiredW, desiredH, offsetX=0, offsetY=0) {
  const vw = canvas.width, vh = canvas.height;
  const margin = isTouchDevice() ? 8 : 20;
  const w = Math.min(desiredW, vw - margin*2);
  const h = Math.min(desiredH, vh - margin*2);
  const x = Math.max(margin, Math.min(offsetX || Math.floor((vw-w)/2), vw-w-margin));
  const y = Math.max(margin, Math.min(offsetY || Math.floor((vh-h)/2), vh-h-margin));
  return {x, y, width:w, height:h};
}

// ── Canvas resize ─────────────────────────────────────────────────────────
let engine = null;

function resizeCanvas() {
  canvas.width  = container.clientWidth;
  canvas.height = container.clientHeight;
  if (engine) {
    engine.windowManager.bounds.width  = canvas.width;
    engine.windowManager.bounds.height = canvas.height;
    engine._offscreen.width  = canvas.width;
    engine._offscreen.height = canvas.height;
    engine._fullRedraw = true;
    // Nudge any windows that are now out of bounds back into view
    for (const win of engine.windowManager.windows) {
      const b = win.bounds, m = 10;
      if (b.x + b.width  > canvas.width  - m) win.bounds.x = Math.max(m, canvas.width  - b.width  - m);
      if (b.y + b.height > canvas.height - m) win.bounds.y = Math.max(m, canvas.height - b.height - m);
      if (b.x < m) win.bounds.x = m;
      if (b.y < m) win.bounds.y = m;
    }
  }
}

// milieux, et dépose les empreintes à pas constant (pas d'amas dans les virages).

    this.spacing = Math.max(0.5, this.r * (opts.spacing ?? 0.12));
    this.stampFn = opts.stamp || null;         // empreinte personnalisée (tampon de clonage)
    this.pts = []; this.carry = 0;
    // Un pinceau dur se dessine mieux au trait (anticrénelage natif, pas d'empilement)

    const n = Math.max(2, Math.ceil(len / Math.max(0.4, this.spacing*0.5)));

    for (let i = 1; i <= n; i++) {

      const p = { x: u*u*a.x + 2*u*t*b.x + t*t*c.x, y: u*u*a.y + 2*u*t*b.y + t*t*c.y };
      const d = Math.hypot(p.x-prev.x, p.y-prev.y);
      this.carry += d;
      while (this.carry >= this.spacing) {
        const k = 1 - (this.carry - this.spacing)/Math.max(1e-6, d);
        this._stamp(prev.x + (p.x-prev.x)*k, prev.y + (p.y-prev.y)*k);

// ── Poignées de transformation (déplacement / redim / rotation) ────────────

const PSHAPES = [

  { id:'cloud',     name:'Nuage' },

    case 'star6': poly(star(6, 0.577)); break;

    case 'cross': poly([[0.35,0],[0.65,0],[0.65,0.35],[1,0.35],[1,0.65],[0.65,0.65],[0.65,1],[0.35,1],[0.35,0.65],[0,0.65],[0,0.35],[0.35,0.35]]); break;

  }
}

// ---- Sélection rectangulaire / elliptique ----

function _mkMoveTool(id, name, icon, kind) {
  return _tool({
    id, name, icon, cursor:'move',
    options: [{ kind:'label', text: kind === 'pixels' ? 'Déplacez, redimensionnez ou faites pivoter les pixels sélectionnés.' : 'Déplacez ou transformez le contour de la sélection.' }],
    onDown(app, p, e) {
      if (!app.gizmo || app.gizmo.kind !== kind) {
        if (app.gizmo) app.gizmo.commit();
        if (!app.doc.selection) app.doc.selectAll();
        app.gizmo = new MoveGizmo(app, kind);
      }
      const h = app.gizmo.hit(p) || 'move';
      app.act = { handle:h, start: app.gizmo.startDrag(h, p) };
    },
    onMove(app, p, e, down) { if (down && app.act && app.gizmo) app.gizmo.drag(app.act.handle, p, app.act.start, e.shiftKey); },
    onUp(app) { app.act = null; },
    onDraw(app, ctx, view) { if (app.gizmo && app.gizmo.kind === kind) app.gizmo.draw(ctx, view); },
    onKey(app, e) {
      if (!app.gizmo) return false;
      if (e.key === 'Enter') { app.gizmo.commit(); return true; }
      if (e.key === 'Escape') { app.gizmo.cancel(); return true; }
      const step = e.ctrlKey ? 10 : 1;
      const map = { ArrowLeft:[-step,0], ArrowRight:[step,0], ArrowUp:[0,-step], ArrowDown:[0,step] };
      if (map[e.key]) { app.gizmo.tx += map[e.key][0]; app.gizmo.ty += map[e.key][1]; app.gizmo.refresh(); return true; }
      return false;
    },
    onDeactivate(app) { if (app.gizmo) app.gizmo.commit(); },
  });
}

const GRAD_TYPES = [
  { v:'linear',   t:'Linéaire' },
  { v:'reflected',t:'Linéaire réfléchi' },
  { v:'radial',   t:'Radial' },
  { v:'diamond',  t:'Diamant' },
  { v:'conical',  t:'Conique' },
];
_tool({
  id:'gradient', name:'Dégradé', icon:'t_gradient', cursor:'crosshair',
  options:[
    { kind:'label', text:'Type :' },
    { kind:'combo', key:'type', items:GRAD_TYPES, width:150 },
    { kind:'label', text:'Couleur :' },
    { kind:'combo', key:'mode', items:[{v:'color',t:'Couleur'},{v:'alpha',t:'Transparence'}], width:120 },
    { kind:'check', key:'rev', text:'Inverser' },
  ],
  onDown(app, p, e) {
    app.act = { a:p, b:p, right: e.button === 2 };
    app.doc.startPreview(app.opt('gradient','mode') === 'alpha' ? 'erase' : 'over');
    this._render(app);
  },
  onMove(app, p, e, down) { if (down && app.act) { app.act.b = p; app.act.shift = e.shiftKey; this._render(app); } },
  onUp(app) { if (!app.act) return; app.act = null; app.doc.commitPreview('Dégradé', 'gradient'); },
  _render(app) {
    const a = app.act; if (!a || !app.doc.preview) return;
    const d = app.doc, c = d.preview.ctx;
    c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, d.width, d.height);
    let { x:x0, y:y0 } = a.a, { x:x1, y:y1 } = a.b;
    if (a.shift) { const ang = Math.round(Math.atan2(y1-y0, x1-x0)/(Math.PI/4))*(Math.PI/4), L = Math.hypot(x1-x0, y1-y0); x1 = x0+Math.cos(ang)*L; y1 = y0+Math.sin(ang)*L; }
    const type = app.opt('gradient','type'), alphaMode = app.opt('gradient','mode') === 'alpha';
    let c0 = a.right ? app.secondary : app.primary, c1 = a.right ? app.primary : app.secondary;
    if (app.opt('gradient','rev')) { const t = c0; c0 = c1; c1 = t; }
    const rgb0 = _hexRGB(c0), rgb1 = _hexRGB(c1);
    const A0 = alphaMode ? `rgba(0,0,0,1)` : `rgba(${rgb0.r},${rgb0.g},${rgb0.b},${app.primaryAlpha/255})`;
    const A1 = alphaMode ? `rgba(0,0,0,0)` : `rgba(${rgb1.r},${rgb1.g},${rgb1.b},${app.secondaryAlpha/255})`;
    const len = Math.max(0.001, Math.hypot(x1-x0, y1-y0));
    let g;
    if (type === 'radial') { g = c.createRadialGradient(x0, y0, 0, x0, y0, len); g.addColorStop(0, A0); g.addColorStop(1, A1); c.fillStyle = g; c.fillRect(0, 0, d.width, d.height); }
    else if (type === 'conical') {
      const ang = Math.atan2(y1-y0, x1-x0);
      g = c.createConicGradient ? c.createConicGradient(ang, x0, y0) : null;
      if (g) { g.addColorStop(0, A0); g.addColorStop(0.5, A1); g.addColorStop(1, A0); c.fillStyle = g; c.fillRect(0, 0, d.width, d.height); }
    }
    else if (type === 'diamond') {
      // losange : 4 dégradés linéaires en éventail
      c.save(); c.translate(x0, y0); c.rotate(Math.atan2(y1-y0, x1-x0));
      for (let i = 0; i < 4; i++) {
        c.save(); c.rotate(i*Math.PI/2);
        const gg = c.createLinearGradient(0, 0, len, 0); gg.addColorStop(0, A0); gg.addColorStop(1, A1);
        c.fillStyle = gg; c.beginPath(); c.moveTo(0, 0); c.lineTo(len*3, -len*3); c.lineTo(len*3, len*3); c.closePath(); c.fill(); c.restore();
      }
      c.restore();
    }
    else {
      g = c.createLinearGradient(x0, y0, x1, y1);
      if (type === 'reflected') { g.addColorStop(0, A1); g.addColorStop(0.5, A0); g.addColorStop(1, A1); }
      else { g.addColorStop(0, A0); g.addColorStop(1, A1); }
      c.fillStyle = g; c.fillRect(0, 0, d.width, d.height);
    }
    d.touch();
  },
  onDraw(app, ctx, view) {
    const a = app.act; if (!a) return;
    const p0 = view.imgToView(a.a.x, a.a.y), p1 = view.imgToView(a.b.x, a.b.y);
    ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000';
    for (const q of [p0, p1]) { ctx.beginPath(); ctx.arc(q.x, q.y, 4, 0, 7); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  },
});

    const d = app.doc;

    const mc = mask.getContext('2d');
    const stamp = (x, y) => {
      const s = mask.width, h = s/2;
      mc.clearRect(0, 0, s, s);
      mc.globalCompositeOperation = 'source-over';

      mc.globalCompositeOperation = 'destination-in';
      mc.drawImage(_brushSprite(r, hard, '#000000'), 0, 0);
      mc.globalCompositeOperation = 'source-over';

// Dialogue de paramètres générique : lignes label + widget, aperçu en direct,
// boutons OK / Annuler / Réinitialiser (comme les effets de Paint.NET).
class PDialog extends GUIWindow {
  // params: [{key,label,type:'slider'|'num'|'check'|'combo'|'color'|'angle',min,max,step,def,items,decimals}]
  constructor(title, params, opts = {}) {
    const W = opts.width ?? 400;
    const rows = params.length;
    const H = 40 + rows*34 + 54 + getTheme().window.titleBar.height;
    super(title, { x:0, y:0, width:W, height:H });
    this.modal = true; this.resizable = false; this.minimizable = false; this.maximizable = false;

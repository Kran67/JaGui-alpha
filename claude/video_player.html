    ['← / →', 'Reculer / avancer de 10 s'],
    ['Maj + ← / →', 'Reculer / avancer de 5 s'],
    ['Ctrl + ← / →', 'Reculer / avancer d’une minute'],
    ['↑ / ↓', 'Volume + / −'],
    ['M', 'Muet'],
    ['N / P', 'Piste suivante / précédente'],
    ['F ou double-clic', 'Plein écran'],
    ['S', 'Capture d’image'],
    ['L', 'Afficher / masquer la liste de lecture'],
    ['V', 'Afficher / masquer les sous-titres'],
    ['G / H', 'Décalage des sous-titres − / + 0,5 s'],
    ['+ / −', 'Zoom avant / arrière'],
    ['0', 'Zoom 100 %'],
    ['Ctrl + O / U', 'Ouvrir un fichier / une URL'],
    ['Ctrl + I', 'Informations sur le média'],
    ['Échap', 'Quitter le plein écran'],
    ['Molette sur l’image', 'Volume'],
    ['Glisser-déposer', 'Ajouter des médias et des sous-titres'],
  ], [520, 560]);
}

function vpAbout() {
  Dialogs.showMessage(
    'Lecteur audio / vidéo — Canvas GUI Framework\n\n' +
    'Décodage : élément <video> natif du navigateur (aucune bibliothèque externe).\n' +
    'Sous-titres : analyseurs maison SRT, WebVTT, ASS/SSA, MicroDVD, SAMI, LRC, TTML.\n' +
    'Audio : WebAudio (égaliseur 10 bandes, balance, visualiseur).\n' +
    'Métadonnées : ID3v1/v2, Vorbis (FLAC/Ogg), MP4 ilst, RIFF INFO.',
    { caption: 'À propos' });
}

// ════════════════════════════════════════════════════════════════════════
//  Raccourcis clavier + glisser-déposer
// ════════════════════════════════════════════════════════════════════════
function vpTyping() {
  const f = engine.windowManager._focusedWidget;
  return !!(f && (f instanceof TextBox || (typeof CodeEditor !== 'undefined' && f instanceof CodeEditor)));
}
window.addEventListener('keydown', e => {
  if (!vpWin || !vpWin.visible || vpTyping()) return;
  const p = vpPlayer(), k = e.key;
  // la liste de lecture garde ses touches de navigation quand elle a le focus
  const foc = engine.windowManager._focusedWidget;
  if (foc instanceof ListView && (k.indexOf('Arrow') === 0 || k === 'Home' || k === 'End' || k === 'Enter')) return;
  const step = e.ctrlKey ? 60 : e.shiftKey ? 5 : 10;
  let done = true;
  switch (k) {
    case ' ': case 'k': case 'K': p.togglePlay(); break;
    case 'ArrowLeft': p.seekBy(-step); break;
    case 'ArrowRight': p.seekBy(step); break;
    case 'ArrowUp': p.setVolume(p.volume + 5); if (vpView) vpView.osd('Volume ' + p.volume + ' %'); break;
    case 'ArrowDown': p.setVolume(p.volume - 5); if (vpView) vpView.osd('Volume ' + p.volume + ' %'); break;
    case 'm': case 'M': p.toggleMute(); if (vpView) vpView.osd(p.muted ? 'Muet' : 'Volume ' + p.volume + ' %'); break;
    case 'n': case 'N': p.next(); break;
    case 'p': case 'P': p.prev(); break;
    case 'f': case 'F': vpToggleFullscreen(); break;
    case 's': case 'S': vpSnapshot(); break;
    case 'l': case 'L': vpTogglePlaylist(); break;
    case 'v': case 'V': if (vpView) { vpView.showSubs = !vpView.showSubs; vpView.osd(vpView.showSubs ? 'Sous-titres affichés' : 'Sous-titres masqués'); } break;
    case 'g': case 'G': p.setSubDelay(p.subDelay - 0.5); if (vpView) vpView.osd('Sous-titres ' + p.subDelay.toFixed(1) + ' s'); break;
    case 'h': case 'H': p.setSubDelay(p.subDelay + 0.5); if (vpView) vpView.osd('Sous-titres +' + p.subDelay.toFixed(1) + ' s'); break;
    case '+': case '=': if (vpView) vpView.setZoom(vpView.zoom * 1.25); break;
    case '-': if (vpView) vpView.setZoom(vpView.zoom / 1.25); break;
    case '0': if (vpView) vpView.setZoom(1); break;
    case 'Escape':
      // sortir du plein écran, sauf si un menu / sélecteur est ouvert par-dessus
      if (vpFsLayer && !engine.windowManager.children.some(c => c !== vpFsLayer)) vpExitFullscreen();
      else done = false;
      break;
    case 'o': case 'O': if (e.ctrlKey) vpOpenFiles(); else done = false; break;
    case 'u': case 'U': if (e.ctrlKey) vpOpenUrlDialog(); else done = false; break;
    case 'i': case 'I': if (e.ctrlKey) vpMediaInfoWindow(); else done = false; break;
    default: done = false;
  }
  if (done) { e.preventDefault(); e.stopPropagation(); engine._fullRedraw = true; }
}, true);

(function vpInstallDnD() {
  const host = document.getElementById('canvasContainer');
  if (!host) return;
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  host.addEventListener('dragover', e => { stop(e); e.dataTransfer.dropEffect = 'copy'; });
  host.addEventListener('drop', e => {
    stop(e);
    const p = vpPlayer();
    if (!vpWin) openVideoPlayerWindow();
    const files = [...(e.dataTransfer.files || [])];
    if (files.length) { p.addFiles(files, { play: !p.current }); vpRefreshAll(); vpToast('success', files.length + ' fichier(s) déposé(s)'); return; }
    const txt = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (txt && /^https?:/i.test(txt.trim())) { p.addUrl(txt.trim(), { play: true }); vpRefreshAll(); }
  });
})();

window.toggleDebugHit = function () {
  _debugHitTest = !_debugHitTest;
  const btn = document.getElementById('debugHitBtn');
  if (btn) btn.style.outline = _debugHitTest ? '2px solid #f80' : '';
  engine.windowManager.markDirty();
  engine._fullRedraw = true;
};

// ── API publique ──────────────────────────────────────────────────────────
window.VideoPlayer = {
  open: () => openVideoPlayerWindow(),
  get player() { return vpPlayer(); },
  get view() { return vpView; },
  addUrl: (u, o) => { vpPlayer(); const it = VP.addUrl(u, o); vpRefreshAll(); return it; },
  addFiles: (f, o) => { vpPlayer(); const a = VP.addFiles(f, o); vpRefreshAll(); return a; },
  play: () => vpPlayer().play(), pause: () => vpPlayer().pause(), stop: () => vpPlayer().stop(),
  seek: t => vpPlayer().seek(t), volume: v => vpPlayer().setVolume(v),
  subtitles: (text, name) => vpPlayer().addSubtitleText(text, name || 'piste'),
  parseSubtitles: vpParseSubtitles, cuesAt: vpCuesAt, toText: vpCuesToText,
  tags: VPTags, formats: { video: VP_VIDEO_EXT, audio: VP_AUDIO_EXT, subs: VP_SUB_EXT, probes: VP_CODEC_PROBES },
  equalizer: () => vpEqualizerWindow(), subtitleStyle: () => vpSubStyleWindow(), info: () => vpMediaInfoWindow(),
  snapshot: () => vpSnapshot(), fullscreen: () => vpToggleFullscreen(),
  MediaPlayer, MediaView, VPPlaylistPanel, VPControlBar,
  // poignées pour les scripts et les tests (le module n'expose rien d'autre)
  get engine() { return engine; },
  get wm() { return engine.windowManager; },
  get window() { return vpWin; },
  get controls() { return vpCtrl; },
  get playlistPanel() { return vpPlist; },
};
window.vpOpenFiles = vpOpenFiles;
window.vpOpenUrlDialog = vpOpenUrlDialog;
window.vpEqualizerWindow = vpEqualizerWindow;
window.vpFormatsWindow = vpFormatsWindow;
window.vpShortcutsWindow = vpShortcutsWindow;
window.vpAbout = vpAbout;

// ── Lancement ─────────────────────────────────────────────────────────────
openVideoPlayerWindow();

engine.start();
</script>

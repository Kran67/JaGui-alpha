// ── Accordion : sections repliables (vrais widgets dans chaque panneau) ──────
class Accordion extends ContainerWidget {
  constructor(bounds, opts={}) {
    super('accordion_'+(++_idCounter), bounds);
    this.multiExpand = opts.multiExpand ?? false;
    this.headerH = opts.headerH ?? 34;
    this.gap = opts.gap ?? 4;
    this._sections = [];          // {title,icon,panel,expanded,bodyH,anim,_hoverHdr}
    this._hoverIdx = -1;
    this.on('mousemove', e => { const i=this._headerAt(e.x-this.bounds.x, e.y-this.bounds.y); if(i!==this._hoverIdx){ this._hoverIdx=i; this.markDirty(); } });
    this.on('mouseleave', () => { if(this._hoverIdx!==-1){ this._hoverIdx=-1; this.markDirty(); } });
    this.on('click', e => { const i=this._headerAt(e.x-this.bounds.x, e.y-this.bounds.y); if(i>=0) this.toggle(i); });
  }
  addSection(title, panel, opts={}) {
    panel = panel || new Panel({ x:0, y:0, width:this.bounds.width, height:opts.height ?? 100 });
    const sec = { title, icon:opts.icon ?? null, panel,
      expanded:!!opts.expanded, bodyH:opts.height ?? panel.bounds.height, anim:opts.expanded?1:0 };
    panel.visible = sec.expanded;
    this.addChild(panel); this._sections.push(sec); this._relayout(); this.markDirty();
    return sec;
  }
  toggle(i) {
    const sec=this._sections[i]; if(!sec) return;
    sec.expanded=!sec.expanded;
    if (sec.expanded && !this.multiExpand) for(let j=0;j<this._sections.length;j++) if(j!==i) this._sections[j].expanded=false;
    this.markDirty();
  }
  _headerAt(lx, ly) {
    if (lx<0 || lx>this.bounds.width) return -1;
    let y=0;
    for (let i=0;i<this._sections.length;i++) {
      if (ly>=y && ly<y+this.headerH) return i;
      y += this.headerH + this._sections[i].anim*this._sections[i].bodyH + this.gap;
    }
    return -1;
  }
  _relayout() {
    let y=0;
    for (const sec of this._sections) {
      sec.panel.bounds.x=0; sec.panel.bounds.y=y+this.headerH;
      sec.panel.bounds.width=this.bounds.width; sec.panel.bounds.height=sec.bodyH;
      y += this.headerH + sec.anim*sec.bodyH + this.gap;
    }
    this.bounds.height = Math.max(this.headerH, y - this.gap);
  }
  setSize(w,h){ super.setSize(w,h); for(const s of this._sections) s.panel.bounds.width=w; this._relayout(); }
  update(dt) {
    let moving=false;
    for (const sec of this._sections) {
      const target=sec.expanded?1:0;
      if (sec.anim!==target) { const step=dt/180; sec.anim += target>sec.anim?step:-step; sec.anim=Math.max(0,Math.min(1,sec.anim)); moving=true; sec.panel.visible = sec.anim>0.001; }
      else sec.panel.visible = sec.expanded;
    }
    if (moving) { this._relayout(); this.markDirty(); }
    super.update(dt);
  }
  render(ctx) {
    const t=getTheme().accordion, b=this.bounds;
    ctx.save(); ctx.translate(b.x, b.y);
    let y=0;
    for (let i=0;i<this._sections.length;i++) {
      const sec=this._sections[i];
      // en-tête
      ctx.fillStyle=colorToCSS(i===this._hoverIdx ? t.headerHover : t.headerBg);
      drawRoundRect(ctx,0,y,b.width,this.headerH, sec.anim>0.01?{tl:6,tr:6,br:0,bl:0}:6); ctx.fill();
      ctx.strokeStyle=colorToCSS(t.border.color); ctx.lineWidth=1; drawRoundRect(ctx,0.5,y+0.5,b.width-1,this.headerH-1, sec.anim>0.01?{tl:6,tr:6,br:0,bl:0}:6); ctx.stroke();
      // chevron
      const chx=14, chy=y+this.headerH/2, op=sec.anim;
      ctx.save(); ctx.translate(chx,chy); ctx.rotate(op*Math.PI/2);
      ctx.fillStyle=colorToCSS(t.chevron); ctx.beginPath(); ctx.moveTo(-3,-4); ctx.lineTo(3,0); ctx.lineTo(-3,4); ctx.closePath(); ctx.fill();
      ctx.restore();
      ctx.font=fontToCSS(t.font); ctx.fillStyle=colorToCSS(t.headerText); ctx.textBaseline='middle'; ctx.textAlign='left';
      ctx.fillText((sec.icon?sec.icon+'  ':'')+sec.title, 28, y+this.headerH/2);
      y += this.headerH;
      // corps (clippé selon l'animation)
      const visH = sec.anim*sec.bodyH;
      if (visH>0.5) {
        ctx.save();
        ctx.fillStyle=colorToCSS(t.body); ctx.fillRect(0,y,b.width,visH);
        ctx.strokeStyle=colorToCSS(t.border.color); ctx.lineWidth=1; ctx.strokeRect(0.5,y+0.5,b.width-1,visH-1);
        ctx.beginPath(); ctx.rect(0,y,b.width,visH); ctx.clip();
        sec.panel.render(ctx);   // panel.bounds.y déjà = y (espace accordéon)
        ctx.restore();
      }
      y += sec.bodyH*sec.anim + this.gap;
    }
    ctx.restore();
  }
  // n'expédier aux panneaux que s'ils sont visibles (déplie en cours)
  dispatchEvent(ev) {
    const lx=ev.x-this.bounds.x, ly=ev.y-this.bounds.y;
    const sorted=[...this.children].sort((a,b)=>b.zIndex-a.zIndex);
    for (const c of sorted) {
      if (c.visible && c.hitTest(lx,ly)) { const re={...ev,x:lx,y:ly}; c.dispatchEvent(re); ev.stopped=re.stopped; if(ev.stopped) return true; }
    }
    this.emit(ev); return !ev.stopped;
  }
}

// ── MenuBar : barre de menus horizontale (chaque menu ouvre un popup) ────────
class MenuBar extends BaseWidget {
  constructor(bounds, opts={}) {
    super('menubar_'+(++_idCounter), bounds);
    this.menus = opts.menus ?? [];   // [{label, items:[{label,icon?,action?,separator?,disabled?}]}]
    this.padX = opts.padX ?? 12;
    this._hoverIndex=-1; this._openIndex=-1; this._openPop=null; this.tabIndex=-1;
    this.on('mousemove', e => {
      const i=this._menuAt(e.x);
      if (i!==this._hoverIndex) { this._hoverIndex=i; this.markDirty(); }
      if (this._openIndex>=0 && i>=0 && i!==this._openIndex) this._openMenuAt(i);
    });
    this.on('mouseleave', () => { if(this._hoverIndex!==-1){ this._hoverIndex=-1; this.markDirty(); } });
    this.on('click', e => { const i=this._menuAt(e.x); if(i>=0){ if(this._openIndex===i){ this._closePop(); } else this._openMenuAt(i); } });
  }
  _rects() {
    _measureCtx.font = fontToCSS(getTheme().menuBar.font);
    const r=[]; let x=this.bounds.x;
    for (const m of this.menus) { const w=_measureCtx.measureText(m.label).width+this.padX*2; r.push({x,w}); x+=w; }
    return r;
  }
  _menuAt(ex) { const r=this._rects(); for(let i=0;i<r.length;i++) if(ex>=r[i].x && ex<r[i].x+r[i].w) return i; return -1; }
  _closePop() { if(this._openPop){ this._openPop.close(); this._openPop=null; } this._openIndex=-1; this.markDirty(); }
  _openMenuAt(i) {
    const wm=_rootWM(this); if(!wm||!wm._widgetParentOrigin) return;
    if (this._openPop) { this._openPop.close(); this._openPop=null; }
    const r=this._rects()[i], o=wm._widgetParentOrigin(this);
    // absolu = origine parent + bounds ; le menu s'ouvre SOUS la menubar (≠ par-dessus)
    const x=o.x+r.x, y=o.y+this.bounds.y+this.bounds.height;
    this._openIndex=i; this.markDirty();
    this._openPop=_openMenu(wm, x, y, this.menus[i].items||[], {
      onClose:()=>{ this._openPop=null; this._openIndex=-1; this.markDirty(); },
    });
  }
  render(ctx) {
    const t=getTheme().menuBar, b=this.bounds, rects=this._rects();
    ctx.save();
    // même habillage que la Toolbar (dégradé tiré du corps de fenêtre + filet bas)
    const base=_solid(getTheme().window.body.background);
    const g=ctx.createLinearGradient(0,b.y,0,b.y+b.height);
    g.addColorStop(0,colorToCSS(_mix(base,{r:255,g:255,b:255},0.5))); g.addColorStop(1,colorToCSS(_mix(base,{r:0,g:0,b:0},0.06)));
    ctx.fillStyle=g; ctx.fillRect(b.x,b.y,b.width,b.height);
    ctx.strokeStyle=colorToCSS(_rgba(_solid(getTheme().window.border.color),0.5)); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(b.x,b.y+b.height-.5); ctx.lineTo(b.x+b.width,b.y+b.height-.5); ctx.stroke();
    ctx.font=fontToCSS(t.font); ctx.textBaseline='middle'; ctx.textAlign='center';
    for (let i=0;i<this.menus.length;i++) {
      const r=rects[i], active=i===this._openIndex, hover=i===this._hoverIndex;
      if (active || hover) { ctx.fillStyle=colorToCSS(active?t.openBg:t.hoverBg); drawRoundRect(ctx,r.x+2,b.y+3,r.w-4,b.height-6,4); ctx.fill(); }
      ctx.fillStyle=colorToCSS(active?t.hoverText:t.text);
      ctx.fillText(this.menus[i].label, r.x+r.w/2, b.y+b.height/2);
    }
    ctx.restore();
  }
}

// ── MessageDlg : dialogue modal paramétrable (base des autres dialogues) ─────
const MessageType = { CUSTOM:'custom', INFORMATION:'information', WARNING:'warning', ERROR:'error', CONFIRMATION:'confirmation' };
function _dlgWrapLines(text, maxW, font) {
  _measureCtx.font = font;
  const out=[];
  for (const para of String(text).split('\n')) {
    const words=para.split(' '); let cur='';
    for (const w of words) { const test=cur?cur+' '+w:w; if(_measureCtx.measureText(test).width<=maxW) cur=test; else { if(cur)out.push(cur); cur=w; } }
    out.push(cur);
  }
  return out;
}
function _drawDlgIcon(ctx, type, cx, cy, r) {
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
  if (type==='warning') {
    ctx.fillStyle='#F5A623'; ctx.strokeStyle='#C77F00'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.95,cy+r*0.8); ctx.lineTo(cx-r*0.95,cy+r*0.8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(r*1.1)}px system-ui`; ctx.fillText('!', cx, cy+r*0.2);
    ctx.restore(); return;
  }
  let bg, glyph;
  if (type==='error') { bg='#E0463C'; glyph='✕'; }
  else if (type==='information') { bg='#3A8DDE'; glyph='i'; }
  else if (type==='confirmation') { bg='#5B7CE0'; glyph='?'; }
  else { ctx.restore(); return; }
  ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(r*1.25)}px Georgia, system-ui`; ctx.fillText(glyph, cx, cy+r*0.06);
  ctx.restore();
}
// MessageDlg dérive de GUIWindow : vraie barre de titre (croix WinButton),
// déplaçable, et modale via WindowMan._topModal(). Le corps (icône + message +
// saisie + boutons) vit dans la zone de contenu de la fenêtre.
class MessageDlg extends GUIWindow {
  // opts: { caption, message, dlgType, buttons:[{text,result,isDefault,isCancel}], input, inputValue, inputMask }
  constructor(opts={}) {
    super(opts.caption ?? 'Message', { x:0, y:0, width:360, height:160 });
    this.message = opts.message ?? '';
    this.dlgType = opts.dlgType ?? MessageType.CUSTOM;
    this.buttons = opts.buttons ?? [{ text:'OK', result:'ok', isDefault:true, isCancel:true }];
    this.showInput = !!opts.input;
    this._inputMask = opts.inputMask ?? null;
    // fenêtre modale, non redimensionnable, sans réduire/agrandir
    this.modal = true; this.resizable = false; this.minimizable = false; this.maximizable = false; this.closable = true;
    this._resolveFn=null; this._closed=false; this._wm=null;
    this._defaultBtn=null; this._cancelResult='cancel'; this._input=null;
    this._buildContent(opts.inputValue ?? '');
  }
  _buildContent(inputValue) {
    const ca = this.contentArea;
    // dialogue auto-dimensionné : jamais de scrollbar (taille = contenu)
    ca._contentSize = () => ({ w:0, h:0 });
    // corps dessiné (icône + message) — ne capte aucun évènement
    this._bodyW = new BaseWidget('msgdlgbody_'+(++_idCounter), { x:0, y:0, width:10, height:10 });
    this._bodyW.hitTest = () => false;
    const dlg = this;
    this._bodyW.render = function(ctx) {
      const t=getTheme().messageDlg, bx=this.bounds.x, by=this.bounds.y;
      if (dlg.dlgType!==MessageType.CUSTOM) _drawDlgIcon(ctx, dlg.dlgType, bx+dlg._iconCX, by+dlg._iconCY, dlg._iconR);
      ctx.save(); ctx.font=fontToCSS(t.font); ctx.fillStyle=colorToCSS(t.text); ctx.textBaseline='top'; ctx.textAlign='left';
      const lines=dlg._lines||[]; for(let i=0;i<lines.length;i++) ctx.fillText(lines[i], bx+dlg._msgX, by+dlg._msgY+i*dlg._lh);
      ctx.restore();
    };
    ca.addChild(this._bodyW);
    if (this.showInput) {
      this._input = this._inputMask ? new MaskedTextBox({x:0,y:0,width:10,height:30},{mask:this._inputMask}) : new TextBox({x:0,y:0,width:10,height:30});
      if (inputValue) this._input.value = inputValue;
      this._input.on('submit', () => { const d=this.buttons.find(b=>b.isDefault)||this.buttons[0]; this._finish(d.result); });
      ca.addChild(this._input);
    }
    for (const def of this.buttons) {
      const btn=new Button(def.text, {x:0,y:0,width:80,height:30}); btn.tabIndex=0;
      btn.on('click', () => this._finish(def.result));
      btn.on('keydown', e => { if(e.key==='Enter'||e.key===' '||e.key==='Spacebar'){ this._finish(def.result); e.preventDefault?.(); } });
      def._w = btn; ca.addChild(btn);
      if (def.isDefault) this._defaultBtn=btn;
      if (def.isCancel) this._cancelResult=def.result;
    }
  }
  resizeByContent() {
    const t=getTheme(), th=t.window.titleBar.height, bw=t.window.border.width;
    const pad=16, gap=14, padTop=14;
    const hasIcon = this.dlgType!==MessageType.CUSTOM, iconR=20, iconW=hasIcon?iconR*2:0;
    const maxMsgW=320, font=fontToCSS(t.messageDlg.font);
    const lines=_dlgWrapLines(this.message, maxMsgW, font);
    _measureCtx.font=font;
    const msgW=Math.min(maxMsgW, Math.max(40, ...lines.map(l=>_measureCtx.measureText(l).width)));
    const lh=18, msgH=lines.length*lh;
    const rowW=(iconW?iconW+gap:0)+msgW;
    const inputH=this.showInput?40:0;
    const btnH=30, btnRowH=btnH+20;
    const bodyRowsH=Math.max(iconW, msgH)+inputH;
    const cw=Math.max(280, pad*2+rowW);          // largeur de contenu
    const innerH=padTop+bodyRowsH+btnRowH;        // hauteur de contenu
    this.setBounds({ x:this.bounds.x, y:this.bounds.y, width:cw+bw*2, height:th+innerH+bw });
    this._updateLayout();
    // mise en page (coordonnées dans l'espace de contenu, origine 0,0)
    this._lines=lines; this._lh=lh; this._iconR=iconR; this._iconCX=pad+iconR; this._iconCY=padTop+iconR;
    const msgX=pad+(iconW?iconW+gap:0); this._msgX=msgX; this._msgY=padTop;
    this._bodyW.setBounds({ x:0, y:0, width:cw, height:innerH });
    if (this._input) { this._input.bounds.x=msgX; this._input.bounds.y=padTop+msgH+8; this._input.bounds.width=cw-msgX-pad; this._input.bounds.height=30; }
    _measureCtx.font=fontToCSS(getTheme().button.normal.font);
    let bx=cw-pad;
    for (let i=this.buttons.length-1;i>=0;i--) {
      const def=this.buttons[i], w=Math.max(80, Math.ceil(_measureCtx.measureText(def.text).width)+28);
      def._w.bounds.width=w; def._w.bounds.height=btnH;
      def._w.bounds.x=bx-w; def._w.bounds.y=innerH-btnH-12; bx-=w+8;
    }
  }
  center(wm) { this.bounds.x=Math.round((wm.bounds.width-this.bounds.width)/2); this.bounds.y=Math.round((wm.bounds.height-this.bounds.height)/2.4); }
  showModal(wm) {
    this._wm=wm; this._closed=false; this.resizeByContent(); this.center(wm);
    wm.addWindow(this);
    if (this._input) wm._setFocus(this._input);
    else if (this._defaultBtn) wm._setFocus(this._defaultBtn);
    wm.markDirty();
    return new Promise(res => { this._resolveFn=res; });
  }
  _finish(result) {
    if (this._closed) return; this._closed=true;
    const value=this._input?this._input.value:null;
    this._resolveFn && this._resolveFn({ result, value });
    super._onClose();   // animation de fermeture + removeWindow
  }
  // croix de la barre de titre
  _onClose() { this._finish(this._cancelResult); }
  // Échap
  _onCancel() { this._finish(this._cancelResult); }
}

// ── Helpers façon $j.dialogs (renvoient une Promise {result,value}) ──────────
const _BTN = {
  OK:     { text:'OK',      result:'ok',     isDefault:true },
  CANCEL: { text:'Annuler', result:'cancel', isCancel:true  },
  YES:    { text:'Oui',     result:'yes',    isDefault:true },

// ── Toast : notifications non bloquantes (couche dédiée, voir installToasts) ─
function _toastDims(ctx, n) {

}
function _toastRect(wm, i) {

  const n=wm._toasts[i], w=n.w||300;

}

    ctx.fillStyle=colorToCSS(accent); drawRoundRect(ctx,x,y,5,r.h,{tl:th.radius,bl:th.radius,tr:0,br:0}); ctx.fill();

    ctx.fillStyle=colorToCSS(accent); ctx.beginPath(); ctx.arc(x+26,y+r.h/2,11,0,Math.PI*2); ctx.fill();

// Monte la couche toasts sur un WindowManager (patch non intrusif).

  if (wm._toastHost) return wm._toastHost;

  wm.update=function(dt){
    _upd(dt); const arr=wm._toasts; if(!arr.length) return; let changed=false;

      if (!n.dying) { if(n.anim<1){ n.anim=Math.min(1,n.anim+dt/180); changed=true; } if(n.age>=n.dur) n.dying=true; }

    error(m,o={}){ return this.show(m,{...o,type:'error'}); },

// ── Adaptive window sizing ───────────────────────────────────────────────
// Returns { w, h, x, y } that fits the current viewport
function winBounds(desiredW, desiredH, offsetX=0, offsetY=0) {
  const vw = canvas.width, vh = canvas.height;
  const margin = isTouchDevice() ? 8 : 20;
  const w = Math.min(desiredW, vw - margin*2);
  const h = Math.min(desiredH, vh - margin*2);
  const x = Math.max(margin, Math.min(offsetX || Math.floor((vw-w)/2), vw-w-margin));
  const y = Math.max(margin, Math.min(offsetY || Math.floor((vh-h)/2), vh-h-margin));
  return {x, y, width:w, height:h};
}

// ── Canvas resize ─────────────────────────────────────────────────────────
let engine = null;

function resizeCanvas() {
  canvas.width  = container.clientWidth;
  canvas.height = container.clientHeight;
  if (engine) {
    engine.windowManager.bounds.width  = canvas.width;
    engine.windowManager.bounds.height = canvas.height;
    engine._offscreen.width  = canvas.width;
    engine._offscreen.height = canvas.height;
    engine._fullRedraw = true;
    // Nudge any windows that are now out of bounds back into view
    for (const win of engine.windowManager.windows) {
      const b = win.bounds, m = 10;
      if (b.x + b.width  > canvas.width  - m) win.bounds.x = Math.max(m, canvas.width  - b.width  - m);
      if (b.y + b.height > canvas.height - m) win.bounds.y = Math.max(m, canvas.height - b.height - m);
      if (b.x < m) win.bounds.x = m;
      if (b.y < m) win.bounds.y = m;
    }
  }
}

// ── Splitter : draggable divider bar that splits an area into two resizable
//    panes. Reusable primitive — use standalone via .bind(pane1, pane2) or embed
//    inside a bespoke widget (e.g. the Gantt grid/chart divider).
//    orientation 'vertical'   = vertical bar, resizes horizontally (col-resize)
//    orientation 'horizontal' = horizontal bar, resizes vertically (row-resize)
class Splitter extends BaseWidget {
  constructor(bounds, opts = {}) {
    super('splitter_' + (++_idCounter), bounds);
    this.orientation = opts.orientation || 'vertical';
    const vert = this.orientation === 'vertical';
    this.thickness = opts.thickness ?? (vert ? bounds.width : bounds.height) ?? 6;
    this.colors = opts.colors || null;        // {bar,barHover,line,grip,gripHover} override (else theme)
    this.min1 = opts.min1 ?? 60;              // min size of the pane BEFORE the bar
    this.min2 = opts.min2 ?? 60;              // min size of the pane AFTER the bar

    this._pane2 = opts.pane2 || null;

    this.on('mouseleave', () => { if (!this._dragging) { this._hovered = false; this.markDirty(); } });
    this.on('mousedown', e => {
      if (!this.enabled || e.button !== 0) return;
      this._dragging = true;
      this._d0 = vert ? e.x : e.y;
      this._p0 = vert ? this.bounds.x : this.bounds.y;
      this.markDirty();
    });
    this.on('mousemove', e => { if (this._dragging) this._drag(this.orientation === 'vertical' ? e.x : e.y); });
    this.on('mouseup', () => { if (this._dragging) { this._dragging = false; this.markDirty(); } });
  }
  bind(p1, p2) { this._pane1 = p1; this._pane2 = p2; return this; }

      const p1 = this._pane1.bounds, p2 = this._pane2.bounds;
      const lo = (vert ? p1.x : p1.y) + this.min1;
      const hi = (vert ? p2.x + p2.width : p2.y + p2.height) - this.min2 - this.thickness;
      np = Math.max(lo, Math.min(hi, np));

      else      { this.bounds.y = np; p1.height = np - p1.y; p2.y = np + this.thickness; p2.height = end - p2.y; }

      ctx.moveTo(b.x, b.y + .5);             ctx.lineTo(b.x + b.width, b.y + .5);

//  SOUS-TITRES — analyseurs (aucune bibliothèque externe)
//  Modèle : { format, cues:[{start,end,lines:[[seg…]], align, marginV, pos}] }
//  seg = { t, b, i, u, color }   (t = texte, b/i/u = gras/italique/souligné)

function vpParseTS(s) {

// &HAABBGGRR / &HBBGGRR (ASS) → '#rrggbb'
function vpAssColor(v) {

// Une ligne balisée → segments stylés. Gère <b><i><u><font color=…> et {\b1\i1\c&H…}.
function vpRichLine(line, base) {

  const src = String(line);

      const e = src.indexOf('}', k);

          else if (/^i1/.test(t)) st.i = true; else if (/^i0/.test(t)) st.i = false;
          else if (/^u1/.test(t)) st.u = true; else if (/^u0/.test(t)) st.u = false;
          else if (/^r$/.test(t)) { st = Object.assign({ b: false, i: false, u: false, color: null }, base || {}); }
          else if (/^(1?c)&H/i.test(t)) { const c = vpAssColor(t); if (c) st.color = c; }

    if (ch === '<') {                                   // balise HTML-ish
      const e = src.indexOf('>', k);
      if (e > k) {

        const close = tag[0] === '/';
        const name = (close ? tag.slice(1) : tag).split(/[\s>]/)[0].toLowerCase();

          else if (name === 'i' || name === 'em') st.i = !close;
